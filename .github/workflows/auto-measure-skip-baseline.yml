# إطلاقٌ آليٌّ لقياسِ خطِّ أساسِ التخطّي عند انزياحِ النطاقِ (OPS-1/MAIN-DRIFT-WINDOW).
#
# ── لماذا هذا الملفُّ ──
#
# بعدَ دمجٍ يُغيِّرُ نطاقَ القياسِ، يَحمَرُّ `main` بـ`R7/SCOPE-DRIFT` حتّى
# تُعادَ دورةُ القياسِ والنشرِ. وكانَ إطلاقُ القياسِ يدويّاً، فطالَ زمنُ
# الحُمرةِ. هذا المسارُ يَقرأُ الأثرَ المنشورَ ويَحسُبُ بصمةَ نطاقِ `main`
# ويُقارِنُها، فإنِ انحرفَت ⇒ يُطلِقُ القياسَ آليّاً ببصمةٍ كاملةٍ.
#
# ── الفصلُ بينَ القرارِ والتنفيذِ ──
#
# هذا المسارُ يَقرأُ ويَحكُمُ ولا يَكتُبُ في المستودعِ. والقياسُ يَقعُ في
# `measure-skip-baseline.yml` الذي يَأخُذُ تعريفَهُ من `main`، والنشرُ في
# `publish-skip-baseline.yml`. فلا صلاحيّةَ كتابةٍ هنا.
#
# ── ومتى يُطلَقُ ──
#
# بعدَ اكتمالِ CI على `main` — نجاحاً كانَ أم سقوطاً. فإن نجحَ CI فلا انزياحَ
# مُحتملٌ إلّا إن كانَ النطاقُ تغيَّرَ بلا أن يُدخِلَ الأثرَ. وإن سقطَ CI
# بـ`R7/SCOPE-DRIFT` فالقياسُ هو الدواءُ. **لكنَّ سقوطاً أجنبيّاً لا يُطلِقُ
# القياسَ:** الأداةُ تَرفُضُ إن لم يَكُنْ هناكَ انزياحٌ فعلاً، فلا يُنتَجُ
# أثرٌ على شجرةٍ مريضةٍ بلا سببِها.
#
# ── وحدٌّ مُعلَنٌ ──
#
# `OPS-1/BOT-PR-CI` لم يُغلَقْ بعدُ: طلبُ الدمجِ الذي يُنشِئُهُ مسارُ النشرِ
# بـ`GITHUB_TOKEN` لا يُشغِّلُ CI آليّاً. فالنافذةُ تَضيقُ هنا (القياسُ آليٌّ)
# لكن لا تُغلَقُ تماماً (الدمجُ قد يَنتظِرُ تدخُّلاً يدويّاً).

name: قياسٌ آليٌّ عند انزياحِ النطاق

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: write

concurrency:
  group: auto-measure-skip-baseline
  cancel-in-progress: false

jobs:
  check-and-dispatch:
    name: فحصُ الانزياحِ وإطلاقُ القياسِ
    if: github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure'
    runs-on: [self-hosted, linux-vm]
    timeout-minutes: 10
    steps:
      - name: جلبُ الشجرةِ الموثوقةِ (main)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: تبعيّاتُ الأداةِ
        run: npm ci

      - name: جلبُ رأسِ main طازجاً (مادّةُ فحصِ الانزياحِ)
        run: git fetch --no-tags origin main

      - name: فحصُ انزياحِ النطاقِ
        id: drift
        continue-on-error: true
        run: node scripts/check-scope-drift.mjs

      - name: خلاصةُ فحصِ الانزياحِ
        run: |
          if [ "${{ steps.drift.outcome }}" = "success" ]; then
            echo "### ✅ لا انزياحَ — لا قياسَ" >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.drift.outcome }}" = "failure" ]; then
            echo "### ⚠️ انزياحٌ مُكتشَفٌ — يُطلَقُ القياسُ آليّاً" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ⛔ تعذَّرَ فحصُ الانزياحِ" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: إطلاقُ القياسِ إن وُجِدَ انزياحٌ
        if: steps.drift.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          MAIN_HEAD="$(git rev-parse origin/main)"
          echo "إطلاقُ قياسِ خطِّ أساسِ التخطّي على $MAIN_HEAD"
          PAYLOAD=$(node -e "console.log(JSON.stringify({ ref: 'main', inputs: { ref: process.argv[1] } }))" "$MAIN_HEAD")
          HTTP_RESPONSE=$(curl -sS -w '\n%{http_code}' -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -H 'Content-Type: application/json' \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/measure-skip-baseline.yml/dispatches" \
            -d "$PAYLOAD")
          HTTP_CODE=$(echo "$HTTP_RESPONSE" | tail -1)
          RESPONSE_BODY=$(echo "$HTTP_RESPONSE" | sed '$d')
          if [ "$HTTP_CODE" != '204' ]; then
            echo "::error::MEASURE_DISPATCH_FAILED: HTTP $HTTP_CODE"
            echo "$RESPONSE_BODY"
            exit 1
          fi
          echo "✅ أُطلِقَ القياسُ على $MAIN_HEAD"
          echo "### 🚀 أُطلِقَ القياسُ آليّاً على \`$MAIN_HEAD\`" >> "$GITHUB_STEP_SUMMARY"
