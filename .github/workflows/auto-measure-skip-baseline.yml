# إطلاقٌ آليٌّ لقياسِ خطِّ أساسِ التخطّي عند انزياحِ النطاقِ (OPS-1/MAIN-DRIFT-WINDOW).
#
# ── لماذا هذا الملفُّ ──
#
# بعدَ دمجٍ يُغيِّرُ نطاقَ القياسِ، يَحمَرُّ `main` بـ`R7/SCOPE-DRIFT` حتّى
# تُعادَ دورةُ القياسِ والنشرِ. وكانَ إطلاقُ القياسِ يدويّاً، فطالَ زمنُ
# الحُمرةِ. هذا المسارُ يَقرأُ الأثرَ المنشورَ ويَحسُبُ بصمةَ نطاقِ `main`
# ويُقارِنُها، فإنِ انحرفَت ⇒ يُطلِقُ القياسَ آليّاً ببصمةٍ كاملةٍ.
#
# ── الفصلُ بينَ القرارِ والتنفيذِ ──
#
# هذا المسارُ يَقرأُ ويَحكُمُ ولا يَكتُبُ في المستودعِ. والقياسُ يَقعُ في
# `measure-skip-baseline.yml` الذي يَأخُذُ تعريفَهُ من `main`، والنشرُ في
# `publish-skip-baseline.yml`. فلا صلاحيّةَ كتابةٍ هنا.
#
# ── ومتى يُطلَقُ ──
#
# بعدَ **سقوطِ** CI على `main` وحدَهُ: نجاحُ CI يَعني أنَّ `R7` مرَّ فلا انزياحَ.
# ثمَّ ثلاثةُ مراشحَ قبلَ أيِّ إطلاقٍ، كلُّها في `scripts/check-scope-drift.mjs`
# ومقيسةٌ باختباراتِها:
#   ١. موضعُ السقوطِ: يجبُ أن يَنحصِرَ في خطوةِ الاختباراتِ أو خطوةِ حاجزِ خطِّ
#      الأساسِ من `validate`. سقوطُ الفحصِ المُسبَقِ أو الأسلوبِ أو الأنواعِ
#      أو أيِّ خطوةٍ أخرى أجنبيٌّ قطعاً ⇒ لا قياسَ.
#   ٢. الرأسُ: التشغيلةُ المُحرِّكةُ يجبُ أن تَكونَ على رأسِ `main` الحاليِّ،
#      وإلّا فتشغيلةُ الرأسِ الأحدثِ تَحكُمُ.
#   ٣. البصمةُ: انزياحٌ فعليٌّ بينَ بصمةِ النطاقِ والأثرِ المنشورِ.
# وسقوطٌ أجنبيٌّ داخلَ الاختباراتِ نفسِها يَبقى مُمكِناً، **ومُصنِّفُ `LIVE-16`
# في تشغيلةِ القياسِ يَرفضُهُ** (`MEASURE_FOREIGN_FAILURE`) فلا يُنشَرُ أثرٌ عليه.
#
# ── ورموزُ الخروجِ ──
#
# `0` لا قياسَ · `1` انزياحٌ ⇒ إطلاقٌ · `2` عجزٌ عنِ الحُكمِ ⇒ يَحمَرُّ هذا المسارُ
# ولا يُطلَقُ شيءٌ. **فالخطأُ لا يُقرَأُ انزياحاً**، ولا `continue-on-error` هنا:
# التفرُّعُ صريحٌ على رمزِ الخروجِ، وما سوى الرمزَينِ المُعلَنَينِ يُسقِطُ الخطوةَ.

# ── وحدٌّ مُعلَنٌ ──
#
# `OPS-1/BOT-PR-CI` (‏`WL-311`): طلبُ الدمجِ الذي يُنشِئُهُ مسارُ النشرِ بـ`GITHUB_TOKEN`
# لا يُشغِّلُ `pull_request` بوظائفَ، **فصارَ مسارُ النشرِ يُرسِلُ `workflow_dispatch`
# إلى `ci.yml` على فرعِ النشرِ** فيُقيَّدُ «فحص الجودة الكامل» على رأسِ الطلبِ بلا إعادةِ
# فتحٍ. والنافذةُ تَضيقُ (القياسُ والفحصُ آليّانِ) ولا تُغلَقُ تماماً: موافقةُ البيئةِ
# والدمجُ يَبقيانِ بيدٍ — وذاكَ قيدُ المالكِ لا عَطَبٌ.

name: قياسٌ آليٌّ عند انزياحِ النطاق

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: write

concurrency:
  group: auto-measure-skip-baseline
  cancel-in-progress: false

jobs:
  check-and-dispatch:
    name: فحصُ الانزياحِ وإطلاقُ القياسِ
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: جلبُ الشجرةِ الموثوقةِ (main)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: تبعيّاتُ الأداةِ
        run: npm ci

      - name: جلبُ رأسِ main طازجاً (مادّةُ فحصِ الانزياحِ)
        run: git fetch --no-tags origin main

      - name: جلبُ وظائفِ التشغيلةِ المُحرِّكةِ (مادّةُ مرشحِ الموضعِ)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          curl -fsS \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/$RUN_ID/jobs?per_page=100" \
            -o "$RUNNER_TEMP/trigger-jobs.json"

      - name: فحصُ انزياحِ النطاقِ
        id: drift
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set +e
          node scripts/check-scope-drift.mjs --expect-head "$HEAD_SHA" --trigger-jobs "$RUNNER_TEMP/trigger-jobs.json"
          code=$?
          set -e
          rm -f "$RUNNER_TEMP/trigger-jobs.json"
          case "$code" in
            0)
              echo 'drifted=false' >> "$GITHUB_OUTPUT"
              echo '### ✅ لا قياسَ — لا انزياحَ أو لا أهليّةَ' >> "$GITHUB_STEP_SUMMARY"
              ;;
            1)
              echo 'drifted=true' >> "$GITHUB_OUTPUT"
              echo '### ⚠️ انزياحٌ مُكتشَفٌ — يُطلَقُ القياسُ آليّاً' >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "::error::SCOPE_DRIFT_CHECK_ERROR: تعذَّرَ الحُكمُ (exit=$code) — لا يُطلَقُ قياسٌ"
              echo "### ⛔ تعذَّرَ فحصُ الانزياحِ (exit=$code)" >> "$GITHUB_STEP_SUMMARY"
              exit "$code"
              ;;
          esac

      - name: إطلاقُ القياسِ إن وُجِدَ انزياحٌ
        if: steps.drift.outputs.drifted == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          echo "إطلاقُ قياسِ خطِّ أساسِ التخطّي على $HEAD_SHA"
          PAYLOAD=$(node -e "console.log(JSON.stringify({ ref: 'main', inputs: { ref: process.argv[1], publish_channel: 'workflow_dispatch' } }))" "$HEAD_SHA")
          HTTP_RESPONSE=$(curl -sS -w '\n%{http_code}' -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -H 'Content-Type: application/json' \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/measure-skip-baseline.yml/dispatches" \
            -d "$PAYLOAD")
          HTTP_CODE=$(echo "$HTTP_RESPONSE" | tail -1)
          RESPONSE_BODY=$(echo "$HTTP_RESPONSE" | sed '$d')
          if [ "$HTTP_CODE" != '204' ]; then
            echo "::error::MEASURE_DISPATCH_FAILED: HTTP $HTTP_CODE"
            echo "$RESPONSE_BODY"
            exit 1
          fi
          echo "✅ أُطلِقَ القياسُ على $HEAD_SHA"
          echo "### 🚀 أُطلِقَ القياسُ آليّاً على \`$HEAD_SHA\`" >> "$GITHUB_STEP_SUMMARY"
