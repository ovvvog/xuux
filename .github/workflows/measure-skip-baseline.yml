# قياس خطّ أساس التخطّي — يُشغَّل يدويّاً لإعادة قياس الأثر كاملاً.
#
# يَشغَلُ `env -u DATABASE_URL node --test` (بلا قاعدةٍ) لإنتاج TAP،
# ثم يُشغِّلُ `npm run measure:skip-baseline` لكلِّ ارتباطٍ (M11.05 و M11.06)
# ويُحدِّثُ جميعَ الحقولِ في `skip-baseline.json`، ثم يَدفَعُ الأثرَ المُحدَّثَ
# مباشرةً من CI قبل فحصِ الحاجزِ (فالحاجزُ قد يَسقُطُ بـR5/NO-COMMIT
# حتى تُحدَّثَ الخططُ — وهذا يَقعُ في PRٍ منفصلٍ).
#
# LIVE-16: منفذُ الإخفاقِ الذاتيِّ المرجعيِّ يَسمَحُ بتحديثِ الأثرِ حتى
# لو كانَ اختبارُ الحاجزِ ساقطاً (R6/STALE) — ما دامَ الإخفاقُ الوحيدَ.
#
# القياسُ يَستهدفُ main@eba5afcf صراحةً (checkout ref).

name: قياس خطّ أساس التخطّي

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'الكوميت الذي يُقاسُ عليه (افتراضيّاً: eba5afcf)'
        required: false
        default: 'eba5afcf7707ffa5a03e0c75a0afab66070e0551'

permissions:
  contents: write

jobs:
  measure:
    name: قياس خطّ أساس التخطّي الكامل
    runs-on: [self-hosted, linux-vm]
    timeout-minutes: 30

    steps:
      - name: جلب المستودع على الكوميت المحدَّد
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || 'eba5afcf' }}
          fetch-depth: 0

      - name: تهيئة Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: تثبيت التبعيات
        run: npm ci

      - name: التحقّق من الوحدة الأصليّة pkcs11js
        run: |
          if ! node -e "require.resolve('pkcs11js')" 2>/dev/null; then
            npm rebuild pkcs11js || npm install --no-save pkcs11js || true
          fi

      - name: بناء نواة جذر الثقة
        run: npm run build

      - name: تشغيل الاختبارات بلا DATABASE_URL لإنتاج TAP
        # R6/STALE متوقَّعٌ: الأثرُ يقولُ 218 والشجرةُ فيها 219. منفذُ LIVE-16
        # يَسمَحُ بتحديثِ الأثرِ رغمَ ذاكَ الإخفاقِ الذاتيِّ المرجعيِّ.
        continue-on-error: true
        run: |
          env -u DATABASE_URL node --test --test-concurrency=1 --test-timeout=120000 tests/ > /tmp/skip-baseline-measure.tap 2>/tmp/skip-baseline-measure.stderr
          echo "exit: $?"
          echo "=== آخر 10 أسطر TAP ==="
          tail -10 /tmp/skip-baseline-measure.tap
          echo "=== عدّادات TAP ==="
          grep -E "^# (tests|pass|fail|skipped) " /tmp/skip-baseline-measure.tap || true

      - name: قياس خطّ أساس التخطّي — M11.05
        run: |
          node scripts/measure-skip-baseline.mjs /tmp/skip-baseline-measure.tap \
            --engagement M11.05 \
            --plan docs/external-review/M11.05-round-1-plan.md \
            --command "env -u DATABASE_URL npm test"

      - name: قياس خطّ أساس التخطّي — M11.06
        run: |
          node scripts/measure-skip-baseline.mjs /tmp/skip-baseline-measure.tap \
            --engagement M11.06 \
            --plan docs/external-review/M11.06-round-2-plan.md \
            --command "env -u DATABASE_URL npm test"

      - name: عرض الأثر المُحدَّث
        run: cat docs/external-review/skip-baseline.json

      - name: دفع الأثر المُحدَّث مباشرةً من CI
        # الأثرُ يُدفَعُ قبل فحصِ الحاجزِ لأنّ الحاجزَ قد يَسقُطُ بـR5/NO-COMMIT
        # (الخططُ تَحتاجُ تحديثاً منفصلاً لتَعكسَ الكوميتَ الجديد).
        # الأثرُ مُنتَجٌ بالأداةِ في CI لا بيدٍ.
        run: |
          git config --local user.name "soaav-svg"
          git config --local user.email "320014418+soaav-svg@users.noreply.github.com"
          git checkout -b chore/measure-skip-baseline-${{ github.run_id }}
          git add docs/external-review/skip-baseline.json
          git commit -m "chore: إعادةُ قياسِ خطِّ أساسِ التخطّي كاملاً في CI

          قياسٌ كاملٌ بـ\`env -u DATABASE_URL node --test\` على ${{ github.event.inputs.ref || 'eba5afcf' }}.
          جميعُ الحقولِ مُحدَّثةٌ بالأداةِ لا بيدٍ.
          الكوميتُ والتاريخُ مَربوطانِ بالتشغيلةِ الفعليّةِ.

          WL-243" || echo "لا تغييرٍ لدفعِهِ"
          git push origin chore/measure-skip-baseline-${{ github.run_id }}

      - name: فحص الحاجز بعد التحديث (معلوماتيٌّ)
        continue-on-error: true
        run: npm run guard:skip-baseline
