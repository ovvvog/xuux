# التكامل المستمر — أُنشئ في M0.05 ووُسِّع في M1.08 ثم في M3.03 ثم في M3.05–M3.08
#
# القاعدة: لا يُدمج شيء في main إلا وهذا المسار أخضر.
# المرجع: docs/roadmap/03-roadmap-to-100.md — البوابتان G0 و G1
# المادة 2 من القاعدة الحاكمة: لا إنجاز بلا دليل قابل للتشغيل؛ وهذا هو الدليل الآلي.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: فحص الجودة الكامل
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # قاعدة حقيقية في البوابة: اختبارات الاستمرارية تُتخطّى محلياً عند غياب
    # DATABASE_URL، فلو غابت هنا أيضاً لصار التخطّي هو الحالة الدائمة ولقُرئ
    # نجاحاً. فالخدمة معلَنة هنا والوصلة معلَنة على المهمة كلها.
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: state
          POSTGRES_PASSWORD: state
          POSTGRES_DB: state
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U state -d state"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://state:state@127.0.0.1:5432/state

    steps:
      - name: جلب المستودع
        uses: actions/checkout@v4

      - name: تهيئة Node.js من .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: تثبيت التبعيات من القفل
        run: npm ci

      # صورة المنصّة تحمل عميل PostgreSQL 16 والخدمة أعلاه 18.6، و`pg_dump` يرفض
      # خادماً أحدث منه. فبغير هذه الخطوة يفشل تمرين النسخ والاستعادة حتماً
      # (WL-022). الخادم لا يُرجَع إلى إصدار أقدم: النسخة الاحتياطية تُختبر على
      # ما يشبه التشغيل لا على ما يسهل تمريره.
      - name: تثبيت عميل PostgreSQL 18 المطابق للخادم
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-18
          /usr/lib/postgresql/18/bin/pg_dump --version
          /usr/lib/postgresql/18/bin/pg_restore --version

      - name: التحقق من مطابقة الإصدار بين package.json و version.json
        run: |
          PKG=$(node -p "require('./package.json').version")
          VER=$(node -p "require('./version.json').version")
          echo "package.json=$PKG  version.json=$VER"
          if [ "$PKG" != "$VER" ]; then
            echo "::error::تعارض إصدار: package.json=$PKG لكن version.json=$VER"
            exit 1
          fi

      - name: فحص الأسلوب (ESLint)
        run: npm run lint

      - name: فحص التنسيق (Prettier)
        run: npm run format:check

      - name: فحص الأنواع (TypeScript)
        run: npm run typecheck

      - name: بناء نواة جذر الثقة (mts ← mjs)
        run: npm run build

      - name: فحص الأسرار
        run: npm run scan:secrets

      - name: فحص مادة المفاتيح الخاصة (M2.03)
        # بوضع الإنتاج قصداً: المستودع لا يجوز أن يحمل مادة مفتاح خاص ولو
        # مشفَّرة. والبوابة المحلية تبقى بوضع التطوير لأن للمطوّر مخزناً
        # محلياً مشفَّراً مشروعاً تحت مسارات التشغيل.
        run: npm run scan:keys -- --production

      - name: الهجرات — تقديم ثم تراجع ثم تقديم (M3.03)
        # التراجع مُشغَّل في البوابة قصداً: هجرة لا يُجرَّب تراجعها ليست قابلة
        # للتراجع، وإنما مكتوبٌ عنها ذلك.
        run: |
          npm run migrate -- up
          npm run migrate -- status
          npm run migrate -- down
          npm run migrate -- up

      - name: النسخ الاحتياطي والاستعادة — تمرين فعلي بزمن معلَن (M3.07)
        # لا يكفي وجود نصّ نسخ: النسخة التي لم تُستعد ليست نسخة. فالبوابة
        # تُنشئ أرشيفاً وتتحقّق منه وتستعيده فوق قاعدة أخرى، وتطبع الزمن.
        run: |
          npm run backup -- create "$RUNNER_TEMP/ci-drill.dump"
          npm run backup -- verify "$RUNNER_TEMP/ci-drill.dump"
          npm run restore -- "$RUNNER_TEMP/ci-drill.dump" --database state_restore_drill --force

      - name: سياسة الاحتفاظ — تقرير جاف لا يحذف شيئاً (M3.08)
        # `plan` قراءةٌ محضة: تُشغَّل في البوابة لأن سياسةً لا تُقرأ آلياً
        # سياسةٌ على الورق. والمحو الفعلي لا يُشغَّل في CI قصداً.
        run: npm run retention -- plan

      - name: الاختبارات
        run: npm test

      - name: التحقق من البذرة (المخططات + تماسك العدّادات)
        run: npm run validate:seed

      - name: التحقق من عدم انحراف السجلات المشتقة عن البذرة
        run: npm run check:registries

      - name: حاجز القوالب — لا ملفات فارغة تعود إلى الشجرة
        run: npm run guard:templates

      - name: حاجز عدد الملفات — البوابة G1
        run: npm run guard:filecount

  gate-report:
    name: تقرير البوابتين G0 و G1
    runs-on: ubuntu-latest
    needs: validate
    if: always()
    steps:
      - name: خلاصة النتيجة
        run: |
          if [ "${{ needs.validate.result }}" = "success" ]; then
            echo "### ✅ البوابتان G0 و G1 — كل الفحوص خضراء" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ⛔ فشل الفحص: ${{ needs.validate.result }}" >> "$GITHUB_STEP_SUMMARY"
            echo "لا يجوز الدمج. راجع docs/roadmap/04-execution-playbook.md §4.5" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
