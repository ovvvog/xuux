# التكامل المستمر — أُنشئ في M0.05 ووُسِّع في M1.08 ثم في M3.03 ثم في M3.05–M3.08
#
# القاعدة: لا يُدمج شيء في main إلا وهذا المسار أخضر.
# المرجع: docs/roadmap/03-roadmap-to-100.md — البوابتان G0 و G1
# المادة 2 من القاعدة الحاكمة: لا إنجاز بلا دليل قابل للتشغيل؛ وهذا هو الدليل الآلي.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: فحص الجودة الكامل
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # قاعدة حقيقية في البوابة: اختبارات الاستمرارية تُتخطّى محلياً عند غياب
    # DATABASE_URL، فلو غابت هنا أيضاً لصار التخطّي هو الحالة الدائمة ولقُرئ
    # نجاحاً. فالخدمة معلَنة هنا والوصلة معلَنة على المهمة كلها.
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: state
          POSTGRES_PASSWORD: state
          POSTGRES_DB: state
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U state -d state"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://state:state@127.0.0.1:5432/state

    steps:
      - name: جلب المستودع
        uses: actions/checkout@v4

      - name: تهيئة Node.js من .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: تثبيت التبعيات من القفل
        run: npm ci

      # صورة المنصّة تحمل عميل PostgreSQL 16 والخدمة أعلاه 18.6، و`pg_dump` يرفض
      # خادماً أحدث منه. فبغير هذه الخطوة يفشل تمرين النسخ والاستعادة حتماً
      # (WL-022). الخادم لا يُرجَع إلى إصدار أقدم: النسخة الاحتياطية تُختبر على
      # ما يشبه التشغيل لا على ما يسهل تمريره.
      - name: تثبيت عميل PostgreSQL 18 المطابق للخادم
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-18
          /usr/lib/postgresql/18/bin/pg_dump --version
          /usr/lib/postgresql/18/bin/pg_restore --version

      - name: حاجز تطابق الإصدار (WL-046) — نفس النصّ الذي يُقاس محلّياً
        run: npm run guard:version

      - name: فحص الأسلوب (ESLint)
        run: npm run lint

      - name: فحص التنسيق (Prettier)
        run: npm run format:check

      - name: فحص الأنواع (TypeScript)
        run: npm run typecheck

      - name: بناء نواة جذر الثقة (mts ← mjs)
        run: npm run build

      - name: فحص الأسرار
        run: npm run scan:secrets

      - name: فحص مادة المفاتيح الخاصة (M2.03)
        # بوضع الإنتاج قصداً: المستودع لا يجوز أن يحمل مادة مفتاح خاص ولو
        # مشفَّرة. والبوابة المحلية تبقى بوضع التطوير لأن للمطوّر مخزناً
        # محلياً مشفَّراً مشروعاً تحت مسارات التشغيل.
        run: npm run scan:keys -- --production

      - name: الهجرات — تقديم ثم تراجع ثم تقديم (M3.03)
        # التراجع مُشغَّل في البوابة قصداً: هجرة لا يُجرَّب تراجعها ليست قابلة
        # للتراجع، وإنما مكتوبٌ عنها ذلك.
        run: |
          npm run migrate -- up
          npm run migrate -- status
          npm run migrate -- down
          npm run migrate -- up

      - name: النسخ الاحتياطي والاستعادة — تمرين فعلي بزمن معلَن (M3.07)
        # لا يكفي وجود نصّ نسخ: النسخة التي لم تُستعد ليست نسخة. فالبوابة
        # تُنشئ أرشيفاً وتتحقّق منه وتستعيده فوق قاعدة أخرى، وتطبع الزمن.
        run: |
          npm run backup -- create "$RUNNER_TEMP/ci-drill.dump"
          npm run backup -- verify "$RUNNER_TEMP/ci-drill.dump"
          npm run restore -- "$RUNNER_TEMP/ci-drill.dump" --database state_restore_drill --force

      - name: سياسة الاحتفاظ — تقرير جاف لا يحذف شيئاً (M3.08)
        # `plan` قراءةٌ محضة: تُشغَّل في البوابة لأن سياسةً لا تُقرأ آلياً
        # سياسةٌ على الورق. والمحو الفعلي لا يُشغَّل في CI قصداً.
        run: npm run retention -- plan

      - name: الاختبارات
        run: npm test

      - name: التحقق من البذرة (المخططات + تماسك العدّادات)
        run: npm run validate:seed

      - name: التحقق من عدم انحراف السجلات المشتقة عن البذرة
        run: npm run check:registries

      # **العيبُ الذي تُغلقه هذه الخطوات (WL-045):** ستّةَ عشرَ حاجزاً مُعلَناً في
      # `npm run validate` لم يكن يُشغِّلها هذا المسار قطُّ — كان يُشغِّل
      # `guard:templates` و`guard:filecount` وحدهما. فحواجزُ صِيغت خطوةً بعد خطوة
      # لتمنع الانحراف كانت تُقاس على جهاز المطوّر إن شاء، ولا تمنع دمجاً. والبوابةُ
      # التي لا تُشغَّل آلياً ليست بوابةً بل نيّة. ولها هنا خطواتٌ مُسمَّاةٌ لا سطرٌ
      # جامعٌ واحدٌ، كي يدلَّ اسمُ الخطوة الحمراء على الحاجز الذي سقط.
      - name: حاجز التخويل — لا فعل حسّاس بلا سلطة معلَنة
        run: npm run guard:authorization

      - name: حاجز التغليف — لا مادة سياديّة بلا مغلِّف
        run: npm run guard:encryption

      - name: حاجز النسب — لا أصل بلا قيد
        run: npm run guard:lineage

      - name: حاجز الذاكرة — لا استرجاع بلا عزل هوية
        run: npm run guard:memory

      - name: حاجز الاحتفاظ — لا صفّ يبقى بلا مدّة معلَنة
        run: npm run guard:retention

      - name: حاجز السجل — لا واقعة بلا قيد
        run: npm run guard:events

      - name: حاجز المعرفة — لا دعوى بلا سند
        run: npm run guard:knowledge

      - name: حاجز الدستور — لا مادة بلا مرجع
        run: npm run guard:constitution

      - name: حاجز التشريع — لا نفاذ بلا ربط وأمر موقَّع
        run: npm run guard:legislation

      - name: حاجز القضاء — لا حكم بلا جلسة وسبب
        run: npm run guard:judiciary

      - name: حاجز المؤسسات — لا مؤسسة بلا ولاية
        run: npm run guard:institutions

      - name: حاجز الولايات — لا ولاية بلا حدود معلَنة
        run: npm run guard:mandates

      - name: حاجز الاتحاد — لا تفويض بلا سجل
        run: npm run guard:federation

      - name: حاجز السيادة — لا قرار سياديّ بلا تاج
        run: npm run guard:sovereignty

      - name: حاجز التقارير — لا تقدير بلا إعلان
        run: npm run guard:reports

      - name: حاجز الرقابة — لا مقياس بلا مصدر
        run: npm run guard:monitoring

      - name: حاجز طبقة الواجهة (M9.02) — لا مسار بلا تخويل معلَن
        run: npm run guard:api

      - name: حاجز الديوان الملكي (M9.03) — لا أمر بلا إعلان وتوقيع وقيد دائم قبل أثره
        run: npm run guard:console

      - name: حاجز مصادقة الملك (M9.04) — لا أمر سيادي بجلسة بلا عامل ثانٍ
        run: npm run guard:king-auth

      - name: حاجز مركز العمليات (M9.05) — لا لوحة بلا مصدر معلَن ولا حادثة بلا مهلة مقيسة
        run: npm run guard:operations

      - name: حاجز غرفة الأزمات (M9.06) — لا خطوة أزمة خارج ترتيبها ولا أمر سيادي خارج الديوان
        run: npm run guard:crisis

      - name: حاجز عارض سجل التدقيق (M9.07) — لا مشهد بلا حكم سلامة ولا قراءة بلا قيد
        run: npm run guard:audit-viewer

      - name: حاجز القياس الموحّد (M10.01) — لا إشارة بلا اسم معلَن ولا نداء بلا معرّف ارتباط واحد
        run: npm run guard:telemetry

      - name: حاجز مستويات الخدمة (M10.02) — لا مقياس بلا هدف يُقاس عليه ولا هدف مكتوب في الكود
        run: npm run guard:service-levels

      - name: حاجز مسار الاستجابة للحوادث (M10.03) — لا هدف بلا قاعدة تنبيه ولا لحظة بلا مستجيب ولا حادثة تُغلَق بلا مراجعة
        run: npm run guard:incident-response

      - name: حاجز تتبّع التكلفة والسعة (M10.04) — لا عمل بلا ثمن معلَن ولا ثمن بلا صاحب ولا صاحب بلا سقف يُقاس عليه
        run: npm run guard:cost-capacity

      - name: حاجز عقد البيئة والإقامة بأمر واحد (M10.05) — لا بيئة بلا عقد معلَن ولا إقامة بأكثر من أمر ولا صلاح بلا حكم يُقاس
        run: npm run guard:environment

      - name: حاجز عقد النشر القابل للتراجع (M10.06) — لا موجة نشر بلا بوابة من عهد مقيس ولا تراجع ينتظر إذناً
        run: npm run guard:deployment

      - name: حاجز القوالب — لا ملفات فارغة تعود إلى الشجرة
        run: npm run guard:templates

      - name: حاجز عدد الملفات — البوابة G1
        run: npm run guard:filecount

  gate-report:
    name: تقرير البوابتين G0 و G1
    runs-on: ubuntu-latest
    needs: validate
    if: always()
    steps:
      - name: خلاصة النتيجة
        run: |
          if [ "${{ needs.validate.result }}" = "success" ]; then
            echo "### ✅ البوابتان G0 و G1 — كل الفحوص خضراء" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ⛔ فشل الفحص: ${{ needs.validate.result }}" >> "$GITHUB_STEP_SUMMARY"
            echo "لا يجوز الدمج. راجع docs/roadmap/04-execution-playbook.md §4.5" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
