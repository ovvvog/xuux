# نشرُ أثرِ خطِّ أساسِ التخطّي — **الحائزُ الوحيدُ لصلاحيّةِ الكتابةِ** (‏`OPS-1` · `WL-246`).
#
# ── لماذا ملفٌّ منفصلٌ ولماذا `workflow_run` بعينِهِ ──
#
# مرحلتانِ في ملفٍّ واحدٍ تُؤخَذانِ من **تعريفٍ واحدٍ**. فلو أُطلِقَ سيرُ العملِ من فرعٍ،
# أُخِذَ تعريفُ مرحلةِ النشرِ — ذاتِ صلاحيّةِ الكتابةِ — من ذلكَ الفرعِ، فيَعودُ أصلُ
# العَطَبِ من بابٍ آخرَ: كودٌ غيرُ موثوقٍ يَملِكُ رمزَ كتابةٍ.
#
# و`workflow_run` يَحسِمُ هذا **بنيةً لا باتّفاقٍ**: GitHub يَأخُذُ تعريفَ سيرِ عملٍ
# مُحرَّكٍ بهِ **من الفرعِ الافتراضيِّ دائماً**، فلا تُوجَدُ نسخةُ نشرٍ من فرعٍ أصلاً.
# ومعَ ذلكَ يُفحَصُ `workflow_ref` صريحاً — فحاجزٌ يَعتمِدُ على ضمانِ منصّةٍ بلا قياسٍ
# هوَ ضمانٌ غيرُ مقيسٍ.
#
# ── وما يَحكُمُ هنا هوَ `V1`…`V7`، و`V5` هوَ جوابُ لحظةِ السباقِ ──
#
# `V5` يَقرأُ `origin/main` **الآنَ** ويُقابِلُ بصمةَ نطاقِهِ ببصمةِ الأثرِ. فدمجٌ وقعَ
# في `main` بعدَ اكتمالِ القياسِ **يَمنعُ النشرَ هنا** ولا يُكتشَفُ بعدَ الدمجِ. ولا
# يُعتمَدُ على `R6` وحدَهُ: ذاكَ يُقابِلُ عدّادَ ملفّاتٍ لا هويّةَ شجرةٍ.
#
# ── وحدٌّ مُعلَنٌ على المالكِ ──
#
# البيئةُ `publish-skip-baseline` مُصرَّحٌ بها هنا، **وقواعدُ حمايتِها لا يَملِكُها
# المنفِّذُ**: على المالكِ أن يُضيفَ إليها مُراجِعاً مطلوباً أو مُهلةً في إعداداتِ
# المستودعِ. وبلا ذلكَ هيَ بيئةٌ بلا قيدٍ — وهذا يُعلَنُ ولا يُدَّعى خلافُهُ.

name: نشرُ أثرِ خطِّ أساسِ التخطّي

on:
  workflow_run:
    workflows: ['قياسُ خطِّ أساسِ التخطّي']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      measure_run_id:
        description: 'معرِّفُ تشغيلةِ القياسِ'
        required: true
        type: string
      measure_run_attempt:
        description: 'محاولةُ التشغيلةِ'
        required: true
        type: string
      measured_sha:
        description: 'بصمةُ الكوميتِ المقاسِ'
        required: true
        type: string
      main_head_at_measure:
        description: 'رأسُ main عندَ القياسِ'
        required: true
        type: string
      artifact_name:
        description: 'اسمُ الأثرِ'
        required: true
        type: string

# ── لماذا workflow_dispatch إلى جانب workflow_run (LIVE-22) ──
#
# GitHub لا يُطلِقُ workflow_run للأحداثِ المُطلَقةِ بـGITHUB_TOKEN.
# القياسُ الآلي يُطلَقُ بـworkflow_dispatch من auto-measure بـGITHUB_TOKEN،
# فلا تُطلَقُ workflow_run للنشر. workflow_dispatch استثناءٌ موثَّقٌ.
# القياسُ اليدويّ لا يُرسِلُ workflow_dispatch، فيَعتمِدُ على workflow_run — فلا ازدواجَ.

permissions:
  contents: read

concurrency:
  group: publish-skip-baseline
  cancel-in-progress: false

jobs:
  publish:
    name: تحقُّقٌ ونشرٌ (كودُ main وحدَهُ)
    if: |
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: publish-skip-baseline
    # `actions: write` (‏`OPS-1/BOT-PR-CI` · `WL-311`): لإرسالِ `workflow_dispatch` إلى
    # `ci.yml` على فرعِ النشرِ وحدَهُ — لا يَكتُبُ محتوىً ولا يَتجاوزُ البيئةَ، فهوَ
    # يُنفَّذُ **بعدَ** موافقتِها. ويَشملُ `actions: read` الذي يَحتاجُهُ تنزيلُ الأثرِ.
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      # ── فحصُ الأصلِ: `workflow_ref` لا `workflow_sha` ──
      # `workflow_sha` **لا يُقابَلُ بـ`measured_sha`** — ذاكَ خطأٌ صُحِّحَ: الأوّلُ
      # كوميتُ تعريفِ سيرِ العملِ والثاني كوميتُ الشجرةِ المقاسةِ، واختلافُهما
      # **ليسَ عَطَباً**. والمحروسُ أنَّ تعريفَ النشرِ من `main`.
      - name: أصلُ تعريفِ النشرِ من main
        env:
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          echo "workflow_ref = $WORKFLOW_REF"
          case "$WORKFLOW_REF" in
            */.github/workflows/publish-skip-baseline.yml@refs/heads/main) ;;
            *)
              echo "::error::PUBLISH_WORKFLOW_REF_NOT_MAIN: تعريفُ النشرِ ليسَ من refs/heads/main — لا كتابةَ."
              exit 1
              ;;
          esac

      # ── حلُّ معرِّفِ التشغيلةِ المقاسةِ (LIVE-22) ──
      # workflow_run: المعرِّفُ في الحدثِ مباشرةً.
      # workflow_dispatch: المعرِّفُ في inputs، ويجبُ التحقُّقُ عبرَ API.
      - name: حلُّ معرِّفِ التشغيلةِ المقاسةِ والتحقُّقُ منها
        id: resolve-run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = 'workflow_run' ]; then
            RUN_ID='${{ github.event.workflow_run.id }}'
            echo "measure_run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
            echo "المصدرُ: workflow_run — معرِّفُ التشغيلةِ $RUN_ID"
          else
            RUN_ID='${{ github.event.inputs.measure_run_id }}'
            MEASURED_SHA='${{ github.event.inputs.measured_sha }}'
            MAIN_HEAD='${{ github.event.inputs.main_head_at_measure }}'
            # التحقُّقُ عبرَ API أنَّ التشغيلةَ حقيقيّةٌ وناجحةٌ ومن مسارِ القياسِ
            RESPONSE=$(curl -fsS \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs/$RUN_ID")
            NAME=$(echo "$RESPONSE" | node -e "const c=[];process.stdin.on('data',d=>c.push(d));process.stdin.on('end',()=>{const j=JSON.parse(Buffer.concat(c));process.stdout.write(j.name||'')})")
            STATUS=$(echo "$RESPONSE" | node -e "const c=[];process.stdin.on('data',d=>c.push(d));process.stdin.on('end',()=>{const j=JSON.parse(Buffer.concat(c));process.stdout.write(j.status||'')})")
            CONCLUSION=$(echo "$RESPONSE" | node -e "const c=[];process.stdin.on('data',d=>c.push(d));process.stdin.on('end',()=>{const j=JSON.parse(Buffer.concat(c));process.stdout.write(j.conclusion||'')})")
            BRANCH=$(echo "$RESPONSE" | node -e "const c=[];process.stdin.on('data',d=>c.push(d));process.stdin.on('end',()=>{const j=JSON.parse(Buffer.concat(c));process.stdout.write(j.head_branch||'')})")
            if [ "$NAME" != 'قياسُ خطِّ أساسِ التخطّي' ]; then
              echo "::error::DISPATCH_RUN_WRONG_WORKFLOW: اسمُ التشغيلةِ '$NAME' ليسَ 'قياسُ خطِّ أساسِ التخطّي'."
              exit 1
            fi
            if [ "$STATUS" != 'completed' ] || [ "$CONCLUSION" != 'success' ]; then
              echo "::error::DISPATCH_RUN_NOT_SUCCESS: status=$STATUS conclusion=$CONCLUSION."
              exit 1
            fi
            if [ "$BRANCH" != 'main' ]; then
              echo "::error::DISPATCH_RUN_WRONG_BRANCH: الفرعُ '$BRANCH' ليسَ 'main'."
              exit 1
            fi
            echo "measure_run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
            echo "المصدرُ: workflow_dispatch — معرِّفُ التشغيلةِ $RUN_ID (مُتحقَّقٌ: name=$NAME status=$STATUS conclusion=$CONCLUSION branch=$BRANCH)"
          fi

      - name: جلبُ الشجرةِ الموثوقةِ (main)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: تبعيّاتُ المُتحقِّقِ الموثوقِ
        run: npm ci

      - name: تنزيلُ الأثرِ المُرشَّحِ وبيانِ المنشأِ
        uses: actions/download-artifact@v4
        with:
          name: baseline
          path: candidate
          run-id: ${{ steps.resolve-run.outputs.measure_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: قراءةُ بيانِ المنشأِ
        id: prov
        run: |
          set -euo pipefail
          test -f candidate/provenance.json || {
            echo "::error::PUBLISH_PROVENANCE_MISSING: لا بيانَ منشأٍ — لا نشرَ."; exit 1; }
          cat candidate/provenance.json
          for key in measured_sha main_head_at_measure artifact_sha256 test_exit github_run_id github_run_attempt; do
            VALUE="$(node -e "const p=require('./candidate/provenance.json');process.stdout.write(String(p['$key'] ?? ''))")"
            if [ -z "$VALUE" ]; then
              echo "::error::PUBLISH_PROVENANCE_FIELD: الحقلُ $key فارغٌ."; exit 1
            fi
            echo "$key=$VALUE" >> "$GITHUB_OUTPUT"
          done

      # ── V1…V7 · والمُتحقِّقُ يَقرأُ ويَحكُمُ ولا يَكتُبُ ──
      - name: المُتحقِّقُ الموثوقُ (V1…V7)
        run: |
          set -euo pipefail
          node scripts/verify-skip-baseline-artifact.mjs \
            --artifact candidate/skip-baseline.json \
            --artifact-sha256 '${{ steps.prov.outputs.artifact_sha256 }}' \
            --measured-sha '${{ steps.prov.outputs.measured_sha }}' \
            --main-head-at-measure '${{ steps.prov.outputs.main_head_at_measure }}' \
            --trusted-root .

      - name: وضعُ الأثرِ في الشجرةِ الموثوقةِ
        run: |
          set -euo pipefail
          cp candidate/skip-baseline.json docs/external-review/skip-baseline.json
          git --no-pager diff --stat -- docs/external-review/skip-baseline.json

      # ── تحديثُ خططِ المراجعةِ بالكوميتِ المقيسِ الجديد (S1…S6) ──
      # الفجوةُ: الأثرُ الجديدُ يحملُ كوميتاً جديداً، وخططُ المراجعةِ تَذكُرُ القديم.
      # الحاجزُ R5 يَرفُضُ ذلك. هذا السكربتُ يُحدِّثُ السطرَ الأخيرَ (الأحدثَ) في
      # كلِّ خطّةٍ ليذكرَ الكوميتَ المقيسَ الجديد، ويَفشلُ مُغلَقاً إن لم يجدْه.
      - name: تحديثُ خططِ المراجعةِ بالكوميتِ المقيسِ
        run: node scripts/sync-plan-commits.mjs docs/external-review/skip-baseline.json .

      # ── الحاجزُ **حاسمٌ** — لا `continue-on-error` ──
      # النسخةُ السابقةُ كانَت تُشغِّلُهُ بـ`continue-on-error: true` أي تَقيسُ ولا
      # تَحكُمُ — وحاجزٌ يَحرُسُ وجودَ ردٍّ ولا يَحرُسُ صحّتَهُ لا يَحرُسُ.
      - name: حاجزُ خطِّ أساسِ التخطّي — حاسماً
        run: npm run guard:skip-baseline

      - name: حاجزُ عدّاداتِ الوثائقِ
        run: npm run guard:doc-counts

      - name: هل تغيَّرَ شيءٌ أصلاً؟
        id: delta
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/external-review/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "الأثرُ مُطابِقٌ لِما في main — لا فرعَ ولا طلبَ دمجٍ."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # ── أوّلُ لحظةٍ يُكتَبُ فيها شيءٌ في المستودعِ ──
      - name: فرعٌ ودفعٌ
        if: steps.delta.outputs.changed == 'true'
        id: branch
        run: |
          set -euo pipefail
          BRANCH="chore/skip-baseline-${{ steps.prov.outputs.github_run_id }}-${{ steps.prov.outputs.github_run_attempt }}"
          git config user.name 'soaav-svg'
          git config user.email '320014418+soaav-svg@users.noreply.github.com'
          git checkout -b "$BRANCH"
          git add docs/external-review/
          git commit -m "chore: قياسُ خطِّ أساسِ التخطّي على ${{ steps.prov.outputs.measured_sha }}

          عقدُ الهويّةِ (OPS-1): الأثرُ مقيسٌ على رأسِ main وحدَهُ، مُصنَّفٌ ومكتوبٌ بأداةٍ
          موثوقةٍ من main، ومُتحقَّقٌ منهُ بـV1…V7 قبلَ أيِّ كتابةٍ.

          measured_sha: ${{ steps.prov.outputs.measured_sha }}
          main_head_at_measure: ${{ steps.prov.outputs.main_head_at_measure }}
          artifact_sha256: ${{ steps.prov.outputs.artifact_sha256 }}
          test_exit: ${{ steps.prov.outputs.test_exit }}
          run: ${{ steps.prov.outputs.github_run_id }} محاولةٌ ${{ steps.prov.outputs.github_run_attempt }}

          Refs: WL-246"
          git push origin "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # PR تلقائيٌّ — **جزءٌ من معيارِ إغلاقِ `OPS-1` (٣)**، ودفعُ فرعٍ بلا طلبِ
      # دمجٍ هوَ ما أنتجَ `REPO-1`: ثلاثةٌ وعشرونَ فرعاً مهجوراً.
      - name: طلبُ دمجٍ تلقائيٌّ
        if: steps.delta.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BODY="$(cat <<'EOF'
          ## دليلٌ مقيسٌ

          | المقيسُ | القيمةُ |
          | --- | --- |
          | `measured_sha` | `__MEASURED__` |
          | `main_head_at_measure` | `__MAINHEAD__` |
          | `artifact_sha256` | `__ARTSHA__` |
          | `test_exit` | `__EXIT__` |
          | التشغيلةُ | `__RUNID__` محاولةٌ `__ATTEMPT__` |

          ## ما أُثبِتَ قبلَ هذه الكتابةِ

          - `I1`…`I4` في مرحلةِ القياسِ: بصمةٌ كاملةٌ · الكوميتُ موجودٌ · `requested_ref === origin/main` · الشجرةُ المستخرَجةُ نقيّةٌ ومُطابِقةٌ.
          - `A1`…`A10` في الأداةِ الموثوقةِ: الكوميتُ **مُشتَقٌّ** من جذرِ القياسِ لا مُمَرَّرٌ · رمزُ الخروجِ يُطابِقُ عدّادَ TAP · إخفاقٌ أجنبيٌّ مردودٌ.
          - `V1`…`V7` في المُتحقِّقِ الموثوقِ: سلامةُ نقلٍ · هويّةُ الكوميتِ ورأسِ main لكلِّ مُدخلةٍ · **`V5`: نطاقُ `main` لم يتحرَّكْ بينَ القياسِ والنشرِ** · الشكلُ والعقدُ `2` والحكمُ.
          - `guard:skip-baseline` **حاسماً** (لا `continue-on-error`) و`guard:doc-counts`.

          ## حدودٌ مُعلَنةٌ لا مستورةٌ

          - **عدّاداتُ TAP لم تُتحقَّقْ عندَ النشرِ** — إنتاجُها يَقتضي تنفيذَ كودِ الشجرةِ المقاسةِ. والمُعوِّضُ عقديٌّ: المقاسُ رأسُ `main` (`V4`).
          - **الـdigest يُثبِتُ النقلَ لا الأصالةَ.**
          - **عزلُ العدّاءِ (`M5`) غيرُ محسومٍ**: العدّاءُ مقيمٌ و`/tmp` مشتركٌ. حاجزٌ خارجيٌّ على المالكِ.
          - **عقدُ `pkcs11js` (`M6`) غيرُ محسومٍ**: أُزيلَ `|| true` فصارَ الفشلُ صريحاً، والاقترانُ البنيويُّ باقٍ.
          - **حمايةُ الفرعِ غيرُ مُنفَذةٍ (`EXT-1`)**: إن تحرَّكَت `main` بعدَ فتحِ هذا الطلبِ فـ`R8/BASE-DRIFT` يَكشِفُ في أوّلِ تشغيلٍ، ولا يَمنعُ الدمجَ آليّاً.

          **ولا يُعَدُّ هذا إغلاقاً لـ`OPS-1`** ما بقيَ `M5` أو `M6` محجِباً.
          EOF
          )"
          BODY="${BODY//__MEASURED__/${{ steps.prov.outputs.measured_sha }}}"
          BODY="${BODY//__MAINHEAD__/${{ steps.prov.outputs.main_head_at_measure }}}"
          BODY="${BODY//__ARTSHA__/${{ steps.prov.outputs.artifact_sha256 }}}"
          BODY="${BODY//__EXIT__/${{ steps.prov.outputs.test_exit }}}"
          BODY="${BODY//__RUNID__/${{ steps.prov.outputs.github_run_id }}}"
          BODY="${BODY//__ATTEMPT__/${{ steps.prov.outputs.github_run_attempt }}}"
          # إنشاءُ طلبِ الدمجِ عبرَ REST API — بلا اعتمادٍ على `gh` CLI
          # و`node` يَبني حمولةَ JSON آمنةً من النصِّ العربيِّ متعدِّدِ الأسطرِ.
          PAYLOAD=$(printf '%s' "$BODY" | node -e "
            const chunks = [];
            process.stdin.on('data', c => chunks.push(c));
            process.stdin.on('end', () => {
              const body = Buffer.concat(chunks).toString();
              console.log(JSON.stringify({
                title: process.argv[1],
                head: process.argv[2],
                base: 'main',
                body
              }));
            });
          " \
            "chore: قياسُ خطِّ أساسِ التخطّي على ${{ steps.prov.outputs.measured_sha }}" \
            "${{ steps.branch.outputs.branch }}")

          HTTP_RESPONSE=$(curl -sS -w '\n%{http_code}' -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -H 'Content-Type: application/json' \
            "https://api.github.com/repos/${{ github.repository }}/pulls" \
            -d "$PAYLOAD")

          HTTP_CODE=$(echo "$HTTP_RESPONSE" | tail -1)
          RESPONSE_BODY=$(echo "$HTTP_RESPONSE" | sed '$d')

          if [ "$HTTP_CODE" != '201' ]; then
            echo "::error::PR_CREATE_FAILED: HTTP $HTTP_CODE"
            echo "$RESPONSE_BODY"
            exit 1
          fi

          echo "$RESPONSE_BODY" | node -e "
            const chunks = [];
            process.stdin.on('data', c => chunks.push(c));
            process.stdin.on('end', () => {
              const j = JSON.parse(Buffer.concat(chunks));
              console.log('PR created: #' + j.number + ' ' + j.html_url);
            });
          "

      # ── إطلاقُ CI على فرعِ النشرِ (‏`OPS-1/BOT-PR-CI` · `WL-311`) ──
      #
      # طلبُ الدمجِ المُنشَأُ بـ`GITHUB_TOKEN` **لا يُشغِّلُ** `pull_request` بوظائفَ:
      # قِيسَ في `35932954388` (‏`#144`) ثمَّ في `37085393507` (‏`#221`) — صفرُ وظائفَ،
      # `triggering_actor: github-actions[bot]` — فكانَ يُعادُ فتحُ الطلبِ يدويّاً
      # (‏`37085458411`). و`workflow_dispatch` **هوَ الاستثناءُ الموثَّقُ** من قيدِ
      # `GITHUB_TOKEN`، وهوَ نفسُهُ ما يُطلِقُ القياسَ من `auto-measure` (‏`37084688315`،
      # `triggering_actor: github-actions[bot]`، نجحَ). فيُرسَلُ إلى `ci.yml` على **فرعِ
      # النشرِ**؛ وفحوصُهُ — ومنها «فحص الجودة الكامل» — تُقيَّدُ على **رأسِ الفرعِ**
      # وهوَ رأسُ الطلبِ نفسُهُ، فيَظهرُ الحكمُ على الطلبِ بلا إعادةِ فتحٍ.
      #
      # **وما لا يَفعلُهُ:** لا سرَّ جديداً ولا PAT ولا تطبيقَ، ولا يَمسُّ حمايةَ الفرعِ،
      # ولا يَتجاوزُ موافقةَ البيئةِ (يُنفَّذُ بعدَها)، ولا يَدمجُ — الدمجُ يَبقى بيدٍ.
      # **وحاسمٌ مرّتينِ:** `204` من الإرسالِ، ثمَّ تشغيلةٌ مرئيّةٌ على البصمةِ المدفوعةِ
      # بعينِها — فإرسالٌ قُبِلَ ولم تَظهرْ لهُ تشغيلةٌ لا يُعَدُّ إطلاقاً.
      - name: إطلاقُ CI على فرعِ النشرِ (OPS-1/BOT-PR-CI)
        if: steps.delta.outputs.changed == 'true'
        id: ci-dispatch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.branch.outputs.branch }}
          HEAD_SHA: ${{ steps.branch.outputs.head_sha }}
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/${{ github.repository }}/actions/workflows/ci.yml"
          PAYLOAD=$(node -e "console.log(JSON.stringify({ ref: process.argv[1] }))" "$BRANCH")
          HTTP_CODE=$(curl -sS -o "$RUNNER_TEMP/ci-dispatch.json" -w '%{http_code}' -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -H 'Content-Type: application/json' \
            "$API/dispatches" -d "$PAYLOAD")
          if [ "$HTTP_CODE" != '204' ]; then
            echo "::error::CI_DISPATCH_FAILED: HTTP $HTTP_CODE — لم يُطلَقْ CI على $BRANCH."
            cat "$RUNNER_TEMP/ci-dispatch.json"
            exit 1
          fi
          RUN_ID=''
          for attempt in $(seq 1 12); do
            sleep 10
            RUN_ID=$(curl -fsS \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$API/runs?event=workflow_dispatch&branch=$BRANCH&head_sha=$HEAD_SHA&per_page=5" \
              | node -e "const c=[];process.stdin.on('data',d=>c.push(d));process.stdin.on('end',()=>{const j=JSON.parse(Buffer.concat(c));const r=(j.workflow_runs||[]).find(x=>x.head_sha===process.argv[1]);process.stdout.write(r?String(r.id):'')})" "$HEAD_SHA")
            if [ -n "$RUN_ID" ]; then break; fi
            echo "محاولةٌ $attempt: لم تَظهرْ تشغيلةُ CI بعدُ على $HEAD_SHA"
          done
          if [ -z "$RUN_ID" ]; then
            echo "::error::CI_DISPATCH_NO_RUN: قُبِلَ الإرسالُ ولم تَظهرْ تشغيلةُ CI على $HEAD_SHA خلالَ 120 ثانيةً."
            exit 1
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "✅ CI على $BRANCH @ $HEAD_SHA: التشغيلةُ $RUN_ID"

      - name: خلاصةٌ مقيسةٌ
        if: always()
        run: |
          {
            echo "### النشرُ"
            echo ""
            echo "- تغيَّرَ الأثرُ: \`${{ steps.delta.outputs.changed }}\`"
            echo "- الفرعُ: \`${{ steps.branch.outputs.branch }}\`"
            echo "- تشغيلةُ CI على الفرعِ: \`${{ steps.ci-dispatch.outputs.run_id }}\`"
            echo "- \`measured_sha\`: \`${{ steps.prov.outputs.measured_sha }}\`"
            echo "- \`artifact_sha256\`: \`${{ steps.prov.outputs.artifact_sha256 }}\`"
            echo ""
            echo "**ولا يُعَدُّ هذا إغلاقاً لـ\`OPS-1\`** ما بقيَ \`M5\` (عزلُ العدّاءِ) أو \`M6\` (عقدُ pkcs11js) محجِباً."
          } >> "$GITHUB_STEP_SUMMARY"
