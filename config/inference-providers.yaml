# مزوّدو الاستدلال كبياناتٍ — سدادُ `D-11` (الشوطُ الثالثُ: الإعلانُ)
#
# قبل هذا الملفِّ كان `createHttpsAdapter` مُتاحاً ولا مزوّدَ **مُعلَناً**: من
# أراد مزوّداً كتبَ عنوانَه واسمَ متغيّرِ مفتاحِه ومساراتِ ردِّه **في الشفرةِ
# أو في مِسنَدِ اختبارٍ**، فصارَ سطحُ الثقةِ الخارجيُّ للدولةِ — أيُّ عنوانٍ
# تُنادى عليه وأيُّ مفتاحٍ يُقرأُ — مبثوثاً في الكودِ لا مقروءاً في وثيقةٍ
# واحدةٍ تُراجَع. **وسطحُ ثقةٍ لا يُقرأُ في موضعٍ واحدٍ سطحٌ لا يُراجَع.**
#
# فالمزوّدونَ هنا بياناتٌ: `src/inference/providers.mjs` يقرأُ هذا الملفَّ
# ويتحقّقُ منه بمخطَّطِه ثمَّ يبني المُوائمَ عبرَ `createHttpsAdapter` وحدَه، ولا
# يخترعُ عنواناً ولا مُهلةً ولا مساراً.
#
# **ثلاثةُ حدودٍ يحرسُها المخطَّطُ والحاجزُ (`I8`, `I9`):**
#   1. `apiKeyEnv` و`caFileEnv` **أسماءُ متغيّراتِ بيئةٍ لا قيمٌ** — على نفسِ
#      اصطلاحِ `DATABASE_CA_FILE` و`STATE_TLS_CA_FILE`؛ والمادةُ 7 من
#      `GOVERNANCE_RULE.md` تمنعُ سرّاً في المستودعِ، فلا مفتاحَ هنا ولا في
#      الترويساتِ الثابتةِ ولا في حقولِ الطلبِ.
#   2. `endpoint` عنوانُ `https` وحدَه، بلا اسمٍ ولا كلمةِ مرورٍ فيه؛ ومفتاحٌ
#      يُرسَلُ بلا تعميةٍ مفتاحٌ مقروءٌ على الطريقِ.
#   3. المسارُ إلى المُخرَجِ وإلى أرقامِ الاستهلاكِ **مُعلَنٌ** لا مُخمَّنٌ؛ فردٌّ
#      لا يُطابِقُ مسارَه يُرفَضُ بـ`RESPONSE_UNREADABLE` ولا يُقرأُ منه صفرٌ.
#
# **حدودٌ مُعلَنةٌ لا تُدَّعى خلافُها:**
#   أ. **الإعلانُ ليس قياساً على المزوّدِ.** مساراتُ الردِّ هنا مقروءةٌ من وثيقةِ
#      المزوّدِ المنشورةِ، ولم تُقَس بنداءٍ حقيقيٍّ في هذه الدفعةِ: النداءُ يحتاجُ
#      مفتاحاً حقيقيّاً في البيئةِ، ومفتاحٌ لا يُوضَعُ في مستودعٍ. والمقيسُ هنا
#      بناءُ المُوائمِ من الإعلانِ ورفضُ الإعلانِ الفاسدِ، على مِقبسٍ محلّيٍّ
#      بتعميةٍ حقيقيّةٍ في `tests/inference/https-adapter.test.mjs`.
#   ب. **حقلُ الدخلِ واحدٌ مُسطَّحٌ.** المُوائمُ يُرسِلُ النصَّ في حقلٍ واحدٍ
#      (`requestFields.input`)، فمزوّدٌ يشترطُ مصفوفةَ رسائلَ متداخلةً
#      (`messages[]`) **غيرُ قابلٍ للإعلانِ في هذا الشوطِ** — وهو حدٌّ مُسجَّلٌ في
#      `docs/REMAINING_WORK.md` لا سهوٌ.
#   ج. **مزوّدٌ مُعلَنٌ ليس مزوّداً نافذاً.** لا يُنادى مزوّدٌ إلا إن كان متغيّرُ
#      مفتاحِه في البيئةِ؛ وغيابُه رفضٌ باسمِه (`KEY_ABSENT`) لا مروٌّ صامتٌ.

version: 1
owner: crown

providers:
  - id: adapter:openai-responses
    provider: OpenAI
    transport: https
    endpoint: https://api.openai.com/v1/responses
    apiKeyEnv: OPENAI_API_KEY
    authHeader: authorization
    authScheme: Bearer
    timeoutMs: 30000
    requestFields:
      model: model
      input: input
    outputPath: [output, 0, content, 0, text]
    modelPath: [model]
    usagePaths:
      inputTokens: [usage, input_tokens]
      outputTokens: [usage, output_tokens]
      totalTokens: [usage, total_tokens]
    statement: >-
      واجهةُ `responses` تقبلُ النصَّ في حقلٍ واحدٍ (`input`) وتُعلنُ استهلاكَها
      في `usage`، فهي الشكلُ الوحيدُ الذي يُطابِقُ عقدَ المُوائمِ اليومَ. ومسارُ
      المُخرَجِ يقعُ على أوّلِ عنصرٍ من `output`، فردُّ نموذجٍ يُقدِّمُ عنصرَ
      استدلالٍ قبلَ رسالتِه يُرفَضُ بـ`RESPONSE_UNREADABLE` — **وهو رفضٌ مقصودٌ
      لا عَطَبٌ**: مُخرَجٌ يُقرأُ من موضعٍ غيرِ المُعلَنِ مُخرَجٌ خُمِّنَ.
