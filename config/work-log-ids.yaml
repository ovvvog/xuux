# مُدخلاتٌ مُستعادةٌ (‏`WL-332`، `WL-335`): نصٌّ كانَ على تاريخِ `main` ثمّ سقطَ أو بُتِرَ أو عُدِّلَ
# فأُعيدَ حرفيّاً. `guard:project-state` يتحقّقُ أنّ نصَّ المُدخلةِ — بعدَ إهمالِ ذيلِها من فراغٍ
# و`---` وحدَه — يطابقُ نصَّها في `from` (‏كوميتٌ سلفٌ للأساسِ: قُيِّدَت في وقتِها ودُمِجَت)، وأنّ
# `by` مُدخلةٌ جديدةٌ في الحزمةِ نفسِها. المُدخلةُ الغائبةُ عن الأساسِ لا تُحاكَمُ عملاً جديداً
# (‏`PS4`/`PS5`)؛ والمُدخلةُ الباقيةُ على الأساسِ تُعفى من `PS12` وحدَها. والإعلانُ عن نصٍّ مطابقٍ
# للأساسِ سجلٌّ تاريخيٌّ خاملٌ لا يُعفي شيئاً.
