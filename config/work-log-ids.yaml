# سجلُّ استثناءاتِ ترقيمِ سجلِّ الأعمالِ — أُنشئ في `WL-178` إغلاقاً للدَينِ `DOC-8`.
#
# **لماذا يوجدُ هذا الملفُّ:** حاجزُ `scripts/guard-work-log-ids.mjs` يمنعُ أيَّ
# فجوةٍ أو تكرارٍ في معرِّفاتِ `docs/roadmap/05-work-log.md`. وما كان منها قبلَ
# الحاجزِ **لا يُمحى بتعديلِ مُدخلاتٍ قديمةٍ** (المادة 6 تمنعُ ذلك)، فيُعلَنُ هنا
# بسببٍ مكتوبٍ. **فالاستثناءُ المُعلَنُ بسببِه ليس عيباً مستوراً.**
#
# **ولا يُضافُ سطرٌ هنا لتهدئةِ الحاجزِ:** من وجدَ الحاجزَ يمنعُ دفعتَه فعليه أن
# يُصحِّحَ الترقيمَ لا أن يُعلِنَه استثناءً — والإعلانُ لِما مضى قبلَ الحاجزِ فقط.
# والحاجزُ يرفضُ استثناءً لم يبقَ له محلٌّ (‏القاعدةُ `R4`).

