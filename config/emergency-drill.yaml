# عقدُ تمرينِ الطوارئ الكامل — الخطوة `M11.07`
#
# هذه الوثيقةُ **مصدرُ الحقيقةِ الوحيدُ** لأطوارِ تمرينِ الطوارئ: ماذا يُوقَف،
# وماذا يُحجَر، وماذا يُستعاد، وكيف تُستأنف الدولةُ، وأيُّ تقريرٍ يُرفَع — وبأيِّ
# **زمنٍ مُعلَنٍ** لكلِّ طورٍ، وبأيِّ **إنفاذٍ مقيسٍ** يُقبَل الطورُ، وبأيِّ حكمٍ
# ورمزِ خروجٍ يُختَم التمرين.
#
# **والفرقُ بينها وبين عقدِ التعافي (`M10.08`) وعقدِ الفوضى (`M10.09`) فرقٌ في
# السؤال:** التعافي يسأل «هل تعود الدولةُ بعد أن يذهب كلُّ شيءٍ؟»، والفوضى تسأل
# «ماذا تفعل الدولةُ **أثناءَ** العطبِ؟»، وهذا العقدُ يسأل سؤالاً ثالثاً:
# «إذا وقعت الطوارئُ فعلاً — هل تمشي السلسلةُ كاملةً **من الإيقافِ إلى التقريرِ**
# بأمرٍ واحدٍ بلا خطوةٍ يدويّةٍ غيرِ موثَّقةٍ؟». فالتعافي طورٌ **داخلَ** هذا
# التمرينِ لا بديلٌ عنه، ويُنفَّذ باستدعاءِ منفِّذِه نفسِه لا بمحاكاتِه.
#
# **وقاعدةُ القبولِ الحاكمةُ (معيارُ `M11.07` بحرفِه):** «تمرينٌ موثَّقٌ بزمنِ كلِّ
# مرحلةٍ، وصفرُ خطوةٍ يدويّةٍ غيرِ موثّقةٍ». فكلُّ طورٍ يُقاس زمنُه على ساعةٍ
# مُحقَنةٍ ويُحاسَب على عهدِه، **ولا يُقبَل طورٌ بغيابِ خطأٍ**: لكلِّ طورٍ
# `enforcement` هو الرفضُ أو القبولُ الذي **يجب أن يقع فعلاً** حتى يُعَدَّ الطورُ
# مُنفَّذاً — فإيقافٌ لا يُرَدُّ به فعلٌ إيقافٌ مكتوبٌ على قرصٍ لا إيقافُ دولةٍ.
#
# ويُحرَس محتواها بالبوابةِ `npm run guard:emergency` (البوابةُ الخامسةُ
# والأربعون) وبالمخطَّطِ `config/schemas/emergency-drill.schema.json`
# بـ`additionalProperties: false` في كلِّ عقدة.
#
# **وحدٌّ معلَنٌ في صدرِ العقدِ:** التمرينُ يُثبت **جاهزيّةَ الآلةِ** لا سلامةَ
# النظامِ ولا اعتمادَه؛ ولا يُقرأ نجاحُه مراجعةً مستقلّةً (`M11.04`–`M11.06`) ولا
# قراراً ملكيّاً (`M11.09`) ولا إذناً بإطلاقٍ.

version: '1.0.0'

# ══════════════════════════════════════════════════════════════════════════
# ١ — العهدُ: زمنُ التمرينِ كاملاً
# ══════════════════════════════════════════════════════════════════════════
# رقمٌ **واحدٌ** يُحاسَب عليه التمرينُ من أوّلِ طورٍ إلى آخرِه، ومجموعُ عهودِ
# الأطوارِ لا يجوز أن يتجاوزَه — يُفحَص ذلك عند تحميلِ العقدِ لا في منتصفِ تمرين.
objective:
  maxDrillMs: 180000
  statement: >-
    تمشي سلسلةُ الطوارئ كاملةً — إيقافٌ سياديٌّ، فحجْرٌ على شذوذٍ مقيسٍ، فتعافٍ
    إلى بيئةٍ خاليةٍ، فاستئنافٌ بإقرارِ العقدِ الحيّةِ، فتقريرٌ ملكيٌّ بزمنِ كلِّ
    طورٍ — بأمرٍ واحدٍ في مدّةٍ لا تتجاوز ثلاثَ دقائقَ، وما جاوزها إخفاقٌ مُعلَنٌ
    برمزِ خروجٍ موجبٍ لا تحذيرٌ يُقرأ ويُنسى.

# ══════════════════════════════════════════════════════════════════════════
# ٢ — الأطوارُ الخمسةُ مرتَّبةً: لكلٍّ عهدُ زمنٍ و**إنفاذٌ مقيسٌ**
# ══════════════════════════════════════════════════════════════════════════
# ترتيبُها **مُلزِمٌ** ولا يُقبَل طورٌ قبل سابقِه ولا تمرينٌ ينقصه طورٌ — الضمان
# `G-EMERGENCY-PHASES-ORDERED`. و`enforcement` في كلِّ طورٍ هو **ما يجب أن يُرَدَّ
# أو يُقبَل فعلاً**، والضمان `G-EMERGENCY-ENFORCEMENT-MEASURED` يمنع أن يُقرأ
# غيابُ الخطأِ إنفاذاً.
phases:
  - id: phase:halt
    order: 1
    maxMs: 20000
    purpose: >-
      إصدارُ الإيقافِ الشاملِ بتوقيعِ الملكِ على مفتاحٍ حقيقيٍّ مُزوَّدٍ في مخزنٍ
      معزولٍ، وتسجيلُ عقدةٍ حيّةٍ قبلَه حتى يكون للإيقافِ من يُقرُّ به.
    enforcement: >-
      الحالةُ المقروءةُ من ملفِّ التوجيهِ تصير `halted` بعهدٍ موجبٍ، **ويُرَدُّ
      استئنافٌ** يُطلَب قبلَ إقرارِ العقدةِ الحيّةِ برمزِ `HALT_NOT_CONFIRMED` —
      فإيقافٌ لا يُرَدُّ به فعلٌ كتابةٌ على قرصٍ لا إيقافُ دولة.
    enforcedBy: scripts/lib/emergency-facts.mjs

  - id: phase:quarantine
    order: 2
    maxMs: 20000
    purpose: >-
      إبلاغُ حاجبِ الحجْرِ بشذوذٍ متكرِّرٍ على وكيلٍ حقيقيٍّ مُسجَّلٍ حتى يبلغَ
      عتبتَه المعلَنةَ، فيُفتَح له حادثٌ ويُنقَل الوكيلُ إلى حالةِ الحجْر.
    enforcement: >-
      الحاجبُ يُعلن `isolated` ويفتح حادثاً بمعرَّفٍ، **وبوابةُ الهويّةِ تَرُدُّ
      الوكيلَ المحجورَ** برمزِ `IDENTITY_NOT_ACTIVE` — فحجْرٌ لا يمنع فعلاً
      تسميةٌ في ذاكرةٍ لا عزلٌ.
    enforcedBy: scripts/lib/emergency-facts.mjs

  - id: phase:recovery
    order: 3
    maxMs: 100000
    purpose: >-
      استدعاءُ منفِّذِ تجربةِ التعافي نفسِه (`scripts/recovery-drill.mjs`) عمليّةً
      ابناً حقيقيّةً على جذرٍ مؤقّتٍ: نسخٌ فبصمٌ، فتفريغٌ تامٌّ، فاستعادةٌ،
      فمطابقةُ بصمةٍ ملفّاً ملفّاً.
    enforcement: >-
      رمزُ خروجِ العمليّةِ الابنِ **صفرٌ** وحكمُها `recovery:met` مقروءٌ من
      مخرَجِها — ولا يُقبَل تعافٍ بمحاكاةٍ في العمليّةِ نفسِها ولا بنداءِ دالّةٍ
      تُطمئن.
    enforcedBy: scripts/lib/emergency-facts.mjs

  - id: phase:resume
    order: 4
    maxMs: 20000
    purpose: >-
      إقرارُ العقدةِ الحيّةِ بتوقّفِها، ثم استئنافُ الدولةِ بتوقيعِ الملكِ،
      والتحقّقُ من صحّةِ التوجيهِ بعدَ الاستئناف.
    enforcement: >-
      الحالةُ تعود `running` **بعهدٍ أكبرَ** من عهدِ الإيقافِ (فاستئنافٌ بعهدٍ لا
      يتقدّم لا يُميَّز من إعادةِ بثِّ توجيهٍ قديمٍ)، ويُصدِّق التحقّقُ التوجيهَ
      الجديد.
    enforcedBy: scripts/lib/emergency-facts.mjs

  - id: phase:report
    order: 5
    maxMs: 20000
    purpose: >-
      كتابةُ التقريرِ الملكيِّ للتمرينِ: كلُّ طورٍ بزمنِه المقيسِ وعهدِه ودليلِ
      إنفاذِه، ثم إضافةُ واقعةِ الختامِ إلى دفترِ الطوارئ.
    enforcement: >-
      ملفُّ التقريرِ يُقرأ من القرصِ بعدَ كتابتِه ويحمل **زمناً مقيساً لكلِّ طورٍ
      من الأطوارِ الخمسةِ** وسطراً في الدفترِ بتاريخٍ صالحٍ — وتقريرٌ ينقصه زمنُ
      طورٍ واحدٍ يُحكَم غيرَ مقيسٍ لا ناجحاً.
    enforcedBy: scripts/lib/emergency-facts.mjs

# ══════════════════════════════════════════════════════════════════════════
# ٣ — الأحكامُ ورموزُ خروجِها: الجاهزيّةُ وحدَها تخرج صفراً
# ══════════════════════════════════════════════════════════════════════════
verdicts:
  - id: emergency:ready
    exitCode: 0
    meaning: >-
      الأطوارُ الخمسةُ نُفِّذت بترتيبِها، وكلُّ إنفاذٍ وقع فعلاً ورُدَّ به فعلٌ أو
      قُبِل، وزمنُ كلِّ طورٍ ضمنَ عهدِه وزمنُ التمرينِ ضمنَ عهدِه، والتقريرُ
      مكتوبٌ بزمنِ كلِّ طورٍ ومُقيَّدٌ في الدفتر.
  - id: emergency:failed
    exitCode: 78
    meaning: >-
      طورٌ لم يُنفَّذ إنفاذُه: إيقافٌ لم يُرَدَّ به استئنافٌ، أو محجورٌ لم تَرُدَّه
      بوابةُ الهويّةِ، أو تعافٍ خرج بغيرِ صفرٍ، أو استئنافٌ بعهدٍ لا يتقدّم، أو
      زمنٌ جاوز عهدَه.
  - id: emergency:unmeasured
    exitCode: 79
    meaning: >-
      لم يقع قياسٌ صالحٌ: طورٌ لم يُنفَّذ أصلاً، أو تقريرٌ ينقصه زمنُ طورٍ، أو
      ساعةٌ لا تُصدر عدداً منتهياً — ولا يُقرأ هذا الصمتُ جاهزيّةً.

# ══════════════════════════════════════════════════════════════════════════
# ٤ — الجذورُ والمخرَجات
# ══════════════════════════════════════════════════════════════════════════
source:
  stateRoot: .state/emergency
  reportsDir: .state/emergency/reports

# ══════════════════════════════════════════════════════════════════════════
# ٥ — الدفترُ وسجلُّ آخرِ تمرين
# ══════════════════════════════════════════════════════════════════════════
ledger:
  path: .state/emergency/ledger.jsonl
  lastDrillPath: .state/emergency/last-drill.json

# ══════════════════════════════════════════════════════════════════════════
# ٦ — أحداثُ التدقيق
# ══════════════════════════════════════════════════════════════════════════
events:
  - emergency.halt.issued
  - emergency.subject.quarantined
  - emergency.state.recovered
  - emergency.halt.resumed
  - emergency.report.published
  - emergency.drill.completed
  - emergency.drill.refused

# ══════════════════════════════════════════════════════════════════════════
# ٧ — رموزُ الرفض
# ══════════════════════════════════════════════════════════════════════════
# متقابلةٌ في الاتجاهين مع `EMERGENCY_ERRORS` في `src/emergency/errors.mjs`:
# لا رمزَ هنا بلا نظيرٍ هناك، ولا رمزَ هناك بلا نظيرٍ هنا.
refusalCodes:
  - code: EMERGENCY_CONFIG_INVALID
    when: العقدُ لا يوافق مخطَّطَه أو ينقصه قسمٌ لازم.
  - code: EMERGENCY_OBJECTIVE_INVALID
    when: زمنُ التمرينِ المستهدَفُ ليس عدداً صحيحاً موجباً منتهياً، أو مجموعُ عهودِ الأطوارِ يتجاوزه.
  - code: EMERGENCY_PHASE_ORDER_INVALID
    when: أطوارُ التمرينِ ليست متتاليةً من واحدٍ بلا فجوةٍ ولا تكرار.
  - code: EMERGENCY_PHASE_SKIPPED
    when: طورٌ نُفِّذ قبل الذي يسبقه أو طورٌ لم يُنفَّذ أصلاً.
  - code: EMERGENCY_PHASE_UNIMPLEMENTED
    when: طورٌ معلَنٌ في العقدِ بلا مُنفِّذٍ في جامعِ الوقائع — ووعدُ طورٍ لا يقع.
  - code: EMERGENCY_VERDICT_UNDECLARED
    when: حُكِم بحكمٍ لا إعلانَ له في العقد.
  - code: EMERGENCY_HALT_NOT_ENFORCED
    when: الإيقافُ صُدِر ولم يُرَدَّ به استئنافٌ قبلَ الإقرار — فلم يُقَس إنفاذُه.
  - code: EMERGENCY_QUARANTINE_NOT_ENFORCED
    when: الوكيلُ حُجِر ولم تَرُدَّه بوابةُ الهويّةِ برمزِ عدمِ النشاط.
  - code: EMERGENCY_RECOVERY_FAILED
    when: عمليّةُ التعافي الابنُ خرجت بغيرِ صفرٍ أو بحكمٍ غيرِ البلوغ.
  - code: EMERGENCY_RESUME_NOT_ENFORCED
    when: الاستئنافُ لم يُعِد الحالةَ إلى العملِ أو لم يتقدّم عهدُه أو لم يُصدِّقه التحقّق.
  - code: EMERGENCY_REPORT_INCOMPLETE
    when: التقريرُ لا يحمل زمناً مقيساً لكلِّ طورٍ أو لم تُقيَّد واقعةُ ختامِه في الدفتر.
  - code: EMERGENCY_TIME_EXCEEDED
    when: زمنُ طورٍ جاوز عهدَه أو زمنُ التمرينِ جاوز العهدَ المعلَن.
  - code: EMERGENCY_CLOCK_INVALID
    when: الساعةُ المُمرَّرةُ لا تُصدر عدداً صحيحاً منتهياً.
  - code: EMERGENCY_LEDGER_INVALID
    when: دفترُ الطوارئ موجودٌ ولا يُقرأ أو ينقصه تاريخُ واقعةٍ.

# ══════════════════════════════════════════════════════════════════════════
# ٨ — الضمانات
# ══════════════════════════════════════════════════════════════════════════
# رمزُ كلِّ ضمانٍ **حاضرٌ نصّاً** في ملفِّ إنفاذِه، ويُثبت الحاجزُ حضورَه.
guarantees:
  - id: G-EMERGENCY-PHASES-ORDERED
    statement: >-
      أطوارُ التمرينِ تُنفَّذ بترتيبِها المعلَنِ، ولا يُقبَل طورٌ قبل سابقِه ولا
      تمرينٌ ينقصه طور.
    enforcedIn: src/emergency/phase-plan.mjs
  - id: G-EMERGENCY-ONLY-READINESS-EXITS-ZERO
    statement: >-
      لكلِّ حكمٍ رمزُ خروجٍ مُفرَدٌ، والجاهزيّةُ وحدَها تخرج صفراً؛ فحكمٌ
      بالإخفاقِ يخرج صفراً حكمٌ لا يقرؤه مسارٌ آليّ.
    enforcedIn: src/emergency/contract.mjs
  - id: G-EMERGENCY-ENFORCEMENT-MEASURED
    statement: >-
      كلُّ طورٍ يُقبَل بوقوعِ إنفاذِه المعلَنِ فعلاً — رفضٌ يُرَدُّ به فعلٌ أو
      قبولٌ يُقرأ من القرصِ — لا بغيابِ خطأٍ في تنفيذِه.
    enforcedIn: scripts/lib/emergency-facts.mjs
  - id: G-EMERGENCY-EVERY-PHASE-EXECUTED
    statement: >-
      تمرينٌ ينقصه طورٌ واحدٌ يُحكَم غيرَ مقيسٍ برمزِ خروجٍ موجبٍ، ولا يُقرأ
      نقصانُ طورٍ نجاحاً جزئيّاً.
    enforcedIn: src/emergency/judgement.mjs
  - id: G-EMERGENCY-PER-PHASE-TIMED
    statement: >-
      لكلِّ طورٍ زمنٌ مقيسٌ بساعةٍ مُحقَنةٍ يُحاسَب على عهدِه المكتوبِ، وتقريرٌ
      ينقصه زمنُ طورٍ يُحكَم غيرَ مقيس.
    enforcedIn: src/emergency/judgement.mjs
  - id: G-EMERGENCY-NO-SKIP-FLAG
    statement: >-
      لا عَلَمَ تخطٍّ ولا إنجاحٍ قسريٍّ في منفِّذِ التمرينِ أصلاً، ووسيطٌ غيرُ
      معروفٍ يُرَدُّ بحكمِ رفضٍ لا يُتجاهَل.
    enforcedIn: scripts/emergency-drill.mjs
  - id: G-EMERGENCY-ZERO-MANUAL-STEPS
    statement: >-
      التمرينُ يمشي بأمرٍ واحدٍ من الإيقافِ إلى التقريرِ بلا مُدخلَةِ إنسانٍ بين
      طورٍ وطورٍ: لا قراءةَ من مَدخلٍ قياسيٍّ ولا انتظارَ إذنٍ.
    enforcedIn: scripts/emergency-drill.mjs
  - id: G-EMERGENCY-PURE-JUDGEMENT
    statement: >-
      وحداتُ الحكمِ لا تلمس قرصاً ولا تُشغِّل عمليّةً ولا تقرأ ساعةَ جهازٍ،
      فالحكمُ الذي يلمس ما يفحصه يستطيع أن يُصلِحه ثم يُثني عليه.
    enforcedIn: src/emergency/judgement.mjs
