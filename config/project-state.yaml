# عقدُ ذاكرةِ المشروعِ التنفيذيّةِ — `project-state` (‏`WL-329`).
#
# **ما هذا الملفُّ:** القائمةُ الموثوقةُ الواحدةُ لملفّاتِ «التوثيقِ حاملِ الحالةِ والتقدُّمِ»
# (‏progress-bearing documentation) — الملفّاتُ التي يقرأُها وكيلٌ جديدٌ ليعرفَ ما جرى وما
# بقيَ، فلا تَصحُّ أن تتأخَّرَ عن الكودِ ولا أن تسبِقَه. ويُنفِذُه `npm run guard:project-state`
# (‏`scripts/guard-project-state.mjs`) على **الفرقِ** بينَ الفرعِ وأساسِه، محلّيّاً في `pre-push`
# وفي CI داخلَ الفحصِ المطلوبِ «فحص الجودة الكامل».
#
# **التصنيفُ ثلاثيٌّ، وأصلُه «تنفيذيٌّ» (‏منعٌ افتراضيٌّ لا قائمةُ إذنٍ):**
#   - `memory`: ذاكرةُ المشروعِ — تعديلُها حدثٌ يُقيَّدُ.
#   - `neutral`: لا يحملُ حالةً — تعديلُه لا يَطلُبُ شيئاً (‏وثائقُ شرحٍ، وأثرُ القياسِ المولَّدُ).
#   - كلُّ ما سواهما **تنفيذيٌّ**: كودٌ وعقودٌ وهجراتٌ وسيرُ عملٍ وتبعيّاتٌ — فمجلّدٌ جديدٌ
#     يُضافُ غداً تنفيذيٌّ بلا تعديلِ هذا الملفِّ.
#
# **حدٌّ معلَنٌ:** الحاجزُ يقيسُ **الاقترانَ** (‏تغيّرَ الكودُ ⇒ قُيِّدَ في الحزمةِ نفسِها،
# وما ادُّعيَ أثرُه موجودٌ في الفرقِ) ولا يقيسُ **صدقَ** النصِّ — وذاك شرطُ المادة 1.

version: 1

# نقطةُ الدخولِ التي يقرؤها كلُّ وكيلٍ قبلَ العملِ.
entryPoint: AGENTS.md

# سجلُّ الأعمالِ — موضعُ القيدِ الإلزاميِّ لكلِّ تغييرٍ حاملٍ للحالة.
workLog: docs/roadmap/05-work-log.md

# لوحةُ الحالةِ — سطرُ «آخر تحديث» الأوّلُ يحملُ أحدثَ مُدخلةٍ (‏`guard:status-freshness`).
status: PROJECT_STATUS.md

# سجلُّ الديونِ — صفٌّ مذكورٌ معرِّفُه في عنوانِ مُدخلةٍ جديدةٍ يجبُ أن يذكرَها.
debtRegister: docs/roadmap/06-debt-register.md

# ملخّصُ التسليمِ المولَّدُ — يُعادُ توليدُه بـ`npm run handoff:report` ويُقارَنُ بايتاً ببايتٍ.
handoff: docs/HANDOFF.md

# ملفّاتٌ يكتبُها أمرٌ مولِّدٌ أو هي القيدُ نفسُه: لا تُطالَبُ بأن تُسمّى في «الملفات المتأثرة».
selfRecords:
  - docs/roadmap/05-work-log.md
  - docs/HANDOFF.md
  - docs/READINESS_REPORT.md

memory:
  - path: AGENTS.md
    role: نقطةُ الدخولِ ودورةُ العملِ الإلزاميّةُ
  - path: GOVERNANCE_RULE.md
    role: القاعدةُ الحاكمةُ — تغلبُ عندَ التعارض
  - path: PROJECT_STATUS.md
    role: لوحةُ الحالةِ وسطورُ «آخر تحديث»
  - path: docs/HANDOFF.md
    role: ملخّصُ التسليمِ المولَّدُ للوكيلِ التالي
  - path: docs/roadmap/05-work-log.md
    role: سجلُّ الأعمالِ (‏المادة 6) — إضافةٌ في الأعلى بلا تعديلِ قديم
  - path: docs/roadmap/06-debt-register.md
    role: سجلُّ الديونِ الموحَّدُ — المفتوحُ ومَن يملكُ إغلاقَه
  - path: docs/roadmap/03-roadmap-to-100.md
    role: الخطواتُ وعدّادُها (‏`guard:progress`)
  - path: docs/roadmap/02-baseline-audit.md
    role: خطُّ الأساسِ والنسبةُ (‏`guard:progress`)
  - path: docs/roadmap/04-execution-playbook.md
    role: قواعدُ التنفيذِ والإصدار
  - path: version.json
    role: الإصدارُ والنسبةُ المحسوبة (‏`guard:version` و`guard:progress`)
  - path: config/work-log-ids.yaml
    role: فجواتُ ترقيمِ السجلِّ المُعلَنةُ (‏`guard:work-log-ids`)
  - path: docs/audit/work-log-id-map.md
    role: خريطةُ معرِّفاتِ السجلّ
  - path: config/external-review.yaml
    role: عقدُ نتائجِ المراجعةِ المستقلّةِ — حكمُه للمجلسِ لا للمنفِّذ
  - path: docs/READINESS_REPORT.md
    role: تقريرُ الجاهزيّةِ المولَّدُ (‏`guard:readiness`)
  - path: docs/CURRENT_STATE.md
    role: الحالةُ الحاليّةُ المقيسةُ — لقطةٌ مؤرَّخةٌ بالكوميت
    # تعديلُ ما تصفُه هذه الوثيقةُ يُلزِمُ بتحديثِها **أو** بإعلانٍ صريحٍ في المُدخلةِ:
    #   غيرُ متأثِّرٍ: `docs/CURRENT_STATE.md` — <السببُ>
    affectedBy:
      - src/production/**
      - src/root-of-trust/**
      - scripts/production-entry.mjs
      - .github/workflows/**
  - path: README.md
    role: واجهةُ المشروعِ وسطرُ «آخر تحقُّق»
  - path: docs/adr/**
    role: سجلّاتُ القرارِ المعماريِّ

# لا يحملُ حالةً: شرحٌ ووثائقُ وحداتٍ (‏يحرسُ كلّاً حاجزُه)، وأثرُ القياسِ المولَّدُ الذي
# يُنتِجُه مسارُ النشرِ ويحرسُه `guard:skip-baseline`.
neutral:
  - '**/*.md'
  - docs/**
  - LICENSE
