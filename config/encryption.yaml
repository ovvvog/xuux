# التشفير عند التخزين وعند النقل — M7.03
#
# ما كان قائماً قبل هذا الملف: التخليص الأمني (M7.02) يمنع القراءة **من خلال
# الكود**، وبوابة الوصول تُقيّم السياسة وتتحقّق من التذكرة قبل الأثر. لكن مادة
# الذاكرة كانت تُخزَّن نصّاً صريحاً في عمود `content`: فمن وصل إلى القاعدة من
# غير طريق الكود — نسخة احتياطية منسوخة، قرصٌ مُصادَر، وصلة `psql` بحساب
# صيانة — قرأ السيادي كما هو، وكلُّ ما بُني في M7.01 و M7.02 لا يعترضه.
#
# ولذلك هذا الملف **بيان** لا تعليق: المعمّى ومقاساته وأسماء مفاتيح المراتب
# والمخازن التي لا تُكتب نصّاً، كلُّها هنا ويقرؤها `src/data/encryption.mjs`
# ويحرسها `scripts/guard-encryption.mjs`. وما يجب أن **لا** يكون هنا: مادةُ
# مفتاح واحدة. المفاتيح تأتي من مزوّد المفاتيح (`KeyProvider`) الذي يُختار من
# البيئة كما يُختار مزوّد مفتاح الملك (M2.03)، والحاجب يرفض أي قيمة تشبه مادة
# مفتاح في هذا الملف — فلا يكفي أن نتفق على ذلك، بل يفشل البناء إن خُولف.

version: 1
owner: crown

# المعمّى: مصادقٌ على المحتوى (AEAD)، فتغييرُ حرفٍ في المعمّى يُكشف عند الفكّ
# ولا يُعاد نصّاً محرَّفاً. و`aes-256-gcm` مثبَّت اسماً هنا ويُقارن باسم المعمّى
# في الكود: معمّى يُقرأ من الإعداد بلا قائمة مسموح كان سيقبل `aes-256-ecb` من
# مُحرِّرٍ حسن النية فيُنتج تشفيراً بلا مصادقة ولا عشوائية.
cipher:
  algorithm: aes-256-gcm
  keyBytes: 32
  ivBytes: 12
  tagBytes: 16

# التغليف على طبقتين: مفتاح بيانات (DEK) عشوائي **لكل مدخل**، مغلَّف بمفتاح
# المرتبة (KEK) المقيم في المزوّد. ولماذا لا مفتاح واحد للمرتبة يُشفّر به كل
# مدخل مباشرةً: لأن تدوير مفتاح المرتبة كان سيعني فكّ كل المداخل وإعادة
# تشفيرها بالمفتاح الجديد — وهو عملٌ لا يُنجَز على قاعدة حيّة، فيُؤجَّل التدوير
# إلى «لاحقاً» ولا يقع. بالتغليف يُعاد تغليف مفتاح المدخل وحده (٦٠ بايت) ولا
# تُلمس المادة.
keys:
  # اسم المفتاح في المزوّد لكل مرتبة تحتاج تشفيراً. أي مرتبة `encryptAtRest: true`
  # في `config/classification.yaml` وليس لها اسم هنا تُسقط التحميل بـ
  # `ENCRYPTION_TIER_KEY_UNDECLARED` — فلا تُشفَّر مرتبةٌ بمفتاح مرتبةٍ أخرى ولا
  # تمرّ بلا تشفير لأن اسمها نُسي.
  perTier:
    - tier: internal
      name: data:kek:internal
    - tier: sensitive
      name: data:kek:sensitive
    - tier: sovereign
      name: data:kek:sovereign
  # المفاتيح لا تُنشأ عند الكتابة: `seal` يطلب المفتاح ولا يولّده. فمخزنٌ فقد
  # مفتاحه يجب أن يُخفق بـ`ENCRYPTION_KEY_UNAVAILABLE`، لا أن يولّد مفتاحاً
  # جديداً فيصير كل ما قبله غير قابل للفكّ **بلا أن يشتكي أحد**. الإنشاء فعلٌ
  # صريح في `ensureTierKey` يُنادى في التمهيد.
  createOnDemand: false
  # عمرٌ يُعلَن ليُقاس: `describeKeyAge` يقول عمر المفتاح، والتدوير نفسه فعلٌ
  # مُعلَن في M7.06 ولا يُدَّعى هنا أنه آلي.
  maxAgeDays: 365

# المخازن التي **لا تُخزَّن مادتها نصّاً**، ومن يكتبها. الحاجب يقرأ هذه القائمة
# فيتحقّق أن كل كاتبٍ معلَن يمرّ بالتغليف، ويفحص المخزون نفسه: أي صفٍّ ليس
# مغلَّفاً هو خرقٌ يُسقط البوابة.
#
# ولماذا `alwaysEncrypt: true` لذاكرة الوكلاء ولو كان تصنيف المدخل `public`:
# لأن التصنيف يسكن `state.data_assets` لا `state.memories`، فقيدُ القاعدة لا
# يستطيع أن يقرأه — وتكرارُ التصنيف عموداً في الجدولين هو **بعينه** انحراف
# «الحقيقة الواحدة في موضعين» الذي أُصلح في M7.01. فالقرار: محتوى ذاكرة وكيل
# ليس مادةً عامّة، ويُغلَّف دائماً، فيصير القيد في القاعدة غير مشروط ويحرس
# نفسه بلا عمودٍ منسوخ.
stores:
  - name: state.memories
    field: content
    writer: src/data/memory-store.mjs
    alwaysEncrypt: true
    dbConstraint: memories_content_sealed

# النقل. القاعدة القائمة كانت ترفض وصلةً بلا TLS **في الإنتاج وحده**، فبيئةٌ
# اسمها `staging` تحمل بيانات حقيقية كانت تنقلها نصّاً على الشبكة. والقاعدة
# الجديدة على **المضيف** لا على اسم البيئة: مضيفٌ غير محلي بلا TLS مرفوض في كل
# بيئة، ولا يُستثنى إلا `loopback` حيث لا شبكة تُنصت أصلاً.
transport:
  requireTls: true
  allowPlaintextToLoopback: true
  loopbackHosts:
    - localhost
    - 127.0.0.1
    - '::1'

# المزوّد: من أين تأتي المفاتيح. المزوّد المحلي (ملفٌ مشفَّر على قرص الخدمة)
# يُعلن عن نفسه `productionReady: false`، ويُرفض في الإنتاج — وهي نفس الفجوة G1
# في وثيقة التدقيق، ولا يُغلقها إلا مخزن أسرار خارجي.
provider:
  requireProductionReadyIn:
    - production
  # متغيّرات البيئة التي تُختار بها الوجهة؛ مذكورة هنا للتدقيق، ويقرؤها
  # `dataKeyProviderFromEnv`. ولا قيمة سرّ في هذا الملف.
  environmentVariables:
    remote:
      - DATA_KEY_STORE_ENDPOINT
      - DATA_KEY_STORE_TOKEN
    local:
      - DATA_KEY_DIR
      - DATA_KEY_MASTER
