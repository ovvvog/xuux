# عقد النشر القابل للتراجع — الخطوة `M10.06`
#
# **العيب الذي تُغلقه هذه الوثيقة:** بعد `M10.01`–`M10.05` صار للنظام رقمٌ
# وحكمٌ وصوتٌ وثمنٌ وبيئةٌ تُقام بأمرٍ واحد. وكلُّ ذلك يقول «هذه النسخة بخيرٍ
# **الآن**» ولا يقول **كيف تُستبدَل نسخةٌ بنسخة**. ومن دفع نسخةً جديدةً كاملةً
# في لحظةٍ واحدةٍ إلى كل مستعمليها أخفق — إن كانت معيوبةً — بالدولة كلِّها معاً
# لا بشريحةٍ منها؛ ومن رجع منها **بذاكرة إنسانٍ يتذكّر أيُّ نسخةٍ كانت سليمة**
# رجع بأسوأ مصادر الحقيقة في أسوأ لحظةٍ لقراءتها.
#
# **والقاعدة الحاكمة هنا: لا موجةَ نشرٍ بلا بوابةِ صحّةٍ، ولا بوابةَ صحّةٍ
# بعتبةٍ تُكتب هنا، ولا تراجعَ ينتظر إذناً.** فكل بوابةٍ في هذه الوثيقة تُشير
# إلى **أهداف `config/service-levels.yaml` بمعرّفاتها** ولا تحمل رقمَ هدفٍ
# واحداً: عتبةٌ في موضعين تتباعد عن أختها عند أول تعديل، فيصير الأخضرُ في النشر
# أخضرَ على عهدٍ لم يعد قائماً. وحرسُ ذلك `G-DEPLOY-SINGLE-SOURCE-THRESHOLDS`.
#
# **والتراجع فعلٌ لا نيّة:** `rollback.automatic: true` يعني أن انكسار بوابةٍ
# **يُعيد الإصدار السليم السابق من دفتر النشر** بلا إقرارٍ بشريّ وبلا سؤال، وأن
# مدّة التراجع **تُقاس وتُكتب** لا تُقدَّر. ومن اشترط تدخّلاً هنا لم يبنِ
# تراجعاً بل بنى إشعاراً.
#
# **وموجةٌ بلا قياسٍ ليست موجةً ناجحة:** `verdict:unmeasured` حكمٌ مستقلٌّ عن
# `verdict:healthy` ويُوجب التراجع كما يوجبه العطب — فمن قدَّم موجةً لم يقع
# فيها حدثٌ واحدٌ قدَّم على صمتٍ قرأه نجاحاً.

version: 1

statement: >-
  النشر هنا معلَن بأعيانه: للإصدار هويّةٌ بصيغةٍ محكومةٍ ومحتوىً مبصومٌ في بيان،
  وللنشر موجاتٌ مرتّبةٌ يتّسع نصيبُها ولا يضيق، ولكل موجةٍ بوابةُ صحّةٍ تقرأ
  أهداف مستويات الخدمة بمعرّفاتها لا بأرقامٍ تُكتب ثانيةً، ولكل حكمٍ رمزُ خروجٍ
  معلَنٌ يقرؤه المسار الآليّ، والتراجع يقع من تلقائه إلى آخر إصدارٍ نشط سليمٍ
  مكتوبٍ في دفتر النشر لا في ذاكرة إنسان، وموجةٌ لم يقع فيها قياسٌ كافٍ تُردّ
  ولا تُقرأ نجاحاً.

# ── هويّة الإصدار: مبصومة لا مُدَّعاة ──
#
# والإصدار **مجلّد محتوىً مبصوم** لا صورة حاوية: وذلك **حدٌّ معلَن** لا نقصٌ
# مطويّ، مسجَّل في `docs/REMAINING_WORK.md`؛ فالحاويات وسجلّاتُ الصور ومزوّدو
# السحابة خارج حجز هذه الخطوة صراحةً.
release:
  idPattern: "^[0-9]+\\.[0-9]+\\.[0-9]+(?:[-+][0-9a-z.]+)?$"
  manifestFile: manifest.json
  probeFile: probe.mjs
  statement: >-
    هويّة الإصدار رقم إصدارٍ دلاليٌّ يُطابق الصيغة المعلَنة، ومحتواه مبصومٌ ملفّاً
    ملفّاً في بيانٍ يُكتب لحظة التهيئة، وفيه ملفُّ مجسٍّ باسمٍ معلَنٍ يُنادى عند كل
    موجةٍ فيُصدر مشاهداته بصيغة JSON على مخرجه القياسيّ. ومن نشر محتوىً بلا بصمةٍ
    لم يعرف بعد أسبوعٍ ماذا نشر.

# ── موجات النشر: نصيبٌ يتّسع وبوابةٌ تُقرأ قبل الاتّساع ──
waves:
  - id: wave:canary
    order: 1
    sharePercent: 10
    minObservations: 20
    timeoutMs: 20000
    objectives:
      - slo:api.availability
      - slo:api.latency
    statement: >-
      الموجة الأولى تعرض الإصدار الجديد على عُشر الحِمل: نصيبٌ يكفي لأن يقع فيه
      قياسٌ ولا يكفي لأن يكون عطبُه عطبَ الدولة كلِّها. وبوابتها هدفا النداء:
      إتاحتُه وزمنُه.

  - id: wave:half
    order: 2
    sharePercent: 50
    minObservations: 50
    timeoutMs: 20000
    objectives:
      - slo:api.availability
      - slo:api.latency
    statement: >-
      الموجة الثانية تُقدَّم على نصف الحِمل ولا تُقدَّم إلا بعد أن تصدر الأولى
      حكماً صحيحاً بقياسٍ كافٍ: فمن قفز إلى النصف على موجةٍ صامتةٍ قفز على صمتٍ
      لا على دليل.

  - id: wave:full
    order: 3
    sharePercent: 100
    minObservations: 50
    timeoutMs: 20000
    objectives:
      - slo:api.availability
      - slo:api.latency
      - slo:storage.latency
    statement: >-
      الموجة الأخيرة تُعمّم الإصدار على الحِمل كلِّه، وتُضيف إلى بوابتها هدفَ
      زمن القراءة على المستودع: فأثرُ الحِمل الكامل يظهر في الطبقة السفلى قبل أن
      يظهر في البوابة العليا.

# ── التراجع: آليٌّ بلا إقرار ──
rollback:
  automatic: true
  triggerOn:
    - verdict:broken
    - verdict:unmeasured
  maxDurationMs: 30000
  statement: >-
    التراجع يقع من تلقائه عند أيِّ حكمٍ من أحكام الإطلاق المعلَنة أعلاه، وإلى
    آخر إصدارٍ نُشِّط بحكمٍ صحيحٍ في دفتر النشر لا إلى ما يتذكّره منفِّذ النشر،
    ومدّته تُقاس بالملّي ثانية وتُكتب في الدفتر فيُحاسَب عليها سقفٌ معلَن. ومن
    ملك إيقافَه ملك تعطيلَ الضمان كلِّه، فهو مُعلَنٌ `true` ويحرس الحاجز أن يبقى.

# ── أحكام النشر ورموز خروجها ──
verdicts:
  - id: verdict:healthy
    exitCode: 0
    statement: >-
      الموجة أصدرت قياساً كافياً وكلُّ أهدافها ملتزمة، فتُقدَّم الموجة التالية.

  - id: verdict:broken
    exitCode: 70
    statement: >-
      هدفٌ واحدٌ على الأقل انكسر في الموجة، فيقع التراجع الآليّ ويخرج المنفِّذ
      بهذا الرمز ليقرأه المسار الآليّ لا الإنسان.

  - id: verdict:unmeasured
    exitCode: 71
    statement: >-
      لم يقع في الموجة قياسٌ يبلغ الحدَّ الأدنى المعلَن لها، فلا يُقرأ صمتُها
      نجاحاً ويقع التراجع كما يقع عند العطب.

# ── دفتر النشر: مصدر الحقيقة عن «أيُّ إصدارٍ كان سليماً» ──
ledger:
  path: .state/deployments/ledger.jsonl
  pointerPath: .state/deployments/current.json
  releasesPath: .state/releases
  statement: >-
    دفتر النشر ملفٌّ بإضافةٍ سطريّةٍ تُكتب فيه وقائعُ النشر بترتيبها، ومؤشِّرُ
    الإصدار النشط ملفٌّ مستقلٌّ يُقرأ في لحظةٍ واحدةٍ. ومنه — لا من ذاكرة أحدٍ —
    يُشتقّ هدفُ التراجع.

audit:
  events:
    - type: deploy.release.staged
      statement: الإصدار هُيِّئ في مجلَّد الإصدارات وبُصم محتواه في بيانه.
    - type: deploy.wave.promoted
      statement: موجةٌ صدر حكمُها صحيحاً بقياسٍ كافٍ فقُدِّمت التالية.
    - type: deploy.wave.refused
      statement: موجةٌ انكسرت بوابتُها أو لم تبلغ حدَّ قياسها فرُدَّت.
    - type: deploy.rollback.performed
      statement: التراجع الآليّ وقع وأُعيد الإصدار السليم السابق ومدّته مقيسة.
    - type: deploy.release.activated
      statement: الإصدار عُمِّم على الحِمل كلِّه بعد اجتياز كل الموجات.

refusalCodes:
  - code: DEPLOY_CONFIG_INVALID
    statement: عقد النشر يخالف مخطَّطه أو ترابطه، فيُردّ عند التحميل لا عند الاستعمال.
  - code: DEPLOY_RELEASE_ID_INVALID
    statement: هويّة الإصدار لا تطابق الصيغة المعلَنة في العقد.
  - code: DEPLOY_RELEASE_UNKNOWN
    statement: إصدارٌ يُطلب تنشيطه ولا وجود له في مجلَّد الإصدارات.
  - code: DEPLOY_WAVE_UNDECLARED
    statement: موجةٌ يُشار إليها بمعرّفٍ لا إعلان له في العقد.
  - code: DEPLOY_WAVE_ORDER_INVALID
    statement: ترتيب الموجات مكرَّرٌ أو غير متصاعد، فالخطّة لا تُبنى على ترتيبٍ ملتبس.
  - code: DEPLOY_WAVE_SHARE_INVALID
    statement: نصيب موجةٍ لا يتّسع عمّا قبله أو لا تنتهي الموجات بحِملٍ كامل.
  - code: DEPLOY_OBJECTIVE_UNDECLARED
    statement: بوابةٌ تُشير إلى هدف خدمةٍ لا إعلان له في config/service-levels.yaml.
  - code: DEPLOY_OBSERVATION_INVALID
    statement: مشاهدةُ موجةٍ بأعدادٍ غير صالحةٍ أو مُخفِقٍ يتجاوز مجموعَها.
  - code: DEPLOY_OBSERVATION_MISSING
    statement: بوابةٌ معلَنةٌ لموجةٍ ولا مشاهدة لها في مخرَج المجسّ.
  - code: DEPLOY_VERDICT_UNDECLARED
    statement: حكمٌ يُصدَر بمعرّفٍ لا إعلان له في العقد ولا رمزَ خروجٍ يقابله.
  - code: DEPLOY_ROLLBACK_TARGET_MISSING
    statement: التراجع لزم ولا إصدارَ سليمٌ سابقٌ في الدفتر يُرجَع إليه.
  - code: DEPLOY_ROLLBACK_DISABLED
    statement: سياسة التراجع الآليّ مُعطَّلة في العقد، وذلك تعطيلٌ للضمان لا تهيئة.
  - code: DEPLOY_PROBE_FAILED
    statement: مجسّ الإصدار لم يُصدر مشاهداتٍ صالحةً أو تجاوز مهلة موجته.
  - code: DEPLOY_CLOCK_INVALID
    statement: ساعةٌ مُمرَّرةٌ لا تُصدر عدداً منتهياً، فلا تُقاس بها مدّة تراجع.

guarantees:
  - id: G-DEPLOY-SINGLE-SOURCE-THRESHOLDS
    file: src/deployment/contract.mjs
    statement: >-
      عتبات بوابات النشر تُقرأ من أهداف config/service-levels.yaml بمعرّفاتها،
      ولا يُقبل في هذه الوثيقة رقمُ هدفٍ ولا عتبةُ زمنٍ. ويُردّ العقد عند التحميل
      إن أشار إلى هدفٍ غير معلَنٍ هناك.
  - id: G-DEPLOY-GATES-BEFORE-WIDENING
    file: src/deployment/rollout.mjs
    statement: >-
      لا يتّسع نصيب موجةٍ قبل صدور حكمٍ صحيحٍ عن سابقتها؛ فآلة الحالات لا تُصدر
      «تقدَّم» إلا من حكمٍ صحيحٍ بقياسٍ كافٍ.
  - id: G-DEPLOY-NO-EMPTY-SUCCESS
    file: src/deployment/rollout.mjs
    statement: >-
      موجةٌ لم تبلغ حدَّ مشاهداتها المعلَن تُصدر verdict:unmeasured لا
      verdict:healthy، فصمتُ القياس لا يُقرأ التزاماً.
  - id: G-DEPLOY-PURE-JUDGEMENT
    file: src/deployment/plan.mjs
    statement: >-
      بناء الخطّة والحكم على الموجات نقيّان: لا قرصَ ولا عمليّةَ ولا بيئةَ
      تشغيلٍ في src/deployment/plan.mjs ولا rollout.mjs ولا releases.mjs، فوحدةٌ
      لا تملك المُلحِق لا تستطيع أن تُصلح ما تفحص.
  - id: G-DEPLOY-ROLLBACK-AUTOMATIC
    file: scripts/deploy.mjs
    statement: >-
      التراجع يقع في المنفِّذ نفسِه عند أول حكمٍ موجبٍ له بلا إقرارٍ بشريٍّ ولا
      علمٍ يُمرَّر لتعطيله، ومدّته مقيسة مكتوبة في الدفتر.
  - id: G-DEPLOY-PREVIOUS-FROM-LEDGER
    file: src/deployment/releases.mjs
    statement: >-
      هدف التراجع يُشتقّ من وقائع دفتر النشر المكتوبة لا من وسيطٍ يُمرَّر ولا من
      ذاكرة منفِّذ، فآخر إصدارٍ نُشِّط بحكمٍ صحيحٍ هو الهدف.
  - id: G-DEPLOY-INJECTED-CLOCK
    file: scripts/lib/deployment-facts.mjs
    statement: >-
      كل زمنٍ يُكتب في الدفتر يأتي من ساعةٍ مُمرَّرة، ولا مؤقِّت يعمل بنفسه في
      مسار النشر، فمدّة التراجع تُثبَّت في الاختبار ولا تُقرأ من ساعة الجهاز.
