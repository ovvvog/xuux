# جدولةُ الأعمالِ الدوريّةِ — إغلاقُ الدَينِ `D-4` (‏`WL-191`).
#
# **العيبُ الذي تُغلقُه هذه القيودُ:** لم يكن في المستودعِ مُجدوِلٌ واحدٌ يُطلِقُ
# عملاً دوريّاً. التقاريرُ والتمارينُ كلُّها كانت نداءً يدويّاً في نصٍّ
# (`scripts/*-drill.mjs`، `scripts/readiness-report.mjs`)، ودوريّتُها **عهدٌ
# مكتوبٌ في عقدٍ** يُقاسُ فواتُه ولا يُطلَقُ عملٌ عندَه
# (`src/recovery/schedule.mjs` يقولُها بنصِّه: «لا مُجدوِلٌ ذاتيٌّ في هذه الخطوةِ،
# وذلك دَينٌ مُعلَن»). فكانت الدوريّةُ **وعداً يُراقَبُ** لا عملاً يقعُ.
#
# **والمواعيدُ تُقاسُ من الدفترِ لا من ذاكرةِ العمليّةِ:** إعادةُ تشغيلِ المُجدوِلِ
# لا تُصفِّرُ موعداً ولا تُعيدُ عملاً وقعَ. وكلُّ إطلاقٍ **واقعةٌ في دفترٍ**
# (`state.scheduled_runs`) بسلسلةٍ بالتجزئةِ، وقفلُ الشقِّ فيه هو ما يمنعُ إطلاقاً
# مزدوجاً لا متغيِّرٌ في الذاكرةِ.

version: 1

# نبضُ المُجدوِلِ: كم مرّةً يسألُ «ما استحقَّ؟». وهو **ليس** دوريّةَ الأعمالِ:
# نبضٌ أطولُ من أقصرِ دوريّةٍ يجعلُ العملَ يتأخّرُ عن موعدِه بمقدارِ النبضِ،
# ومُحمِّلُ القيودِ يرفضُ ذلك عند التحميلِ لا يكتشفُه المُشغِّلُ بعدَ فواتٍ.
tick:
  everyMinutes: 15
  # سقفُ ما يُطلَقُ في نبضةٍ واحدةٍ: مُجدوِلٌ بلا سقفٍ يستأنفُ بعدَ توقّفٍ طويلٍ
  # فيُطلِقُ كلَّ ما فاتَ دفعةً واحدةً — وذاك حملٌ مُفاجئٌ لا استئنافُ خدمةٍ.
  maxJobsPerTick: 2

# **لا تعويضَ عن شقٍّ فائتٍ:** الشقُّ الجاريُ وحدَه يُطلَقُ. شقٌّ مضى ولم يكتملْ
# يُعلَنُ فائتاً في السجلِّ (`scheduler.slot.missed`) ولا يُشغَّلُ بأثرٍ رجعيٍّ:
# تقريرُ نافذةٍ مضت ليس تقريرَ اليومِ، وكتابتُه اليومَ في الدفترِ تُقرأُ لاحقاً
# كأنّه وقعَ في موعدِه — وهو تزييفُ سجلٍّ لا استئنافُ خدمةٍ.

jobs:
  - id: job:readiness-report
    subject: تقريرُ الجاهزيّةِ الدوريُّ
    kind: report
    # الدوريّةُ والمَهَلُ: المَهَلُ سماحٌ قبلَ إعلانِ الفواتِ لا تمديدٌ للموعدِ.
    cadence:
      everyHours: 24
      graceHours: 6
    actorRole: role:operator
    # ما يفعلُه العملُ من أفعالٍ محكومةٍ — يُقايسُ بالعتبةِ السياديّةِ عند
    # التحميلِ. وقائمةٌ فارغةٌ تعني «لا فعلَ محكوماً»، لا «لم يُفحَصْ».
    performs:
      - read-audit
      - read-registry

  - id: job:recovery-drill
    subject: تمرينُ الاستعادةِ الدوريُّ
    kind: drill
    cadence:
      everyHours: 168
      graceHours: 24
    actorRole: role:operator
    performs:
      - read-registry
