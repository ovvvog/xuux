# أنواعُ الدليلِ المقبولةِ — ولكلِّ نوعٍ **موضعٌ يُقرأ على القرصِ**، فلا يُقبَل
# «دليلٌ» لا يُشار إلى سطرِه.
evidenceKinds:
  - id: evidence:worklog-attribution
    meaning: >-
      مُدخلةُ سجلِّ عملٍ (‏`WL-0NN`) **تُعلِنُ البندَ في موضعِ إسنادِها** — حقلِ
      «المسار والخطوة» من قالبِ المادةِ 6 أو عنوانِ المُدخلةِ — فصاحبُها أعلنَ أنّ
      العملَ وقعَ على هذا البندِ بمنفِّذِه وتاريخِه وما لم يتمَّ منه.
    locatedIn: docs/roadmap/05-work-log.md
  - id: evidence:worklog-mention
    meaning: >-
      مُدخلةُ سجلِّ عملٍ تذكرُ مُعرِّفَ البندِ **في المتنِ دونَ إسنادٍ مُعلَنٍ** —
      موضعٌ يُشار إليه **ويُراجَع**، وقد يكون ذِكرَ حَجبٍ أو تقادُمِ وثيقةٍ —
      **فلا يُقرأ إعلانَ إنجازٍ** (الدَّين `LIVE-4`).
    locatedIn: docs/roadmap/05-work-log.md
  - id: evidence:roadmap-table
    meaning: >-
      صفٌّ في جدولِ «أدلّة تنفيذ» داخلَ خارطةِ الطريقِ يذكرُ البندَ بدليلِه
      المُتحقَّقِ منه.
    locatedIn: docs/roadmap/03-roadmap-to-100.md
  - id: evidence:declared-deferral
    meaning: >-
      تأجيلٌ **مُصرَّحٌ** في سجلِّ التأجيلاتِ بسببِه وحاجزِه وشرطِ فكِّه وصاحبِ
      قرارِه ومُدخلةِ إعلانِه — وهو **ليس دليلَ إنجازٍ** بل إعلانُ عدمِ إنجازٍ.
    locatedIn: config/readiness-deferrals.yaml

# **موضعُ الإسنادِ وصيغةُ الإحالةِ المحيَّدةِ** — مُعلَنانِ في العقدِ لا مدفونَينِ في
# شفرةٍ: من كتبَ مُدخلةً في السجلِّ يقرأ من أيِّ حقلٍ يُقرأ إسنادُه، وكيف يُحيّدُ
# ذِكراً لا يُريدُه دليلاً.
attribution:
  fieldTitle: المسار والخطوة
  neutralReferencePrefix: 'لا-إسناد:'
  meaning: >-
    الإسنادُ يُقرأ من **الحقلِ المُعلَنِ** (`fieldTitle`) أو من عنوانِ المُدخلةِ،
    وما وردَ في سائرِ المتنِ ذِكرٌ سياقيٌّ لا إسنادٌ. ومن أرادَ ذِكراً لا يُقرأ
    دليلاً أصلاً كتبَ المعرِّفَ مسبوقاً بـ`neutralReferencePrefix`، فيُستثنى ذلكَ
    الذِّكرُ وحدَه من الدليلِ دونَ أن تُحيدَ المُدخلةُ كلُّها.

# التأجيلُ **موقوتٌ لا مفتوحٌ**: لكلِّ تأجيلٍ وتيرةُ إعادةِ نظرٍ يُحسَبُ منها موعدُ
# مراجعتِه القادمةِ، ومن فاتَ موعدُه أوقفَ الحاجزَ `guard:readiness` بالرمزِ
# `READINESS_DEFERRAL_REVIEW_OVERDUE` — والوتيرةُ قرارُ مالكٍ لا اختيارُ منفِّذٍ
# (‏`WL-204`، إغلاقُ الدَّينِ `LIVE-3`).
deferralRecheck:
  baselineCadence: P3M
  byAuthority:
    model-council: P1M
  decidedIn: WL-204
  meaning: >-
    الأساسُ مراجعةٌ كلَّ ثلاثةِ أشهرٍ (‏`P3M`) لكلِّ تأجيلٍ، وتُشدَّدُ إلى شهرٍ
    (‏`P1M`) لِما سلطةُ فكِّه **مجلسُ النماذجِ** لأنّه المسارُ الذي يُنتِجُ مخرجاتٍ
    بوتيرةٍ أسرعَ. وموعدُ المراجعةِ القادمةِ = آخرُ مراجعةٍ + الوتيرةُ، يُحسَبُ حساباً
    نقيّاً في `src/readiness/deferrals.mjs` ويُطبَعُ في §3 من التقريرِ. **والفَواتُ
    يُوقِفُ الحكمَ** لا يُنبِّهُ فقط: تأجيلٌ مضى موعدُه بلا مراجعةٍ تأجيلٌ مفتوحٌ
    عملاً وإن كانَ موقوتاً كتابةً.

# البنودُ تُقرأ من مصدرِها لا تُكتَب بيدٍ: صفوفُ الخطواتِ من جداولِ الخارطةِ،
# والبواباتُ من عناوينِها المعلَنةِ فيها.
