# عقدُ تقريرِ الجاهزيّةِ — الخطوة `M11.08`
#
# معيارُ القبولِ بحرفِه: «صفرُ بندٍ بلا دليلٍ أو بلا تأجيلٍ معلَنٍ». فالعقدُ هنا
# يُعلن **مصادرَ البنودِ** (لوحةُ الخطواتِ والبوابات) و**أنواعَ الدليلِ المقبولةِ**
# و**شكلَ التأجيلِ المُصرَّحِ**، ثم الأحكامَ ورموزَ خروجِها والأحداثَ ورموزَ الرفضِ
# والضمانات.
#
# **وحدٌّ يُقرأ مع كلِّ سطرٍ بعده:** تقريرُ الجاهزيّةِ **يقيس وجودَ الدليلِ وموضعَه
# لا كفايتَه**، و`readiness:reported` حكمُ آلةٍ على تغطيةِ البنودِ — **لا اعتمادٌ
# أمنيٌّ ولا قانونيٌّ ولا أخلاقيٌّ، ولا فتحٌ لـ`G11`، ولا إذنٌ بإطلاقٍ، ولا `100%`.**

version: '1.1.0'

objective:
  statement: >-
    يُقابِلُ كلَّ بندٍ من معاييرِ الاكتمالِ — كلَّ خطوةٍ في لوحةِ الخطواتِ وكلَّ
    بوابةٍ معلَنةٍ — بدليلِه على القرصِ أو بتأجيلٍ مُصرَّحٍ بسببِه وحاجزِه وشرطِ
    فكِّه وصاحبِ قرارِه؛ فبندٌ بلا دليلٍ ولا تأجيلٍ يُوقِفُ الحكمَ.
  limit: >-
    وجودُ الدليلِ وموضعُه مقيسٌ، وكفايةُ الضابطِ **غيرُ مقيسةٍ** هنا: كفايتُه شأنُ
    المراجعةِ المستقلّةِ واختبارِ الاختراقِ والمراجعةِ الأخلاقيّةِ القانونيّةِ
    (‏`M11.04`–`M11.06`) ولا يُنفِّذُها المنفِّذُ ولا يُوضَعُ حكمُها نيابةً عنها.

sources:
  roadmap: docs/roadmap/03-roadmap-to-100.md
  workLog: docs/roadmap/05-work-log.md
  deferrals: config/readiness-deferrals.yaml
  status: PROJECT_STATUS.md
