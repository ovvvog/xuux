# عقد الأقاليم وتجاوز الفشل — الخطوة `M10.07`
#
# **العيب الذي تُغلقه هذه الوثيقة:** صار للنظام بعد `M10.01`–`M10.06` أثرٌ وحكمٌ
# وصوتٌ وثمنٌ وبيئةٌ تُقام بأمرٍ واحد ونشرٌ يتراجع من تلقائه. وكل ذلك **يفترض
# موضعاً واحداً تعمل فيه الدولة**: لا إقليمَ معلَنٌ، ولا نسخةَ متماثلةً، ولا دورَ
# يُقال «هذا يكتب وهذا يقرأ». ومن سقط موضعُه الوحيد سقط كلُّ شيءٍ معه.
#
# **وأخطر من غياب الإقليم غيابُ ثلاثة أشياء:**
#
# 1. **نموذج الاتساق غير مكتوب.** من قرأ من نسخةٍ متماثلةٍ لا يعلم أيقرأ أحدثَ
#    حقيقةٍ أم حقيقةً متأخّرة، فيبقى «الاتساق» ظنّاً في رأس كل قارئ لا عهداً
#    يُحاسَب عليه. ونصُّ الخطوة يشترط توثيقه **صراحةً** لا ضمناً.
# 2. **تجاوز الفشل بيد إنسان.** من قرّر في لحظة عطلٍ أيُّ إقليمٍ يصير كاتباً فتح
#    باب **كاتبَين في وقتٍ واحد**، وضياعُ كتابةٍ لا تُستعاد أسوأ من توقّفٍ يُرى.
# 3. **لا أثرَ يُقاس.** من قال «الخدمة استمرّت» بلا زمن انقطاعٍ مقيسٍ ولا نافذة
#    فقدٍ معلَنةٍ قالها بلا رقمٍ يُحاسَب عليه — ومعيار القبول نصّاً: «إسقاط إقليم
#    كامل ⇒ استمرار الخدمة **بأثر معلَن ومقبول**».
#
# **والقاعدة الحاكمة هنا: كاتبٌ واحدٌ لا اثنان، وتجاوزٌ لا ينتظر إذناً، وأثرٌ
# يُقاس لا يُدَّعى، ونافذةُ الفقدِ معلَنةٌ في موضعٍ واحدٍ لا في موضعين.**

version: 1

statement: >-
  الأقاليم هنا معلَنة بأعيانها وأدوارها: إقليمٌ واحدٌ يكتب وسائرُها يقرأ، ونموذج
  الاتساق مكتوبٌ باسمه وبسقف تأخّرٍ مقيسٍ لا مقدَّر، وتجاوز الفشل يقع من تلقائه
  إلى أعلى المرشّحين أولويّةً ممن قِيس تأخّرُه ضمن العهد، ولا يُنصَّب كاتبٌ ثانٍ
  والكاتبُ الأول قائم، ولأثر السقوط سقفٌ معلَنٌ يُقاس عليه فيُقال «استمرّت
  الخدمة» برقمٍ لا بانطباع.

# ── نموذج الاتساق: مكتوبٌ صراحةً كما يشترط نصّ الخطوة ──
#
# **ونافذة الفقد تُعلَن هنا وحدها** ولا تُكتب ثانيةً في `impact`: عتبةٌ في موضعين
# تتباعد عن أختها عند أول تعديل. وحرسُ ذلك `G-REGION-SINGLE-SOURCE-BUDGET`.
consistency:
  model: asynchronous-replication
  maxReplicationLagMs: 5000
  readerGuarantee: >-
    القارئ يقرأ حقيقةً صحيحةً وقد تكون **متأخّرةً** بما لا يتجاوز سقف التأخّر
    المعلَن؛ ولا يُضمَن له أن يقرأ كتابتَه هو إن كتبها لتوّه في إقليم الكتابة.
  writerGuarantee: >-
    من كتب في إقليم الكتابة ثم قرأ منه قرأ كتابتَه — «اقرأ ما كتبتَ» مضمونٌ على
    الكاتب وحده، لا على القارئين.
  statement: >-
    النسخ غير متزامن: الكتابة تُقبَل في إقليم الكتابة ثم تُنسَخ إلى القارئين، فبين
    اللحظتين نافذةٌ يكون فيها القارئ متأخّراً. وهذا **عهدٌ معلَنٌ لا عيبٌ مطويّ**:
    من احتاج قراءةً لا تتأخّر قرأ من إقليم الكتابة، ومن قبل التأخّر قرأ من قارئٍ
    قِيس تأخّرُه ورُدَّ إن تجاوز السقف بالرمز `REGION_LAG_EXCEEDED`. وسقف التأخّر
    المعلَن هو نفسه **نافذة الفقد** عند تجاوز الفشل: ما لم يُنسَخ بعدُ لحظةَ سقوط
    الكاتب يُفقَد، ولا يُدَّعى غير ذلك.

# ── الأقاليم: كاتبٌ واحدٌ وقارئون بأولويّاتٍ معلَنة ──
regions:
  - id: region:primary
    role: writer
    priority: 1
    statePath: .state/regions/primary
    statement: >-
      إقليم الكتابة الأول: إليه تُوجَّه الكتابة ومنه يُنسَخ إلى غيره، وهو المرشّح
      الأعلى أولويّةً عند العودة.

  - id: region:secondary
    role: reader
    priority: 2
    statement: >-
      القارئ الأول والمرشّح الأول للكتابة إن سقط الكاتب: أولويّتُه أعلى، ولا يصير
      كاتباً إلا وقد قِيس تأخّرُه ضمن العهد.
    statePath: .state/regions/secondary

  - id: region:tertiary
    role: reader
    priority: 3
    statePath: .state/regions/tertiary
    statement: >-
      القارئ الثاني والمرشّح الثاني: يصير كاتباً إن سقط الكاتب وتعذّر المرشّح
      الأول أو كان تأخّرُه خارج العهد — فالأولويّة ترتيبٌ لا ضمانٌ.

# ── أحكام صحّة الإقليم: لكلٍّ رمزُ خروجٍ مفرَدٌ يقرؤه المسار الآليّ ──
#
# **والصمت ليس صحّةً:** إقليمٌ لم يقع عليه قياسٌ كافٍ يُحكَم عليه
# `health:unmeasured` لا `health:up`، ويُوجب التجاوز كما يوجبه السقوط. وحرسُ ذلك
# `G-REGION-NO-EMPTY-SUCCESS`.
health:
  - id: health:up
    exitCode: 0
    statement: >-
      الإقليم قائمٌ وقِيس تأخّرُه ضمن العهد المعلَن.

  - id: health:down
    exitCode: 72
    statement: >-
      الإقليم ساقطٌ أو تأخّرُه خارج العهد — والحكم بالفشل يخرج برمزٍ غير الصفر
      وإلا قرأه المسار الآليّ نجاحاً.

  - id: health:unmeasured
    exitCode: 73
    statement: >-
      لم يقع على الإقليم قياسٌ كافٍ — وصمتٌ يُقرأ نجاحاً أسوأ من عطبٍ يُقرأ عطباً.

# ── تجاوز الفشل: يقع من تلقائه، ولا كاتبَين أبداً ──
failover:
  automatic: true
  triggerOn:
    - health:down
    - health:unmeasured
  maxFailoverMs: 15000
  minHealthyRegions: 1
  statement: >-
    سقوط إقليم الكتابة يُنصِّب أعلى المرشّحين أولويّةً ممن حكمُه `health:up`
    وتأخّرُه ضمن العهد، **بلا إقرارٍ بشريّ وبلا سؤال**، وتُقاس مدّة التجاوز وتُكتب
    في الدفتر ويُحاسَب عليها السقف المعلَن. ولا يُنصَّب كاتبٌ والكاتبُ الأول لم
    يُحكَم عليه بالسقوط: كاتبان في وقتٍ واحدٍ يعني كتابتين لا تلتقيان أبداً، وهو
    أسوأ ما يقع في تعدّد الأقاليم. ومن لم يجد مرشّحاً صالحاً رُدَّ بالرمز
    `REGION_FAILOVER_CANDIDATE_MISSING` **ولم يُنصِّب مرشّحاً يُظَنّ صالحاً**.

# ── الأثر المقبول: سقفٌ معلَنٌ يُقاس عليه ──
#
# **ولا تُكتب هنا نافذةُ الفقد ثانيةً:** مصدرها `consistency.maxReplicationLagMs`
# وحده، ويرفض الحاجز أن يظهر لها رقمٌ في هذا القسم.
impact:
  maxUnavailableMs: 15000
  statement: >-
    «استمرار الخدمة» ليس انطباعاً: هو أن يُقاس زمنُ انقطاع الكتابة من لحظة سقوط
    الكاتب إلى لحظة قبول الكاتب الجديد كتابةً فعليّةً، فلا يتجاوز السقف المعلَن؛
    وأن تكون الكتابةُ المفقودةُ ضمن نافذة الفقد المشتقّة من عهد الاتساق. فمن قال
    «استمرّت» ولم يقس، قال ما لا يُحاسَب عليه.

# ── الدفتر والمؤشّر: من هو الكاتب مكتوبٌ لا محفوظٌ في رأس أحد ──
ledger:
  path: .state/regions/ledger.jsonl
  pointerPath: .state/regions/writer.json
  statement: >-
    الكاتب الحاليّ يُقرأ من مؤشّرٍ مكتوبٍ لا من ذاكرة إنسان، ووقائع النسخ والسقوط
    والتجاوز تُكتب في دفترٍ بإضافةٍ سطريّة يُقرأ منه ما وقع بعد أن يقع.

audit:
  events:
    - type: region.replicated
      statement: نُسِخت حالةُ الكاتب إلى قارئٍ، ومعها تأخّرُ النسخ المقيس.
    - type: region.dropped
      statement: أُسقط إقليمٌ في تمرينٍ معلَن، ومعه دورُه لحظةَ السقوط.
    - type: region.failover.performed
      statement: نُصِّب كاتبٌ جديدٌ من تلقاء النظام، ومعه مدّةُ التجاوز المقيسة.
    - type: region.failover.refused
      statement: رُدَّ التجاوز ولم يُنصَّب كاتبٌ، ومعه سببُ الردّ برمزه.
    - type: region.drill.completed
      statement: اكتمل تمرين الإسقاط، ومعه الأثر المقيس والحكم عليه.

# ── رموز الرفض: مُقابَلةٌ في الاتجاهين مع `REGION_ERRORS` ──
refusalCodes:
  - code: REGION_CONFIG_INVALID
    statement: عقد الأقاليم يخالف مخطَّطه أو ترابطه، فيُردّ عند التحميل لا في منتصف تجاوزٍ.
  - code: REGION_UNDECLARED
    statement: إقليمٌ لا إعلانَ له في العقد — ولا يُسقَط ولا يُنصَّب ما ليس معلَناً.
  - code: REGION_ROLE_INVALID
    statement: دورٌ غير «كاتب» ولا «قارئ»، أو دورٌ يُطلب منه ما ليس له.
  - code: REGION_WRITER_NOT_UNIQUE
    statement: كاتبان معلَنان أو منصَّبان — وهو الباب الذي جاءت الخطوة لتُغلقه.
  - code: REGION_WRITER_MISSING
    statement: لا كاتبَ في العقد ولا في المؤشّر — ودولةٌ بلا كاتبٍ دولةٌ لا تقبل كتابة.
  - code: REGION_PRIORITY_INVALID
    statement: أولويّتان متساويتان أو أولويّةٌ غير موجبة — وترتيبٌ ملتبسٌ ترتيبٌ يُقرَّر بالحظّ.
  - code: REGION_PATH_CONFLICT
    statement: جذرا حالةٍ متداخلان لإقليمين — وموضعٌ واحدٌ لإقليمين يُفسدهما معاً.
  - code: REGION_LAG_INVALID
    statement: تأخّرُ نسخٍ غير عددٍ منتهٍ غير سالب — ورقمٌ فاسدٌ لا يُقاس عليه عهد.
  - code: REGION_LAG_EXCEEDED
    statement: تأخّرُ القارئ تجاوز سقف العهد المعلَن، فلا يُقرأ منه ولا يُنصَّب كاتباً.
  - code: REGION_HEALTH_UNDECLARED
    statement: حكمُ صحّةٍ لا إعلانَ له في العقد — وحكمٌ بلا رمزِ خروجٍ حكمٌ لا يقرؤه مسار.
  - code: REGION_OBSERVATION_INVALID
    statement: مشاهدةُ صحّةٍ ناقصةُ الحقول أو فاسدةُ النوع.
  - code: REGION_OBSERVATION_MISSING
    statement: لم تقع مشاهدةٌ كافيةٌ على الإقليم — فحكمُه `health:unmeasured` لا `health:up`.
  - code: REGION_FAILOVER_DISABLED
    statement: التجاوز مُعطَّلٌ في العقد — وتجاوزٌ يحتاج إذناً ليس تجاوزاً بل إشعار.
  - code: REGION_FAILOVER_CANDIDATE_MISSING
    statement: لا مرشّحَ صالحاً لتنصيبه كاتباً، فلا يُنصَّب من يُظَنّ صالحاً.
  - code: REGION_FAILOVER_TIMEOUT_EXCEEDED
    statement: مدّةُ التجاوز المقيسة تجاوزت السقف المعلَن — والسقف يُقاس عليه لا يُزيَّن به.
  - code: REGION_IMPACT_EXCEEDED
    statement: الأثر المقيس تجاوز السقف المعلَن، فلا يُقال «استمرّت الخدمة».
  - code: REGION_QUORUM_LOST
    statement: لم يبقَ من الأقاليم قائماً ما يبلغ الحدّ الأدنى المعلَن.
  - code: REGION_CLOCK_INVALID
    statement: ساعةٌ لا تُصدر عدداً منتهياً — ومدّةٌ تُقاس بساعةٍ فاسدةٍ مدّةٌ مُختلَقة.

# ── الضمانات: لكلٍّ ملفُّ إنفاذٍ يُقاس حضورُ معرّفه فيه نصّاً ──
guarantees:
  - id: G-REGION-SINGLE-WRITER
    file: src/regions/failover.mjs
    statement: >-
      لا يُنصَّب كاتبٌ ثانٍ والكاتبُ الأول لم يُحكَم عليه بالسقوط، والخطّة تُردّ
      بالرمز `REGION_WRITER_NOT_UNIQUE` قبل أن تقع كتابةٌ واحدة.

  - id: G-REGION-SINGLE-SOURCE-BUDGET
    file: src/regions/contract.mjs
    statement: >-
      نافذة الفقد تُقرأ من `consistency.maxReplicationLagMs` وحدها، ولا رقمَ لها
      في قسم الأثر — فمن كتب العتبة مرّتين شدّد إحداهما ونسي الأخرى.

  - id: G-REGION-NO-EMPTY-SUCCESS
    file: src/regions/health.mjs
    statement: >-
      إقليمٌ بلا مشاهدةٍ كافيةٍ يُحكَم عليه `health:unmeasured` ويُوجب التجاوز،
      ولا يُقرأ صمتُه صحّةً.

  - id: G-REGION-PURE-JUDGEMENT
    file: src/regions/health.mjs
    statement: >-
      حكمُ الصحّة والتأخّر دالّةٌ نقيّةٌ لا تلمس قرصاً ولا عمليّةً ولا ساعةً، فلا
      تستطيع أن تُصلح ما تفحص.

  - id: G-REGION-FAILOVER-AUTOMATIC
    file: scripts/region-drill.mjs
    statement: >-
      التجاوز يقع من تلقائه عند أول حكمٍ موجبٍ له، بلا عَلَمٍ يُمرَّر ولا إقرارٍ
      بشريّ ولا مُدخلٍ على المدخل القياسيّ.

  - id: G-REGION-CANDIDATE-FROM-LEDGER
    file: src/regions/failover.mjs
    statement: >-
      المرشّح يُشتقّ من أولويّات العقد ومن تأخّرٍ مقيسٍ مقروءٍ، لا من وسيطٍ
      يُمرَّر ولا من ذاكرة منفِّذ.

  - id: G-REGION-IMPACT-MEASURED
    file: src/regions/impact.mjs
    statement: >-
      الأثر يُحسب من لحظاتٍ مقيسةٍ ويُحاسَب على السقف المعلَن، ولا يُقال «استمرّت
      الخدمة» إلا برقمٍ يُقرأ في الدفتر.

  - id: G-REGION-INJECTED-CLOCK
    file: scripts/lib/region-facts.mjs
    statement: >-
      الساعة تُحقَن ولا تُقرأ من داخل الوحدة، وساعةٌ لا تُصدر عدداً منتهياً تُردّ
      بالرمز `REGION_CLOCK_INVALID`.
