# نطاقُ قياسِ خطِّ أساسِ التخطّي — عقدُ الهويّةِ (‏`OPS-1` · `WL-246`).
#
# **فائضٌ بالاستثناءِ لا بالإذنِ:** كلُّ مسارٍ متعقَّبٍ **داخلٌ في النطاقِ** إلا ما
# استُثنيَ هنا نصّاً. فمجلَّدٌ جديدٌ أو ملفٌّ جديدٌ يَدخُلُ النطاقَ **تلقائيّاً**
# ولا يُفلِتُ صامتاً. وقائمةُ إذنٍ تَفعلُ عكسَ ذلك: تَرهَلُ فيَخرُجُ منها ملفٌّ
# بلا خطأٍ — وذاكَ عَطَبٌ قِيسَ لا خطرٌ مُتخيَّلٌ (‏`DOC-11` / `WL-200`).
#
# ── لماذا هذه الملفّاتُ السبعةُ بعينِها ──
#
# **الاستثناءُ هنا ليسَ تسهيلاً بل شرطُ عدمِ الدورانِ.** كلُّ دفعةٍ موثَّقةٍ في هذا
# المستودعِ تَمَسُّ **بالضرورةِ** — بحكمِ المادةِ ٦ ومعَ كلِّ مُدخلةٍ — هذه
# الملفّاتِ: `docs/roadmap/05-work-log.md` · `docs/roadmap/06-debt-register.md` ·
# `docs/READINESS_REPORT.md` · `PROJECT_STATUS.md`. وتَمَسُّ دفعةُ نشرِ الأثرِ نفسُها
# `docs/external-review/skip-baseline.json` (الأثرُ يَصِفُ نفسَهُ) ووثائقَ الخطّةِ
# (‏`R5` يُوجِبُ أن تُسمّيَ الوثيقةُ أوّلَ ثمانيةِ محارفَ من الكوميتِ، فكلُّ رَبطِ
# هويّةٍ جديدٍ يَمَسُّها).
#
# فلو دخلَ شيءٌ من ذلكَ في النطاقِ **لَأبطَلَ كلُّ أثرٍ نفسَهُ بمجرَّدِ نشرِهِ**،
# ولَأبطَلَتْهُ كلُّ مُدخلةِ سجلٍّ تالياً — جمودٌ تامٌّ هوَ عينُ ما أُغلِقَ بهِ
# `LIVE-16`. وقد قِيسَ هذا لا خُمِّنَ: باستثناءِ `docs/external-review/` وحدَهُ
# كانَ الفرقُ بينَ `eba5afcf` و`54cfec25` أربعةَ مساراتٍ ثلاثةٌ منها وثائقُ
# مُحاسَبةٍ (`05-work-log.md` · `06-debt-register.md` · `PROJECT_STATUS.md`).
#
# ── ولماذا ملفّاتٌ بأسمائِها لا `docs/` كلُّها (‏`OPS-1/SCOPE-BLIND` · `WL-265`) ──
#
# كانَ الاستثناءُ بادئةَ `docs/` كاملةً، **فكانَ أوسعَ من علّتِهِ**: العلّةُ ملفّاتُ
# المُحاسَبةِ التي تَمَسُّها كلُّ دفعةٍ، لا الوثائقُ كلُّها. وسبعةٌ وثلاثونَ ملفَّ
# اختبارٍ تَقرأُ `docs/`، فتغييرٌ في `docs/ROOT_OF_TRUST.md` مثلاً كانَ يُقلِّبُ
# نتيجةَ اختبارٍ بلا أن تَتحرَّكَ البصمةُ.
#
# **والقائمةُ مقيسةٌ لا مُخمَّنةٌ:** طلباتُ الدمجِ `#150`…`#157` (خمسُ دفعاتٍ
# موثَّقةٍ وثلاثُ دفعاتِ نشرٍ) لم تَمَسَّ من `docs/` غيرَ هذه السبعةِ إلا
# `docs/RUNNER_PROVISIONING.md` — وهيَ وثيقةٌ لا سجلٌّ، فدخلَت النطاقَ.
# وكلُّ ما سواها في `docs/` **داخلٌ في النطاقِ**، ومنهُ كلُّ ملفٍّ جديدٍ يُضافُ.
#
# **والمطابقةُ هنا تامّةٌ لا بادئةٌ:** مُدخلةٌ لا تَنتهي بـ`/` تُطابِقُ مساراً بعينِهِ
# فقط، فـ`PROJECT_STATUS.md.bak` داخلٌ في النطاقِ. ولا يُقبَلُ في هذا الإعلانِ
# مجلَّدٌ، ولا مُدخلةٌ لا تُسمّي ملفّاً متعقَّباً (‏استثناءٌ ميّتٌ يَستُرُ بقعةً إن
# أُعيدَت تسميةُ الملفِّ) — ويَحرُسُ الأمرَينِ اختبارٌ على المستودَعِ نفسِهِ.
#
# ── وحدُّ هذا الاستثناءِ مُعلَنٌ لا مستورٌ ──
#
# الاختباراتُ تَقرأُ هذه الملفّاتِ السبعةَ نفسَها (‏قواعدُ `R3`·`R4`·`R5` من
# `guard:skip-baseline` و`guard:doc-counts` و`guard:status-freshness` و
# `guard:readiness`)، فتغييرٌ فيها قد يُقلِّبُ نتيجةَ اختبارِ حاجزٍ بلا أن تَبلى
# البصمةُ. **وهوَ بَلىً مكشوفٌ لا صامتٌ:** تلكَ الحواجزُ تَسقُطُ بانحرافِها مباشرةً
# بأسمائِها. ولا يُمكِنُ إدخالُها النطاقَ بلا دورانٍ، فالبقعةُ **ضُيِّقَت إلى سبعةِ
# ملفّاتٍ مُسمّاةٍ** لا أُزيلَت.
#
# ── ولماذا لم يُستثنَ `.github/` ──
#
# التصميمُ المُقَرُّ عَدَّهُ خارجَ النطاقِ لأنَّ تعريفَ سيرِ عملٍ لا يُنفِّذُهُ
# `npm test`. **والقياسُ رَدَّ ذلك:** `tests/tooling/ci-gates.test.mjs` يَقرأُ
# `.github/` فعلاً، فاستثناؤهُ بقعةٌ عمياءُ **قابلةٌ للإثباتِ**. فأُبقيَ في
# النطاقِ — وكلفتُهُ إعادةُ قياسٍ عندَ تعديلِ سيرِ عملٍ، وهيَ نادرةٌ.
#
# ── ولا يُوسَّعُ هذا الاستثناءُ بغيرِ قرارِ مالكٍ ──
#
# كلُّ مسارٍ يُضافُ هنا يُنشئُ بقعةً عمياءَ جديدةً في عقدِ الهويّةِ، ويَحرُسُ
# ذلكَ اختبارُ الطفرةِ في `tests/external-review/skip-baseline-scope.test.mjs`.

version: 2

# ── تضييقُ النطاقِ (‏`OPS-1/R7-COST` · `WL-270` · قرارُ مالكٍ) ──
#
# كانَ النطاقُ فائضاً: كلُّ مسارٍ داخلٌ إلا ملفّاتِ المُحاسَبةِ السبعة. فأيُّ
# دفعةٍ تَلمَسُ `src/` أو `scripts/` أو `.github/` تُبدِّلُ البصمةَ فتُحمَرُّ `main`
# حتى تُعادَ تشغيلةُ القياسِ. فقرَرَ المالكُ تضييقَ النطاقِ إلى `tests/` والمُعلَناتِ.
#
# **وكلُّ تضييقٍ بقعةٌ عمياءُ مُسماّةٌ لا صامتةٌ:** كلُّ دليلٍ يُضافُ هنا يُخرِجُ
# ما تحته من البصمةِ، ويُقيَّدُ بعلّتِهِ. والبقعةُ العمياءُ ليست عيباً ما دامت
# مُعلَنةً ومسؤولةً عنها بأثرٍ آخر يَكشِفُها (‏`tsc` · `eslint` · `npm test`).
#
# الأدلةُ المُستثناةُ بعللِها:
#   - `src/` — الكودُ المصدريُّ: يُكشَفُ بـ`tsc --noEmit` و`eslint .` و`npm test`.
#   - `scripts/` — سكربتاتُ الحواجزِ: يَقرأُها `npm test` فيُكشِفُ انحرافَها.
#   - `.github/` — مساراتُ CI: يَقرؤُها `tests/tooling/ci-gates.test.mjs`.
#   - `civilization/` — قوالبُ دولتِيّةٌ: لا تُقاسُ بـ`npm test` ولا تُقرأُ منه.
#   - `migrations/` — هجراتُ قاعدةِ بياناتٍ: لا تُقاسُ بـ`npm test`.
#   - `federation/` · `institutions/` · `knowledge/` · `sim/` — قوالبُ وبياناتٌ سياديّةٌ.
#   - بقيةُ الأدلةِ الفرعيّةِ (`clients/` · `constitution/` · `contracts/` ·
#     `data-platform/` · `engines/` · `infrastructure/` · `interfaces/` ·
#     `operations/` · `seed/` · `web/`) — قوالبٌ لا تُقاسُ.
#
# **ولا يُوسَّعُ هذا الاستثناءُ بغيرِ قرارِ مالكٍ** — ويَحرُسُهُ اختبارُ الطفرةِ
# في `tests/external-review/skip-baseline-scope.test.mjs`.
#
# ── ما بَقِيَ داخلَ النطاقِ ──
#
#   - `tests/` — ملفّاتُ الاختبارِ: هي ما يُقاسُ بصمَّته.
#   - `config/` — مُعلَناتُ العقودِ والهويّةِ: ما يَقرؤُهُ `guard:skip-baseline` وحدَه.
#   - `docs/` — ما عدا ملفّاتِ المُحاسَبةِ السبعةِ (‏الاستثناءُ الأصليُّ في الأسفلِ).
#   - ملفّاتُ الجذرِ المُعلَنةُ (`GOVERNANCE_RULE.md` · `package.json` · `tsconfig.json`
#     · `version.json` · `eslint.config.js` · `.prettierrc` · `.nvmrc` · `CODEOWNERS`).

