# عقدُ اختباراتِ الفوضى — الخطوة `M10.09`
#
# هذه الوثيقةُ **مصدرُ الحقيقةِ الوحيدُ** لتجاربِ الفوضى: أيَّ عطبٍ نُحقِن،
# وبأيِّ **رقمٍ**، وما **الفرضيّةُ** التي ندّعي صمودَها، وبأيِّ **رمزِ انحرافٍ**
# يُقيَّد إخلافُها، وما الأحكامُ ورموزُ خروجِها، وأينَ يُقيَّد الانحرافُ
# ومتى يُعَدُّ مُغلَقاً.
#
# **والفرقُ بينها وبين عقدِ التعافي (`M10.08`) فرقٌ في السؤال لا في الأسلوب:**
# التعافي يسأل «هل تعود الدولةُ بعد أن يذهب كلُّ شيءٍ؟» فيقيس **العودةَ**؛
# والفوضى تسأل «ماذا تفعل الدولةُ **أثناءَ** وقوعِ العطبِ؟» فتقيس **الصمودَ**
# بعطبٍ يُحقَن حقيقةً في عمليّةٍ وقرصٍ وساعةٍ ودفترٍ، لا بمُحاكاةٍ تُستدعى.
#
# **وقاعدةُ القبولِ الحاكمةُ:** انحرافٌ ظهر في تجربةٍ **يُقيَّد** في دفترِ
# الانحرافاتِ أدناه ويُربَط بمُدخلةِ عملٍ **تُغلِقه بإصلاحِ سببِه الجذريِّ**؛
# وانحرافٌ غيرُ مُغلَقٍ يُوجب حكمَ رفضٍ برمزِ خروجٍ موجبٍ — فلا يُخضَّر مسارٌ
# باكتشافٍ مؤجَّل.
#
# ويُحرَس محتواها بالبوابةِ `npm run guard:chaos` (البوابة الثانية والأربعون)
# وبالمخطَّطِ `config/schemas/chaos.schema.json` بـ`additionalProperties: false`
# في كلِّ عقدة.

version: '1.0.0'

# ══════════════════════════════════════════════════════════════════════════
# ١ — التجاربُ الخمسُ: عطبٌ برقمٍ، وفرضيّةٌ مكتوبةٌ، ورمزُ انحرافٍ
# ══════════════════════════════════════════════════════════════════════════
# لكلِّ تجربةٍ **معرَّفٌ مُفرَدٌ**، و`fault` بوصفٍ **رقميٍّ** لا وصفاً بليغاً
# (فـ«تأخّرٌ ملحوظٌ» لا يُقاس، و`300` ملّي ثانيةٍ تُقاس)، و`hypothesis` تقول
# **ما ندّعي بقاءَه صادقاً** أثناءَ العطبِ، و`deviationCode` يُقيَّد به إخلافُها.
experiments:
  - id: chaos:node-drop
    order: 1
    fault:
      kind: process-kill
      magnitude: 9
      unit: signal
      description: >-
        قتلُ عمليّةٍ ابنٍ حقيقيّةٍ بإشارةِ `SIGKILL` (‏9) بعد أن تكتب سطورَها
        في دفترِ الأقاليمِ وتُثبِّت مؤشِّرَ كاتبِها — قتلاً لا مهلةَ إنهاءٍ فيه
        ولا خاتمةَ خروجٍ تُنفَّذ.
    target: .state/chaos/node-drop
    hypothesis: >-
      إسقاطُ العقدةِ إسقاطاً قاسياً لا يُفقِد سطراً مكتوباً ولا يُخلِّف دفتراً
      لا يُقرأ: تُقرأ كلُّ السطورِ المُثبَتةِ قبل القتلِ بعددِها، ويكون مؤشِّرُ
      الكاتبِ إمّا غائباً وإمّا `JSON` صالحاً يُقرأ.
    deviationCode: DEV-CHAOS-NODE-DROP

  - id: chaos:network-delay
    order: 2
    fault:
      kind: latency
      magnitude: 300
      unit: milliseconds
      description: >-
        تأخيرٌ حقيقيٌّ مقيسٌ على ساعةِ جهازٍ في جامعِ الوقائعِ قدرُه 300 ملّي
        ثانيةٍ بين نسخِ الحالةِ إلى الأقاليمِ وبين مشاهدتِها.
    target: .state/chaos/network-delay
    hypothesis: >-
      التأخّرُ الحقيقيُّ **يُرى رقماً** في مشاهدةِ الإقليمِ لا يقلُّ عن العطبِ
      المُحقَنِ، ويبقى الحكمُ `health:up` لأنّ 300 دونَ نافذةِ الفقدِ المعلَنةِ
      في عقدِ الأقاليمِ — فمراقبةٌ تقرأ صفراً تحت تأخّرٍ واقعٍ مراقبةٌ تكذب.
    deviationCode: DEV-CHAOS-NETWORK-DELAY

  - id: chaos:disk-full
    order: 3
    fault:
      kind: disk-exhaustion
      magnitude: 0
      unit: bytes-free
      description: >-
        توجيهُ مسارِ الدفترِ إلى جهازٍ لا يقبل بايتاً واحداً (`/dev/full`)
        فتُردُّ الكتابةُ بـ`ENOSPC` من النواةِ لا من مُحاكاةٍ في الاختبار.
    target: .state/chaos/disk-full
    hypothesis: >-
      كتابةٌ إلى قرصٍ ممتلئٍ **تُرمى خطأً** ولا تُقرأ نجاحاً صامتاً، ولا تُخلِّف
      في الدفترِ سطراً نصفَ مكتوبٍ: يبقى الدفترُ بعدها بعددِ سطورِه المُثبَتةِ
      مقروءاً سطراً سطراً؛ ودفترٌ صار ملفَّ جهازٍ لا ملفَّ نصٍّ **يُرَدُّ برمزٍ
      معلَنٍ** ولا يستهلك الذاكرةَ حتى تُقتل العمليّة.
    deviationCode: DEV-CHAOS-DISK-FULL

  - id: chaos:message-poison
    order: 4
    fault:
      kind: corrupt-record
      magnitude: 1
      unit: lines
      description: >-
        دسُّ سطرٍ واحدٍ مقطوعٍ لا يُحلَّل `JSON` في دفترِ أقاليمَ حقيقيٍّ بعد
        سطورٍ صحيحةٍ سبقته.
    target: .state/chaos/message-poison
    hypothesis: >-
      قارئُ الدفترِ **يرفض بالاسمِ**: يرمي خطأً برمزِ رفضٍ معلَنٍ يذكر الملفَّ،
      ولا يتخطّى السطرَ الفاسدَ صامتاً ولا يمرِّره حكماً — فتخطّي سطرٍ لا يُقرأ
      يُنتِج حالةً «صحيحةً» ناقصةً وهي أخطرُ من التوقّف.
    deviationCode: DEV-CHAOS-MESSAGE-POISON

  - id: chaos:clock-skew
    order: 5
    fault:
      kind: clock-reversal
      magnitude: 2592000000
      unit: milliseconds
      description: >-
        سجلُّ آخرِ تجربةِ تعافٍ يُكتب حقيقةً على القرصِ بتاريخٍ يسبق الآنَ
        بثلاثين يوماً في المستقبلِ — أي ساعةٌ رجعت إلى الوراءِ 2592000000 ملّي
        ثانية.
    target: .state/chaos/clock-skew
    hypothesis: >-
      ساعةٌ رجعت إلى الوراءِ **لا تُنتِج امتثالاً صامتاً**: سجلٌّ تاريخُه في
      المستقبلِ يُرَدُّ برمزٍ معلَنٍ، ولا يُقرأ «العهدُ قائمٌ» بمدّةٍ سالبةٍ
      مضت — فامتثالٌ مصدرُه ساعةٌ فاسدةٌ ادّعاءٌ لا دليل.
    deviationCode: DEV-CHAOS-CLOCK-SKEW

# ══════════════════════════════════════════════════════════════════════════
# ٢ — الأحكامُ ورموزُ خروجِها
# ══════════════════════════════════════════════════════════════════════════
# لكلِّ حكمٍ رمزُ خروجٍ **مُفرَدٌ**، و**لا يخرج صفراً إلا الصمودُ وحدَه**.
verdicts:
  - id: chaos:resilient
    exitCode: 0
    meaning: >-
      التجاربُ المعلَنةُ كلُّها جرت فعلاً، وفرضيّةُ كلِّ تجربةٍ صمدت بقياسٍ
      مقروءٍ، ولا انحرافَ مفتوحاً في الدفتر.
  - id: chaos:deviated
    exitCode: 76
    meaning: >-
      فرضيّةٌ أُخلِفت، أو انحرافٌ مُقيَّدٌ بلا مُدخلةِ عملٍ تُغلِقه — والانحرافُ
      المفتوحُ رفضٌ لا ملاحظةٌ تُقرأ وتُنسى.
  - id: chaos:unmeasured
    exitCode: 77
    meaning: >-
      لم يقع قياسٌ صالحٌ: تجربةٌ معلَنةٌ لم تُنفَّذ، أو أداةُ حقنِ العطبِ غيرُ
      متاحةٍ في هذه البيئةِ، أو ساعةٌ لا تُصدر عدداً منتهياً — ولا يُقرأ هذا
      الصمتُ صموداً.

# ══════════════════════════════════════════════════════════════════════════
# ٣ — دفترُ الانحرافاتِ: كلُّ انحرافٍ مربوطٌ بمُدخلةِ عملٍ تُغلِقه
# ══════════════════════════════════════════════════════════════════════════
# **هذا القسمُ سجلُّ اكتشافٍ لا قائمةُ نوايا:** كلُّ مُدخلةٍ فيه انحرافٌ ظهر
# في تشغيلٍ حقيقيٍّ، ورمزُها حاضرٌ **نصّاً** في ملفِّ إصلاحِه، و`closedBy`
# مُدخلةُ عملٍ موجودةٌ في `docs/roadmap/05-work-log.md` تشرح الإصلاحَ. ومُدخلةٌ
# ينقصها أحدُ هذه يرفضها الحاجزُ.
deviations:
  - code: DEV-CHAOS-DISK-FULL
    experiment: chaos:disk-full
    finding: >-
      حقنُ امتلاءِ القرصِ في مسارِ دفترِ الأقاليمِ كشف عطبَين: كتابةُ الدفترِ
      تُردُّ بخطأِ نظامٍ خامٍ (`ENOSPC`) — وهو مقبولٌ لأنّه يُرمى ولا يُقرأ
      نجاحاً — أمّا **قراءةُ** دفترٍ صار ملفَّ جهازٍ لا نهايةَ له فكانت تستنزف
      الذاكرةَ حتى تُقتل العمليّةُ بـ`std::bad_alloc` بلا رمزِ رفضٍ ولا رسالة.
    fixedIn: scripts/lib/region-facts.mjs
    marker: REGION_CONFIG_INVALID
    closedBy: WL-062
  - code: DEV-CHAOS-CLOCK-SKEW
    experiment: chaos:clock-skew
    finding: >-
      حقنُ رجوعِ الساعةِ كشف أنّ حسابَ فواتِ تجربةِ التعافي كان يقبل سجلًّا
      تاريخُه في المستقبلِ فيُنتِج مدّةً سالبةً مضت وحكماً `overdue: false`
      وعبارةَ «والعهدُ قائم» — أي أنّ ساعةً فاسدةً كانت تكفي لإظهارِ امتثالٍ
      لدوريّةٍ لم تجرِ.
    fixedIn: src/recovery/schedule.mjs
    marker: RECOVERY_LEDGER_INVALID
    closedBy: WL-062

# ══════════════════════════════════════════════════════════════════════════
# ٤ — جذرُ التجاربِ ودفترُها
# ══════════════════════════════════════════════════════════════════════════
# **نصفُ قطرِ الانفجارِ معلَنٌ**: لا تُلمَس حالةٌ خارجَ `.state/chaos` البتّةَ،
# ولا تُقتل عمليّةٌ لم يُنشئها المنفِّذُ نفسُه — الضمان
# `G-CHAOS-SCOPED-BLAST-RADIUS`.
source:
  root: .state/chaos
ledger:
  path: .state/chaos/ledger.jsonl

# ══════════════════════════════════════════════════════════════════════════
# ٥ — أحداثُ التدقيق
# ══════════════════════════════════════════════════════════════════════════
events:
  - chaos.experiment.started
  - chaos.fault.injected
  - chaos.hypothesis.upheld
  - chaos.deviation.recorded
  - chaos.drill.completed
  - chaos.drill.refused

# ══════════════════════════════════════════════════════════════════════════
# ٦ — رموزُ الرفض
# ══════════════════════════════════════════════════════════════════════════
# متقابلةٌ في الاتجاهين مع `CHAOS_ERRORS` في `src/chaos/errors.mjs`: لا رمزَ
# هنا بلا نظيرٍ هناك، ولا رمزَ هناك بلا نظيرٍ هنا.
refusalCodes:
  - code: CHAOS_CONFIG_INVALID
    when: العقدُ لا يوافق مخطَّطَه أو ينقصه قسمٌ لازم.
  - code: CHAOS_EXPERIMENT_UNDECLARED
    when: تجربةٌ تُنفَّذ أو تُحكَم ولا إعلانَ لها في العقد.
  - code: CHAOS_EXPERIMENT_DUPLICATE
    when: معرَّفُ تجربةٍ مكرَّرٌ أو رمزُ انحرافٍ مكرَّرٌ بين تجربتَين.
  - code: CHAOS_ORDER_INVALID
    when: ترتيبُ التجاربِ ليس متتالياً من واحدٍ بلا فجوةٍ ولا تكرار.
  - code: CHAOS_FAULT_INVALID
    when: وصفُ العطبِ بلا رقمٍ أو بوحدةٍ غيرِ معلَنةٍ أو بنوعٍ غيرِ مُنفَّذ.
  - code: CHAOS_HYPOTHESIS_MISSING
    when: تجربةٌ بلا فرضيّةٍ مكتوبةٍ — وتجربةٌ بلا فرضيّةٍ عرضٌ لا قياس.
  - code: CHAOS_DEVIATION_UNDECLARED
    when: انحرافٌ برمزٍ لا إعلانَ له في العقدِ ولا في تجربتِه.
  - code: CHAOS_DEVIATION_UNCLOSED
    when: انحرافٌ مُقيَّدٌ بلا مُدخلةِ عملٍ تُغلِقه — والمفتوحُ يُوجب رفضاً.
  - code: CHAOS_DEVIATION_UNLINKED
    when: مُدخلةُ انحرافٍ لا تُشير إلى ملفِّ إصلاحٍ قائمٍ يحمل رمزَها نصّاً.
  - code: CHAOS_VERDICT_UNDECLARED
    when: حُكِم بحكمٍ لا إعلانَ له في العقد.
  - code: CHAOS_EXIT_CODE_CONFLICT
    when: رمزُ خروجٍ مكرَّرٌ بين حكمَين أو صفرٌ لحكمٍ غيرِ الصمود.
  - code: CHAOS_RESULT_MISSING
    when: تجربةٌ معلَنةٌ بلا نتيجةٍ في التشغيل — وغيابُ القياسِ ليس صموداً.
  - code: CHAOS_RESULT_INVALID
    when: نتيجةُ تجربةٍ ليست كائناً بحقولِها المعلَنةِ أو تحمل معرَّفاً غريباً.
  - code: CHAOS_LEDGER_INVALID
    when: سطرٌ في دفترِ الفوضى لا يُقرأ أو الدفترُ ليس ملفَّ نصٍّ عاديّاً.
  - code: CHAOS_LEDGER_UNWRITABLE
    when: تعذّرت الإضافةُ السطريّةُ إلى الدفترِ لامتلاءِ القرصِ أو لمنعِ الكتابة.
  - code: CHAOS_INJECTION_UNAVAILABLE
    when: أداةُ حقنِ العطبِ غيرُ متاحةٍ في هذه البيئةِ فالتجربةُ غيرُ مقيسة.
  - code: CHAOS_BLAST_RADIUS_ESCAPE
    when: مسارٌ مطلوبٌ للحقنِ يقع خارجَ جذرِ التجاربِ المعلَن.
  - code: CHAOS_CLOCK_INVALID
    when: الساعةُ المُمرَّرةُ لا تُصدر عدداً صحيحاً منتهياً.

# ══════════════════════════════════════════════════════════════════════════
# ٧ — الضمانات
# ══════════════════════════════════════════════════════════════════════════
# رمزُ كلِّ ضمانٍ **حاضرٌ نصّاً** في ملفِّ إنفاذِه، ويُثبت الحاجزُ حضورَه.
guarantees:
  - id: G-CHAOS-REAL-FAULTS
    statement: >-
      العطبُ يُحقَن حقيقةً في عمليّةٍ وقرصٍ ودفترٍ وساعةٍ — قتلُ عمليّةٍ ابنٍ
      بإشارةٍ، وتأخّرٌ مقيسٌ على ساعةٍ، وجهازٌ يردُّ الكتابةَ، وسطرٌ فاسدٌ
      مكتوبٌ — ولا تُحاكى الفوضى بعلَمٍ يُمرَّر.
    enforcedIn: scripts/lib/chaos-facts.mjs
  - id: G-CHAOS-PURE-JUDGEMENT
    statement: >-
      وحداتُ الحكمِ لا تلمس قرصاً ولا تُشغِّل عمليّةً ولا تقرأ ساعةَ جهازٍ،
      فالحكمُ الذي يملك حقنَ العطبِ يستطيع أن يُلطِّفه ثم يُثني على صمودِه.
    enforcedIn: src/chaos/judgement.mjs
  - id: G-CHAOS-INJECTED-CLOCK
    statement: >-
      كلُّ زمنٍ يُكتب في الدفترِ أو يُحسب به قياسٌ يصل مُعامِلاً ويُرَدُّ إن لم
      يكن عدداً صحيحاً منتهياً، واللمسُ كلُّه محصورٌ في جامعِ الوقائع.
    enforcedIn: scripts/lib/chaos-facts.mjs
  - id: G-CHAOS-DEVIATION-CLOSED
    statement: >-
      كلُّ انحرافٍ مُقيَّدٌ مربوطٌ بمُدخلةِ عملٍ تُغلِقه بإصلاحِ سببِه، وانحرافٌ
      مفتوحٌ يُوجب حكمَ رفضٍ برمزِ خروجٍ موجبٍ.
    enforcedIn: src/chaos/deviation.mjs
  - id: G-CHAOS-ONLY-RESILIENCE-EXITS-ZERO
    statement: >-
      لكلِّ حكمٍ رمزُ خروجٍ مُفرَدٌ، ولا يخرج صفراً إلا الصمودُ وحدَه، فحكمٌ
      بالانحرافِ يخرج صفراً حكمٌ لا يقرؤه مسارٌ آليّ.
    enforcedIn: src/chaos/contract.mjs
  - id: G-CHAOS-LEDGER-APPEND-ONLY
    statement: >-
      وقائعُ التجاربِ تُكتب إضافةً سطريّةً إلى الدفترِ ولا يُعدَّل سطرٌ سابقٌ
      ولا يُحذَف، فدليلُ فوضى يُعاد كتابتُه ليس دليلاً.
    enforcedIn: scripts/lib/chaos-facts.mjs
  - id: G-CHAOS-SCOPED-BLAST-RADIUS
    statement: >-
      لا يُلمَس مسارٌ خارجَ جذرِ التجاربِ المعلَنِ ولا تُقتل عمليّةٌ لم يُنشئها
      المنفِّذُ نفسُه، فتجربةُ فوضى بلا نصفِ قطرٍ معلَنٍ عطبٌ لا تجربة.
    enforcedIn: scripts/lib/chaos-facts.mjs
  - id: G-CHAOS-NO-SKIP-FLAG
    statement: >-
      لا عَلَمَ تخطٍّ ولا إسكاتٍ ولا إنجاحٍ قسريٍّ في منفِّذِ التجاربِ أصلاً،
      فتجربةٌ يمكن إسكاتُها ستُسكَت في أوّلِ يومٍ ضيّق.
    enforcedIn: scripts/chaos-drill.mjs
