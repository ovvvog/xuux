# سياسة ذاكرة الوكلاء — الخطوة M7.05.
#
# العيوب التي أغلقتها هذه السياسة، بنصّها كما كانت في الكود قبلها:
#
#  1. **الحصّة كانت عالميةً لا لكل وكيل:** `remember` كان يفحص
#     `repository.count()` بلا مرشِّح ضدّ `maxEntries` واحد لكل المخزن. فوكيلٌ
#     واحد يملأ المخزن ويمنع كل الوكلاء من التذكّر — تجويعٌ يعبر حدّ الوكيل،
#     وهو تسريبُ أثرٍ بينهم من جهة الحجب لا من جهة القراءة.
#  2. **الانتهاء كان معلَناً ولا يُكتب:** العمود `state.memories.expires_at`
#     موجود منذ الترحيل الأول، وسياسةُ الاحتفاظ تقول `endsBy: expires_at`،
#     و`remember` **لم يضبطه أبداً**. فكل ذاكرةٍ أبدية، ودورةُ المحو تمرّ على
#     صفر صفوف وتقول «نجحت».
#  3. **الملكية كانت وسيطاً يُمرَّره المنادي:** `remember(agentId, …)` يكتب
#     باسم أي وكيل، فوكيلٌ يزرع ذاكرةً في وعاء غيره؛ و`forget(agentId, id)`
#     يحذف ذاكرة أي وكيلٍ يُعرَف معرّفه، بلا فاعل ولا بوابة ولا قيد نسب.
#     وهو بعينه نمطُ «الادّعاء في الطلب» الذي أُغلق في M7.01 وM7.02 وM7.04.
#  4. **لا مسار تصفّحٍ محكوم:** لم يكن في المخزن `list`، فمن أراد التصفّح ذهب
#     إلى مستودع الذاكرة مباشرةً — و`agentId` مرشِّحٌ مسموح فيه — فصار العزل
#     رهنَ أدب المنادي.
version: 1
owner: crown

# الحصص لكل وكيل لا للمخزن: الحدّ العالمي يبقى سقفاً أخيراً، لكنه لا يحمي
# وكيلاً من وكيل. والقياس على **بايتات المخزون** (الغلاف المشفَّر) لا على المادة
# المفكوكة، لأن المخزون هو ما يُستهلك فعلاً وهو ما يمكن قياسه في القاعدة أيضاً.
# **وحدُّ مفروضٌ في الكود لا في القاعدة:** الحصص وحدُّ حجم المدخل يفحصها
# `src/data/memory-limits.mjs` قبل كل كتابة؛ سببُ عدم فرضها في القاعدة مكتوبٌ في
# `migrations/0008_memory_limits.up.sql` ومسجَّل في `docs/REMAINING_WORK.md`.
quotas:
  perAgentEntries: 512
  perAgentStoredBytes: 4194304
  maxEntryBytes: 65536
  globalEntries: 100000

# الانتهاء إلزامي: ذاكرةٌ بلا تاريخ انتهاء ذاكرةٌ أبدية، والأبديّة تناقض
# الاحتفاظ. والاستثناءُ الوحيد الحفظُ القانوني، وقيدُ القاعدة يفرض التلازم.
expiry:
  required: true
  defaultDays:
    episodic: 30
    semantic: 365
    procedural: 365
  maxDays: 730
  # ذاكرةٌ انتهت مدّتها لا تُعاد ولو بقي صفّها إلى أن يمرّ المطهِّر: المحو
  # المؤجَّل لا يُبيح قراءةً في الفجوة بينه وبين الانتهاء.
  refuseRecallAfterExpiry: true
  # المطهِّر فعلُ تشغيلٍ لا فعلُ وكيل: وكيلٌ يطهّر يمحو أثره بنفسه.
  sweeperRoles:
    - role:operator
    - role:king

isolation:
  # المالك يُشتقّ من الفاعل ولا يُمرَّر: هذا هو إغلاق العيب الثالث أعلاه.
  ownerFromActor: true
  ownerRole: role:agent
  # وكيلٌ يريد ذاكرة غيره لا يعبر بدورٍ أعلى ينتحله: العبور لغير الوكلاء
  # يمرّ بقرار بوابة الوصول على عقد بيانات المدخل، لا بحقٍّ ذاتي.
  crossAgentNeedsGate: true
  # لا مساحة ذاكرةٍ مشتركة: كل مدخلٍ مملوكٌ لوكيل واحد. «المشترك» يُنشأ أصلَ
  # بياناتٍ مفهرساً بتصنيفه لا مدخلَ ذاكرةٍ بلا مالك.
  refuseSharedNamespace: true

# محاولةُ عبورٍ واحدة قد تكون معرّفاً خاطئاً؛ وتكرارُها من نفس الفاعل قصدٌ.
anomaly:
  crossAgentAttemptsBeforeSignal: 3
  signalKind: memory-isolation-breach

store:
  table: state.memories
  dbConstraints:
    - memories_expiry_required
    - memories_hold_has_no_expiry
    - memories_expiry_after_creation

# كل مسارٍ معلَن هنا **يجب** أن يقيس الملكية على الفاعل؛ يفحصه
# `scripts/guard-memory.mjs` على النصّ لا على النية.
guardedPaths:
  - module: src/data/memory-store.mjs
    methods:
      - remember
      - recall
      - list
      - forget

# الوحدات التي يجوز لها لمس مستودع الذاكرة أو سجل الذاكرة في التركيب. أي وحدةٍ
# أخرى في `src/` تلمسه فهي مسار جانبي يتجاوز العزل، والحاجز يفشل عليها.
repositoryHolders:
  - src/data/memory-store.mjs
  - src/persistence/composition.mjs
  - src/persistence/unit-of-work.mjs
