  # قدراتٌ لا يُمثّلُها كتالوجُ الصلاحيات (أوامرُ بلا صلاحية): كلٌّ بالحقولِ الثلاثةَ عشرَ في §4.3.
  # الحقولُ: persistent · rollback · after_lease · after_seal · readable · fence_check · privilege_block · deeper · proof
  privilege_free:
    - id: CAP-ALTER-ROLE-SELF
      name: ALTER ROLE <self> PASSWORD / SET / RESET
      source: كلُّ دورٍ يغيّرُ كلمتَه وإعداداتِه دون صلاحية (‏لا مُطلِقَ أحداثٍ لأوامرِ الكائناتِ العامّة)
      class: EFFECT_DISABLED
      persistent: نعم — pg_authid / pg_db_role_setting (‏عنقوديّ)
      rollback: نعم
      after_lease: مقبولٌ من PG — كتابةٌ دائمةٌ بإيجارٍ منقضٍ (‏مقيسٌ في WL-538 وWL-539)
      after_seal: مقبول؛ لكنّ كلمةَ المرورِ VALID UNTIL '-infinity' لا تُدخِلُ أحداً (‏28P01)، والإعدادُ يجعلُ كتابةَ العاملِ وقراءتَه XF013
      readable: الإعدادُ تقرؤه جلساتٌ لاحقةٌ للدور — ولا جلسةَ لاحقةً بعدَ الإلغاء
      fence_check: worker_role_settings في check_fenced (‏RESUME XF415)، والمحورُ role_setting في المدقّق (‏غيرُ مصنَّفٍ عمداً)
      privilege_block: لا — الحاجزُ XF013 والمحوُ عندَ الختمِ والإلغاءِ والإيقاف
      deeper: لا للأثرِ داخلَ السياج؛ الكتابةُ نفسُها لا تُمنَعُ دونَ امتدادٍ في الخادم (‏ممنوعٌ الآن، §5)
      proof: tests/fence/db-fence.test.mjs (WL-538 + WL-539)
    - id: CAP-NOTIFY
      name: NOTIFY / pg_notify
      source: PUBLIC (بلا صلاحية في PG)
      class: RESIDUAL
      persistent: لا تُكتَبُ في الجداول؛ تصلُ إلى مستمعينَ آخرين عند الالتزام
      rollback: نعم (تُرسَلُ عند COMMIT فقط)
      after_lease: مسموحة — لا يعرفُ الحارسُ الإيجار
      after_seal: الجلسةُ مقتولة؛ ما أُرسِلَ قبلَ الختمِ وصل
      readable: نعم — أيُّ LISTEN على القناة
      fence_check: لا
      privilege_block: لا (لا صلاحيةَ لـNOTIFY في PG)
      deeper: نعم — المستمعُ يجبُ أن يرفضَ ما لا يحملُ رمزَ السياج (E15) أو حاجزٌ في الخادم
      proof: probe ديناميكي (WL-539) + E3
    - id: CAP-XID
      name: استهلاكُ معرّفاتِ المعاملات (txid_current، أيُّ كتابةٍ تُبطَلُ)
      source: ضمنيّ
      class: SESSION_TRANSIENT
      persistent: يتقدّمُ عدّادُ xid (لا محتوى)
      rollback: لا — العدّادُ لا يتراجع
      after_lease: مسموح
      after_seal: الجلسةُ مقتولة
      readable: رقمٌ فقط
