# حزمةُ المراجعةِ الخارجيّةِ المستقلّةِ — مُدخلاتٌ لا نتائجُ
#
# هذا الملفُّ يُصرِّح **نطاقَ** المراجعاتِ المستقلّةِ ومعاييرَ قبولِها وأدلّتَها
# ومُخرَجاتِها المطلوبةَ — **ولا يحملُ نتيجةَ مراجعةٍ واحدةً**. المادة 8 صريحةٌ:
# لا يُعتبَرُ المُنفِّذُ مراجعاً مستقلّاً، ولا يُوضَعُ حكمٌ نيابةً عن جهةٍ لم تُصدِرْه.
#
# **التعديلُ بقرارِ المالكِ (المادة 11، `WL-076`، 2026-09-07):** صارَ مجلسُ النماذجِ
# المستقلُّ (Model Council) هو سلطةَ المراجعةِ المستقلّةَ المُعتمَدةَ — نموذجانِ حدوديّانِ
# أو أكثرُ من مزوّدينَ مختلفينَ كوكلاءَ مستقلّينَ منفصلينَ. والمنفِّذُ يُجهِّزُ الحزمةَ
# ويُطلِقُ المجلسَ **ولا يُؤلِّفُ النتائجَ ولا يُصدرُ حكمَ إعادةِ الاختبارِ**.
#
# حالةُ كلِّ ارتباطٍ محصورةٌ في مفردةٍ واحدةٍ: `awaiting-model-council`.
# وأيُّ حالةٍ أخرى تُكتَبُ هنا بيدِ المُنفِّذِ **يردُّها الاختبارُ** لا يُناقِشُها.
version: 2
declaredIn: WL-076

statusVocabulary:
  - awaiting-model-council

# مَن يملكُ إصدارَ النتيجةِ. لا `executor` في هذه القائمةِ أصلاً.
# `model-council`: مجلسُ نماذجٍ مستقلٌّ (≥ نموذجينِ حدوديّينِ من مزوّدينَ مختلفينَ)
# يُطلَقُ كوكلاءَ منفصلينَ — لا المنفِّذُ. تفصيلُ الضماناتِ في المادة 11 من القاعدةِ الحاكمةِ.
resultAuthority: model-council

# تعريفُ سلطةِ المراجعةِ وضماناتُ استقلاليّتِها — يحرسُها الاختبارُ الحارسُ.
councilAuthority:
  kind: model-council
  minModels: 2
  distinctProviders: true
  independence:
    - النماذجُ الأعضاءُ ليستْ المنفِّذَ؛ والمنفِّذُ يُجهِّزُ الحزمةَ ويُطلِقُ المجلسَ ولا يُؤلِّفُ النتائجَ ولا يُصدرُ حكمَ إعادةِ الاختبارِ.
    - كلُّ نتيجةٍ يُنتجُها نموذجٌ عضوٌ ويُحفظُ تقريرُه الخامُّ كأثرٍ مستقلٍّ على القرصِ.
    - المنفِّذُ قد يُنفِّذُ إصلاحاً لنتيجةٍ، لكنّ إعادةَ الاختبارِ وحكمَ الإغلاقِ يُصدِرُهما المجلسُ.
  reportArtifactPattern: docs/external-review/reports/<id>-model-council-report.md
  completionRequires:
    - تقريرٌ خامٌّ لكلِّ نموذجٍ على القرصِ يُحدِّدُ النماذجَ بمعرِّفاتِها وزمنَ التشغيلِ ونطاقَ السؤالِ ومُعرِّفَ كوميتِ المستودعِ المُراجَعِ.
    - النتائجُ مُدخلاتٌ منظَّمةٌ تُشيرُ إلى التقريرِ الخامِّ.
    - لكلِّ نتيجةٍ حرجةٍ أو عاليةٍ سجلُّ إغلاقٍ يربطُها بإصلاحٍ (كوميت) وإعادةِ اختبارٍ من المجلسِ.
  synthesisIsNotEvidence: التقريرُ المُولَّفُ (synthesis) عرضٌ لا دليلٌ؛ والاختبارُ يطلبُ التقايريرَ الخامَّةَ لكلِّ نموذجٍ.

engagements:
  - id: M11.04
    kind: independent-security-review
    title: مراجعةٌ أمنيّةٌ مستقلّةٌ خارجَ فريقِ البناءِ
    status: awaiting-model-council
    executedBy: null
    acceptanceCriteria: >-
      تقريرُ مراجعةٍ صادرٌ عن جهةٍ مستقلّةٍ، **مع سجلِّ إغلاقٍ لكلِّ نتيجةٍ حرجةٍ
      وعاليةٍ** — لا ملخَّصٌ ولا شهادةٌ عامّةٌ.
    scope:
      - جذرُ الثقةِ وسلسلةُ التوقيعِ والتحقُّقُ من أوامرِ التاجِ.
      - التفويضُ المركزيُّ وطبقةُ الواجهةِ وحدُّ المعدَّلِ وقيدُ `api.call`.
      - سجلُّ الأحداثِ الدائمُ ومقاومتُه للعبثِ وسلسلةُ النسبِ.
      - التشفيرُ وإدارةُ المفاتيحِ وحدودُ `P0` المُعلَنةُ في `docs/REMAINING_WORK.md`.
      - حاجبُ الحجْرِ وبوابةُ الهويّةِ ومفتاحُ الإيقافِ الشاملِ.
    outOfScope:
      - أيُّ فحصٍ يُنفِّذُه المُنفِّذُ ويُقدَّمُ بوصفِه مراجعةً مستقلّةً.
      - إصلاحُ النتائجِ **قبلَ** تسليمِ التقريرِ (الإصلاحُ يقعُ بعدَ القيدِ لا مكانَه).
    artifacts:
      - docs/THREAT_MODEL.md
      - docs/ROOT_OF_TRUST.md
      - docs/POLICY_GOVERNANCE.md
      - docs/AGENT_CONTAINMENT.md
      - docs/REMAINING_WORK.md
      - docs/READINESS_REPORT.md
    deliverables:
      - تقريرٌ مُرقَّمُ النتائجِ لكلِّ نتيجةٍ خطورةٌ ومسارُ إعادةِ إنتاجٍ وأثرٌ.
      - سجلُّ إغلاقٍ لكلِّ نتيجةٍ حرجةٍ وعاليةٍ يُشار فيه إلى الإصلاحِ بالمُعرِّفِ.
      - إفادةٌ باستقلاليّةِ الجهةِ عن فريقِ البناءِ.

  - id: M11.05
    kind: external-penetration-test
    title: اختبارُ اختراقٍ خارجيٌّ على جذرِ الثقةِ والواجهاتِ وبوابةِ الخروجِ
    status: awaiting-model-council
    executedBy: null
    acceptanceCriteria: >-
      تقريرٌ **وإصلاحٌ موثَّقٌ وإعادةُ اختبارٍ ناجحةٌ** صادرةٌ عن الجهةِ نفسِها —
      فإعادةُ الاختبارِ شرطٌ لا مُستحسَنٌ.
    scope:
      - سطحُ الواجهةِ المُعلَنُ في `config/api.yaml` بمساراتِه ومصادقتِه.
      - بوابةُ الخروجِ وقيودُها والشبكةُ المسموحةُ.
      - مصادقةُ الملكِ ومسارُ التعافي السياديُّ ومنعُ الإعادةِ.
      - عزلُ الوكلاءِ ومنعُ التصعيدِ وتقييدُ التواطؤِ.
    outOfScope:
      - اختبارٌ يُشغِّلُه المُنفِّذُ على شفرتِه ويُسمّى اختراقاً مستقلّاً.
      - أيُّ إسنادِ نتيجةٍ إلى تشغيلةِ تكامُلٍ مستمرٍّ داخليّةٍ.
    artifacts:
      - config/api.yaml
      - docs/API_LAYER.md
      - docs/KING_AUTHENTICATION.md
      - docs/ROYAL_CONSOLE.md
      - docs/THREAT_MODEL.md
      - sbom.cdx.json
    deliverables:
      - تقريرُ اختراقٍ بمسالكِ الهجومِ المُجرَّبةِ ونتائجِها ودرجاتِها.
      - إصلاحٌ موثَّقٌ لكلِّ نتيجةٍ مقبولةٍ ثمَّ **إعادةُ اختبارٍ** بنتيجةٍ مكتوبةٍ.
      - نطاقُ الاختبارِ وزمنُه وأدواتُه بلا لبسٍ.

  - id: M11.06
    kind: human-legal-ethical-review
    title: مراجعةٌ أخلاقيّةٌ وقانونيّةٌ بشريّةٌ لنطاقِ استقلاليّةِ الوكلاءِ وحدودِها
    status: awaiting-model-council
    executedBy: null
    acceptanceCriteria: >-
      قرارٌ موثَّقٌ **بالحدودِ المسموحةِ والممنوعةِ** — لا رأيٌ عامٌّ ولا تصنيفُ
      مخاطرَ بلا حدٍّ قابلٍ للإنفاذِ.
    scope:
      - نطاقُ استقلاليّةِ الوكلاءِ ومداهُ الزمنيُّ وسقوفُ أفعالِه.
      - الأفعالُ المحكومةُ في عتبةِ السلطةِ السياديّةِ وما استُثني منها ولماذا.
      - الاحتفاظُ بالبياناتِ وحدودُ المعالجةِ والمساءلةُ البشريّةُ.
      - حقُّ النقضِ ومَن يملكُه وأثرُه بعدَ إعادةِ التشغيلِ.
    outOfScope:
      - اجتهادُ المُنفِّذِ في تفسيرِ حدٍّ قانونيٍّ أو أخلاقيٍّ.
      - كتابةُ قرارٍ نيابةً عن مجلسِ النماذجِ المستقلِّ (سلطةُ القرارِ للمجلسِ وحدَهُ — المادة 11).
    artifacts:
      - docs/CONSTITUTION.md
      - docs/POLICY_MODEL.md
      - docs/POLICY_GOVERNANCE.md
      - docs/LEGISLATION.md
      - docs/RETENTION.md
      - docs/AGENT_CONTAINMENT.md
    deliverables:
      - قرارٌ مكتوبٌ بجدولِ «مسموحٌ / ممنوعٌ / مسموحٌ بشرطٍ» لكلِّ فعلٍ مُعلَنٍ.
      - شرطُ مراجعةٍ دوريّةٍ وموعدُها.
      - جهةُ التوقيعِ وصفتُها.

# لا نتيجةَ مراجعةٍ واحدةً حتى تصدرَ من جهةٍ مستقلّةٍ. وهذا الفراغُ **مقصودٌ
# ومُنفَذٌ**: أيُّ قيدٍ يُضاف هنا بيدِ المُنفِّذِ يُرَدُّ في الاختبارِ.
