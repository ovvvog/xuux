        - ثمانيةُ تقاريرِ `M11.04` حُذِفتْ من شجرتَيِ العملِ بيدِ المنفِّذِ؛ فخرجَ `npm run validate` بـ`1` عندَ «أ» في الشجرةِ كما سُلِّمتْ و`0` في شجرةٍ نقيّةٍ لنفسِ الكوميتِ، وفي بيئةِ «ب» أُعيدتْ فيُحتمَلُ أنّه رآها.
