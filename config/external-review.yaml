      - جهةُ التوقيعِ وصفتُها.

# ------------------------------------------------------------------------------
# النتائجُ — **نقلٌ لا ترجيحٌ، وقيدٌ لا إغلاقٌ.**
#
# قُيّدتْ هذه النتائجُ بإذنِ المالكِ الصريحِ (`WL-122`، 2026-09-12). وكلُّ ما هنا
# **منقولٌ من التقايريرِ الخامّةِ كما كتبَها أعضاءُ المجلسِ**، ولا حكمَ للمنفِّذِ فيها:
#
#   1. `status` لكلِّ نتيجةٍ هو ما اتّفقَ عليه العضوانِ. وحيثُ اختلفا فالقيدُ `open`
#      **بالأضعفِ لا بالأقوى** — فلا يُقرأُ خلافٌ إغلاقاً، ويُحفَظُ الخلافُ في `disagreement`.
#   2. `severityAsWritten` بلفظِ العضوِ حرفيّاً (عربيّاً أو إنجليزيّاً)؛ و`severity`
#      تطبيعٌ مُعلَنٌ للفرزِ وحدَه (high/medium/low)، وليس إعادةَ تقديرٍ.
#   3. **لم يُدمَجْ متقاطعانِ.** الدمجُ حكمٌ، فالتقاطعُ مُسجَّلٌ في `overlapsWith`
#      إشارةً لا دمجاً، وكلُّ نتيجةٍ تبقى قيداً مستقلّاً بمعرِّفِ صاحبِها.
#   4. `closed` لا تُكتبُ إلا باجتماعِ العضوينِ **وسجلِّ إغلاقٍ بكوميتٍ وإعادةِ
#      اختبارٍ من المجلسِ** — يحرسُها `tests/docs/external-review-pack.test.mjs`.
# ------------------------------------------------------------------------------

# تطبيعُ الشدّةِ مُعلَنٌ لا مُضمَرٌ — ومن أرادَ لفطَ العضوِ ففي `severityAsWritten`.
severityNormalization:
  عالية: high
  high: high
  متوسطة: medium
  medium: medium
  منخفضة: low
  low: low

