      - الاحتفاظُ بالبياناتِ وحدودُ المعالجةِ والمساءلةُ البشريّةُ.
      - حقُّ النقضِ ومَن يملكُه وأثرُه بعدَ إعادةِ التشغيلِ.
    outOfScope:
