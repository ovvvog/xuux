# سجلُّ التأجيلاتِ المُصرَّحةِ — الخطوة `M11.08`
#
# **التأجيلُ إعلانُ عدمِ إنجازٍ لا دليلُ إنجازٍ.** فكلُّ بندٍ هنا **غيرُ منجَزٍ**،
# ووجودُه في هذا الملفِّ لا يُقرَّبُ إنجازَه خطوةً واحدةً: هو يمنعُ فقط أن يمرَّ
# بندٌ غيرُ منجَزٍ **بصمتٍ** في تقريرِ الجاهزيّةِ.
#
# ولكلِّ تأجيلٍ ستُّ حقولٍ إلزاميّةٍ (يُنفِذُها الحاجزُ `guard:readiness`):
#   reason          — لماذا لم يُنجَزْ (سببٌ يُقرأ لا عبارةُ اعتذارٍ).
#   blocker         — ما الحاجزُ بعينِه.
#   blockerKind     — نوعُه: `external-party` أو `external-plan` أو `sovereign-decision`.
#   unblockCondition— ما الذي يفكُّه بالضبطِ (شرطٌ قابلٌ للتحقّقِ لا أملٌ).
#   authority       — من يملك فكَّه: `owner` أو `external-independent-party` أو `github`.
#   declaredIn      — مُدخلةُ السجلِّ التي أُعلِنَ فيها (يجب أن توجدَ في سجلِّ العملِ).

version: '1.0.0'

deferrals:
  - id: M0.06
    kind: step
    title: حمايةُ الفرعِ `main` — الإنفاذُ محجوبٌ بقيدٍ خارجيٍّ
    reason: >-
      البنيةُ والتنظيمُ منفَّذانِ (‏`CODEOWNERS` وسلسلةُ CI ومراجعةٌ مطلوبةٌ تنظيمياً)،
      **والإنفاذُ الآليُّ على مستودعٍ خاصٍّ يرفضُه GitHub برمزِ `403`**: «Upgrade to
      GitHub Pro or make this repository public».
    blocker: خطةُ حسابِ GitHub الحاليّةُ لا تُتيح قواعدَ حمايةِ الفرعِ على مستودعٍ خاصٍّ.
    blockerKind: external-plan
    unblockCondition: >-
      ترقيةُ الخطةِ (‏GitHub Pro/Team) مع إبقاءِ المستودعِ **خاصّاً** — ولا يُقبَل
      تحويلُه إلى Public تحايلاً على القيدِ، ولا تجاوزُ GitHub.
    authority: github
    declaredIn: WL-065
  - id: M11.04
    kind: step
    title: مراجعةٌ أمنيّةٌ مستقلّةٌ خارجَ فريقِ البناءِ
    reason: >-
      المراجعةُ **ليست مستقلّةً إذا نفَّذها المنفِّذُ** — ووضعُ نتيجةٍ نيابةً عن
      مراجعٍ مستقلٍّ خرقٌ للمادة 8 وانتحالُ حكمٍ لم يقعْ.
    blocker: لا جهةَ مراجعةٍ مستقلّةً مُتعاقَداً معها ولا نطاقَ مراجعةٍ مُعتمَداً من المالكِ.
    blockerKind: external-party
    unblockCondition: >-
      تقريرُ مراجعةٍ صادرٌ عن جهةٍ خارجَ فريقِ البناءِ + سجلُّ إغلاقٍ لكلِّ نتيجةٍ
      حرجةٍ وعاليةٍ يُراجَع ويُقيَّد في سجلِّ العملِ.
    authority: external-independent-party
    declaredIn: WL-065
  - id: M11.05
    kind: step
    title: اختبارُ اختراقٍ خارجيٌّ على جذرِ الثقةِ والواجهاتِ وبوابةِ الخروجِ
    reason: >-
      اختبارُ اختراقٍ يُنفِّذُه بانِي النظامِ على نفسِه ليس اختباراً مستقلّاً؛
      واختبارٌ لم يحدثْ لا تُختلَق له نتيجةٌ.
    blocker: لا جهةَ اختبارِ اختراقٍ خارجيّةً ولا نطاقَ اختبارٍ مُعتمَداً ولا نافذةَ تنفيذٍ.
    blockerKind: external-party
    unblockCondition: >-
      تقريرُ اختراقٍ خارجيٌّ + إصلاحٌ موثَّقٌ لكلِّ نتيجةٍ + **إعادةُ اختبارٍ
      ناجحةٌ** من الجهةِ نفسِها.
    authority: external-independent-party
    declaredIn: WL-065
  - id: M11.06
    kind: step
    title: مراجعةٌ أخلاقيّةٌ وقانونيّةٌ بشريّةٌ لنطاقِ استقلاليّةِ الوكلاءِ
    reason: >-
      حدودُ استقلاليّةِ الوكلاءِ قرارٌ بشريٌّ أخلاقيٌّ قانونيٌّ، ولا يجوز أن يُصدِرَه
      الوكيلُ على نفسِه.
    blocker: لا مراجعةَ بشريّةً مستقلّةً (أخلاقيّةً/قانونيّةً) صدرتْ.
    blockerKind: external-party
    unblockCondition: قرارٌ موثَّقٌ بالحدودِ المسموحةِ والممنوعةِ، صادرٌ عن مراجعةٍ بشريّةٍ مستقلّةٍ.
    authority: external-independent-party
    declaredIn: WL-065
  - id: M11.09
    kind: step
    title: قرارُ الجاهزيّةِ الملكيُّ ثم الإطلاقُ المحدودُ والتوسّعُ التدريجيُّ
    reason: >-
      قرارٌ سياديٌّ موقَّعٌ عبرَ بوابةِ التاجِ — والمنفِّذُ **لا يُصدِرُه ولا يُوقِّعُ
      نيابةً عن المالكِ ولا يُطلِقُ نظاماً**.
    blocker: لم يصدرْ أمرٌ ملكيٌّ موقَّعٌ، وشروطُه السابقةُ (`M11.04`–`M11.06`) غيرُ مستوفاةٍ.
    blockerKind: sovereign-decision
    unblockCondition: >-
      أمرٌ ملكيٌّ موقَّعٌ مسجَّلٌ في سجلِّ الأحداثِ + خطةُ توسّعٍ بمراحلَ ومعاييرِ
      تراجعٍ — بعدَ استيفاءِ `M11.04`–`M11.06`.
    authority: owner
    declaredIn: WL-065
  - id: G11
    kind: gate
    title: البوابةُ النهائيّةُ — إعلانُ اكتمالِ تعريفِ المئةِ في المئةِ
    reason: >-
      شروطُها مراجعةٌ مستقلّةٌ واختبارُ اختراقٍ ومراجعةٌ بشريّةٌ وتمرينُ طوارئٍ
      وتقريرُ جاهزيّةٍ وقرارٌ ملكيٌّ؛ وأربعةٌ منها **لم تقعْ**.
    blocker: '`M11.04` و`M11.05` و`M11.06` و`M11.09` غيرُ منجزةٍ.'
    blockerKind: sovereign-decision
    unblockCondition: >-
      إغلاقُ `G0`–`G10` **مع** استيفاءِ `M11.04`–`M11.06` ونتائجِها الحرجةِ مغلقةً،
      ثم قرارُ المالكِ. وأيُّ إعلانِ `100%` قبلَ ذلك خرقٌ للمادة 2.
    authority: owner
    declaredIn: WL-065
