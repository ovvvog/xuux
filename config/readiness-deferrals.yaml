# سجلُّ التأجيلاتِ المُصرَّحةِ — الخطوة `M11.08`
#
# **التأجيلُ إعلانُ عدمِ إنجازٍ لا دليلُ إنجازٍ.** فكلُّ بندٍ هنا **غيرُ منجَزٍ**،
# ووجودُه في هذا الملفِّ لا يُقرَّبُ إنجازَه خطوةً واحدةً: هو يمنعُ فقط أن يمرَّ
# بندٌ غيرُ منجَزٍ **بصمتٍ** في تقريرِ الجاهزيّةِ.
#
# ولكلِّ تأجيلٍ ستُّ حقولٍ إلزاميّةٍ (يُنفِذُها الحاجزُ `guard:readiness`):
#   reason          — لماذا لم يُنجَزْ (سببٌ يُقرأ لا عبارةُ اعتذارٍ).
#   blocker         — ما الحاجزُ بعينِه.
#   blockerKind     — نوعُه: `external-party` أو `external-plan` أو `sovereign-decision`.
#   unblockCondition— ما الذي يفكُّه بالضبطِ (شرطٌ قابلٌ للتحقّقِ لا أملٌ).
#   authority       — من يملك فكَّه: `owner` أو `external-independent-party` أو `model-council` أو `github`.
#   declaredIn      — مُدخلةُ السجلِّ التي أُعلِنَ فيها (يجب أن توجدَ في سجلِّ العملِ).
#   recheck         — موعدُ إعادةِ النظرِ: `cadence` وتيرةً (‏`P1M` أو `P3M`)،
#                     و`lastReviewedOn` تاريخَ آخرِ مراجعةٍ فعليّةٍ للحاجزِ،
#                     و`decidedIn` مُدخلةَ قرارِ الوتيرةِ. **فتأجيلٌ بلا موعدٍ
#                     تاريخٌ مفتوحٌ** (الدَّين `LIVE-3`)، ومن فاتَ موعدُه أوقفَ
#                     الحاجزَ بالرمزِ `READINESS_DEFERRAL_REVIEW_OVERDUE`.
#
# ووتيرةُ كلِّ تأجيلٍ **ليست اختيارَ منفِّذٍ**: تُقرأ من `recheckPolicy` أدناه،
# وهي مُقابَلةٌ حرفاً بحرفٍ بقسمِ `deferralRecheck` في `config/readiness-report.yaml`.

version: '1.2.0'

# سياسةُ إعادةِ النظرِ — قرارُ المالكِ في `WL-204`: الأساسُ فصليٌّ، ومسارُ مجلسِ
# النماذجِ شهريٌّ لأنّه المسارُ الذي يُنتِجُ مخرجاتٍ بوتيرةٍ أسرعَ.
recheckPolicy:
  baselineCadence: P3M
  byAuthority:
    model-council: P1M
  decidedIn: WL-204

deferrals:
  - id: M0.06
    kind: step
    title: حمايةُ الفرعِ `main` — الإنفاذُ قائمٌ ومقيسٌ، وتبديلُ الرمزِ للمالكِ
    reason: >-
      البنيةُ والتنظيمُ منفّذانِ، والإنفاذُ قائمٌ ومقيسٌ عبرَ واجهةِ الحمايةِ: المستودعُ
      عامٌّ، و`main` محميّةٌ بمراجعةٍ واحدةٍ و`enforce_admins: true` وفحصِ «فحص
      الجودة الكامل» الملزمِ ومنعِ الدفعِ القسريِّ والحذفِ (قياسُ `WL-341` بتاريخ
      2026-10-02، وأُعيدَ في `WL-476`). فقيودُ خطةِ GitHub التي سُجّلَت في إعلانِ التأجيلِ الأصليِّ
      (حقلُ `declaredIn` أدناه) لم تعد تحكمُ الحالةَ. لكنّ تبديلَ رمزِ الخطوةِ في لوحةِ خارطةِ
      الطريقِ مسجّلٌ للمالكِ (`EXT-1`/`DOC-19` — «تسجيلُهُ في اللوحةِ للمالكِ» في
      ملاحظةِ `WL-341`) فلم يُبدَّلْ، ولم يُقَسْ رفضُ دفعٍ مباشرٍ بمحاولةٍ فعليةٍ
      (إعداداتُ الحمايةِ المطلوبةُ قائمةٌ مقيسةٌ والرفضُ الفعليُّ غيرُ مقيسٍ، والمحاولةُ الفعليةُ مساسٌ بمسارٍ محميٍّ
      فلا تُنفّذُ بلا إذنِ المالكِ الصريحِ).
    blocker: تبديلُ رمزِ `M0.06` في اللوحةِ قرارٌ محجوزٌ للمالكِ، ودليلُ القبولِ النصيُّ (محاولةُ دفعٍ مباشرٍ تُرفضُ) لم يُقَسْ بمحاولةٍ فعليةٍ.
    blockerKind: sovereign-decision
    unblockCondition: >-
      قرارُ المالكِ بتسجيلِ إغلاقِ `M0.06` في اللوحةِ — وإتمامُ دليلِ القبولِ النصيُّ
      بمحاولةِ دفعٍ مباشرٍ مرفوضةٍ بإذنِهِ إن طلبها، أو اعتمادُ قياسِ إعداداتِ الحمايةِ
      عبرَ الواجهةِ دليلًا بقرارِهِ.
    authority: owner
    declaredIn: WL-065
    recheck:
      cadence: P3M
      lastReviewedOn: '2026-10-26'
      decidedIn: WL-204

  - id: M11.04
    kind: step
    title: مراجعةٌ أمنيّةٌ مستقلّةٌ خارجَ فريقِ البناءِ
    reason: >-
      اعتمدَ المالكُ (المادة 11، `WL-076`) مجلسَ النماذجِ المستقلَّ سلطةَ المراجعةِ،
      لكنّ المراجعةُ **لم تُجرَ بعدُ** — والمنفِّذُ لا يُؤلِّفُ نتائجَها ولا يُصدرُ حكمَ
      إعادةِ الاختبارِ (المادة 8 و11). الخطوةُ تبقى ⬜ حتى تُنتجَ المراجعةُ مخرجاتٍ.
    blocker: مراجعةُ Model Council الأمنيّةُ لم تُطلَقْ بعدُ ولا نتائجَ لها على القرصِ.
    blockerKind: external-party
    unblockCondition: >-
      تقريرُ مراجعةٍ خامٌّ من مجلسِ النماذجِ المستقلِّ + سجلُّ إغلاقٍ لكلِّ نتيجةٍ
      حرجةٍ وعاليةٍ يربطُها بإصلاحٍ (كوميت) وإعادةِ اختبارٍ من المجلسِ.
    authority: model-council
    declaredIn: WL-076
    recheck:
      cadence: P1M
      lastReviewedOn: '2026-10-17'
      decidedIn: WL-204
  - id: M11.05
    kind: step
    title: اختبارُ اختراقٍ خارجيٌّ على جذرِ الثقةِ والواجهاتِ وبوابةِ الخروجِ
    reason: >-
      اعتمدَ المالكُ (المادة 11، `WL-076`) مجلسَ النماذجِ المستقلَّ لإنتاجِ سيناريوهاتِ
      اختبارِ الاختراقِ وإعادةِ اختبارِها، لكنّ الاختبارَ **لم يُجرَ بعدُ** —
      والمنفِّذُ قد يُنفِّذُ إصالحاتٍ لكن لا يُصدرُ حكمَ الاختراقِ (المادة 11).
    blocker: اختبارُ اختراقِ Model Council لم يُطلَقْ بعدُ ولا تقريرَ ولا إعادةَ اختبارِ له.
    blockerKind: external-party
    unblockCondition: >-
      تقريرُ اختراقٍ خامٌّ من المجلسِ بمسالكِ الهجومِ + إصلاحٌ موثَّقٌ لكلِّ نتيجةٍ +
      إعادةُ اختبارٍ ناجحةٌ من المجلسِ نفسِه.
    authority: model-council
    declaredIn: WL-076
    recheck:
      cadence: P1M
      lastReviewedOn: '2026-10-17'
      decidedIn: WL-204
  - id: M11.06
    kind: step
    title: مراجعةٌ أخلاقيّةٌ وقانونيّةٌ لنطاقِ استقلاليّةِ الوكلاءِ وحدودِها
    reason: >-
      اعتمدَ المالكُ (المادة 11، `WL-076`) مجلسَ النماذجِ المستقلَّ بديلاً عن المراجعةِ
      البشريةِ، لكنّ المراجعةَ **لم تُجرَ بعدُ** — وحدودُ الاستقلاليّةِ قرارٌ يُصدِرُه
      المجلسُ لا المنفِّذُ (المادة 11). الخطوةُ تبقى ⬜ حتى يُصدرَ المجلسُ قرارَه.
    blocker: مراجعةُ Model Council الأخلاقيةُ/القانونيّةُ لم تُطلَقْ بعدُ ولا قرارَ صدرَ.
    blockerKind: external-party
    unblockCondition: >-
      قرارٌ موثَّقٌ بجدولِ «مسموحٌ / ممنوعٌ / مسموحٌ بشرطٍ» لكلِّ فعلٍ مُعلَنٍ، صادرٌ عن
      مجلسِ النماذجِ المستقلِّ، مع شرطِ مراجعةٍ دوريّةٍ وموعدِها.
    authority: model-council
    declaredIn: WL-076
    recheck:
      cadence: P1M
      lastReviewedOn: '2026-10-17'
      decidedIn: WL-204
  - id: M11.09
    kind: step
    title: قرارُ الجاهزيّةِ الملكيُّ ثم الإطلاقُ المحدودُ والتوسّعُ التدريجيُّ
    reason: >-
      قرارٌ سياديٌّ موقَّعٌ عبرَ بوابةِ التاجِ — والمنفِّذُ **لا يُصدِرُه ولا يُوقِّعُ
      نيابةً عن المالكِ ولا يُطلِقُ نظاماً**.
    blocker: لم يصدرْ أمرٌ ملكيٌّ موقَّعٌ، وشروطُه السابقةُ (`M11.04`–`M11.06`) غيرُ مستوفاةٍ.
    blockerKind: sovereign-decision
    unblockCondition: >-
      أمرٌ ملكيٌّ موقَّعٌ مسجَّلٌ في سجلِّ الأحداثِ + خطةُ توسّعٍ بمراحلَ ومعاييرِ
      تراجعٍ — بعدَ استيفاءِ `M11.04`–`M11.06`.
    authority: owner
    declaredIn: WL-065
    recheck:
      cadence: P3M
      lastReviewedOn: '2026-09-17'
      decidedIn: WL-204
  - id: G11
    kind: gate
    title: البوابةُ النهائيّةُ — إعلانُ اكتمالِ تعريفِ المئةِ في المئةِ
    reason: >-
      شروطُها مراجعةٌ مستقلّةٌ واختبارُ اختراقٍ ومراجعةٌ بشريّةٌ وتمرينُ طوارئٍ
      وتقريرُ جاهزيّةٍ وقرارٌ ملكيٌّ؛ وأربعةٌ منها **لم تقعْ**.
    blocker: '`M11.04` و`M11.05` و`M11.06` و`M11.09` غيرُ منجزةٍ.'
    blockerKind: sovereign-decision
    unblockCondition: >-
      إغلاقُ `G0`–`G10` **مع** استيفاءِ `M11.04`–`M11.06` ونتائجِها الحرجةِ مغلقةً،
      ثم قرارُ المالكِ. وأيُّ إعلانِ `100%` قبلَ ذلك خرقٌ للمادة 2.
    authority: owner
    declaredIn: WL-065
    recheck:
      cadence: P3M
      lastReviewedOn: '2026-09-17'
      decidedIn: WL-204
