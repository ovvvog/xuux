# الإقليمُ المعزولُ وصلاحياتُه المفوَّضة — الخطوة M8.07
#
# **العيبُ الذي تعالجه هذه الوثيقة:** الفدراليةُ في المستودع كانت **بذرةً
# وحدَها**: `seed/federation.yaml` تُحصي ستةَ عشرَ إقليماً ومئةً وثمانيةً وعشرين
# ولايةً وألفاً وخمسَ مئةٍ وستّاً وثلاثين بلديةً، ويقرؤها `src/registry/loader.mjs`
# ليعدَّها ويتحقّق من مساراتها. ولم يكن في المستودع مجلَّدُ `src/federation` أصلاً،
# ولا جدولُ أقاليمَ في `state`، ولا صلاحيةٌ واحدةٌ مفوَّضةٌ إلى ترابٍ بعينه، ولا
# سحبٌ لتفويضٍ. فكانت الفدراليةُ **عدّاً في شجرةٍ** لا سلطةً تُمارَس في ترابٍ
# ويُسحب تفويضُها.
#
# وهذه الوثيقةُ تُعلن **إقليماً واحداً معزولاً** بولايةٍ وبلديةٍ منه، وصلاحياتٍ
# مفوَّضةً بالاسم لكلِّ مستوى، وسلسلةَ تفويضٍ لا تنكسر: البلديةُ لا تعمل إلا
# وتفويضُ ولايتها وإقليمها قائمان. والسحبُ **نافذٌ فوراً** بلا نافذةِ سماح.
#
# **وحدٌّ معلَن أول:** الوثيقةُ تُعلن ولا تُنفِّذ. المنفِّذُ
# `src/federation/delegation.mjs`، والحاجزُ الذي يمنع انحرافَ الوثيقةِ عن الكود
# هو `scripts/guard-federation.mjs` (البوابة 23).
#
# **وحدٌّ معلَن ثانٍ:** التفويضُ هنا **يُفعَّل ويُسحب بأمرِ حاملِ السلطة مباشرةً**،
# ولا يمرّ ببوابة التاج ولا يُكتب أمراً ملكيّاً موقَّعاً في سجلِّ تفويضاتٍ نافذة:
# ذاك نصُّ `M8.08` صريحاً («نفّذ التفويض وسحبه كأمر ملكي عبر بوابة التاج، مع سجل
# تفويضات نافذة»). وما هنا **أثرُ** التفويضِ وسحبِه مقيساً في صفوف: إقليمٌ يعمل
# مستقلاً، وسحبٌ يوقفه في اللحظة نفسِها.
#
# **وحدٌّ معلَن ثالث:** لا دورَ «والٍ» ولا «عمدةٍ» في `config/roles.yaml` — سجلُّ
# الأدوار ستةٌ لا أكثر. فالمستوياتُ تُميَّز **بمفتاحِ الترابِ** لا بدورٍ خاصٍّ بها،
# ويُمارَس فعلُ كلِّ مستوى بدورٍ قائمٍ مُعلَنٍ هنا (`exercisedBy`). وإضافةُ أدوارٍ
# ترابيةٍ إلى سجلِّ الأدوار وقدراتِها ليست في هذه الخطوة ومسجَّلةٌ في
# `docs/REMAINING_WORK.md`.
#
# **وحدٌّ معلَن رابع:** إقليمٌ واحدٌ فقط — والمخطَّطُ يُلزم بثلاثةِ مستوياتٍ لا
# أكثر. فالخمسةَ عشرَ إقليماً الأخرى في البذرةِ **بلا تفويضٍ**، وكلُّ فعلٍ يُطلب
# لترابٍ منها يُرفض ويُسجَّل. وهذا هو المقصودُ بـ«معزول»: العزلُ مقيسٌ لا موصوف.

version: 1

# أفعالُ التفويض وحاملُ كلٍّ منها. والتفعيلُ والسحبُ فعلان سياديّان: من يملك أن
# يُفوِّض سلطةً في ترابٍ يملك أن يسحبها، ولا يكون ذلك لمن يمارسها.
acts:
  activate: role:king
  revoke: role:king

# سيادةُ التفويض — الخطوة M8.08.
#
# **العيبُ الذي يعالجه هذا القسم:** في M8.07 كان التفعيلُ والسحبُ يقعان **بمقارنةِ
# اسمِ دورٍ** بالنصِّ `role:king`: فمن استدعى الدالّةَ ومرَّر `actorRole: role:king`
# فوَّض إقليماً أو سحب تفويضَه. فكانت السيادةُ **مطالبةً** لا تفويضاً موقَّعاً، ولا
# منعَ إعادةٍ لأمرٍ استُعمل، ولا سقوطَ أمرٍ قديم، ولا وقوفَ للتفويضِ عند إيقافِ
# الدولة، ولا سجلَّ يُقرأ منه **مَن نافذٌ الآن وبأيِّ أمر**.
#
# وهذا القسم يُعلن: التفعيلُ والسحبُ **أمرٌ ملكيٌّ موقَّعٌ يمرّ ببوابة التاج**
# (`src/root-of-trust/crown.mjs`) — فيها يُتحقَّق التوقيعُ ويُمنع الإعادةُ ويسقط
# الأمرُ القديمُ ويُردّ الأمرُ في دولةٍ موقوفة — ثم يُكتب أثرُه صفّاً في **سجلِّ
# التفويضاتِ النافذة**.
sovereignty:
  statement: >-
    لا يُفوَّض ترابٌ ولا يُسحب تفويضُه إلا بأمرٍ ملكيٍّ موقَّعٍ مقبولٍ في بوابة
    التاج، ويُكتب أثرُ الأمرِ صفّاً في سجلِّ التفويضاتِ النافذةِ بمعرّفِ أمره
    ووقتِ إصداره ووقتِ نفاذه ومهلته المُعلَنةِ وزمنِه المقيس.
  # اسمُ فعلِ الأمرِ الملكيِّ لكلِّ فعلٍ سيادي. وأمرٌ بفعلٍ آخرَ يُردّ ولو كان
  # توقيعُه صحيحاً: أمرٌ يُقبل على غير فعلِه أمرٌ يُعاد استعمالُه في غير موضعه.
  commands:
    activate: delegate-territory
    revoke: revoke-territorial-delegation
  # مهلةُ نفاذِ السحبِ **مُعلَنةٌ ومُقاسة**: تُحسب من وقتِ إصدارِ الأمرِ الملكيِّ إلى
  # لحظةِ كتابةِ نفاذِ السحبِ في الصف. وأمرٌ بلغ عمرُه المهلةَ قبل تطبيقه **يُردّ
  # ويُسجَّل** ولا يُطبَّق بأثرٍ متأخِّرٍ يُدَّعى أنه وقع في المهلة؛ وسحبٌ طُبِّق ثم
  # تجاوز قياسُه المهلةَ يُكتب في السجلِّ متجاوِزاً ويُنشر حادثةَ تجاوزٍ — لا يُخفى
  # ولا تُخضَّر المهلةُ بحذفِ قياسها.
  revocation:
    deadlineMs: 2000
    statement: >-
      السحبُ ينفذ خلال مهلةٍ مُعلَنةٍ ومقيسةٍ لكلِّ أمر؛ وتجاوزُ المهلةِ يُكتب في
      سجلِّ التفويضاتِ النافذةِ ويُنشر حادثةً، ولا يُقرأ السحبُ ناجحاً في المهلة
      إلا بقياسٍ محفوظٍ يقول ذلك.
  # سجلُّ التفويضاتِ النافذة: صفٌّ لكلِّ أمرٍ ملكيٍّ نفذ (منحاً أو سحباً)، ومنه
  # يُقرأ النافذُ الآن. والصفوفُ لا تُحدَّث ولا تُمحى: تسلسلُ الأوامرِ هو السجل.
  register:
    statement: >-
      النافذُ الآن يُقرأ من سجلِّ التفويضاتِ النافذةِ لا من الوثيقة، ولكلِّ صفٍّ
      معرّفُ أمرٍ ملكيٍّ واحدٍ لا يتكرّر؛ وصفُّ تفويضٍ بلا أمرٍ في السجلِّ تباعدٌ
      يُكشف ولا يُقرأ سلطةً.

# شرطُ التفويض: ما لا يستوفيه مسارٌ لا يُنتج عملاً، ورفضُه يحمل رمزاً مُعلَناً.
procedure:
  # لا فعلَ ترابيٌّ قبل أن يكون للتفويضِ صفٌّ محفوظٌ نافذ: تفويضٌ في وثيقةٍ لم
  # يُفعَّل ليس سلطةً، وترابٌ يعمل بلا تفويضٍ يعمل بسلطةِ من يستدعيه.
  requireActivatedDelegation: true
  # كلُّ فعلٍ يُعلن **ترابَه** صراحةً ويُحفظ في صفِّه: ترابٌ مُستنبَطٌ من نوعِ
  # الفعلِ وحدَه لا يُقاس تجاوزُه، لأنّ المتجاوِزَ لا يُعلن.
  requireDeclaredTerritory: true
  # ولكلِّ نوعِ فعلٍ صلاحيةٌ واحدةٌ مسمّاةٌ مفوَّضةٌ لهذا المستوى.
  requireDelegatedPower: true
  # وسلسلةُ التفويضِ لا تنكسر: البلديةُ فرعُ ولايةٍ فرعِ إقليم، فسحبُ تفويضِ
  # الإقليمِ يوقف البلديةَ — وإلا كان «السحب» سحباً في السطرِ لا في السلطة.
  enforceChainOfDelegation: true
  # والسحبُ نافذٌ في اللحظة نفسِها: لا مهلةَ نفاذٍ ولا نافذةَ سماحٍ ولا فعلٌ
  # «قيدَ الإنجاز» يُستثنى. ومهلةُ النفاذِ المُعلَنةُ والمُقاسة نصُّ `M8.08`.
  revocationEffectiveImmediately: true
  # والرفضُ **يُسجَّل صفّاً**: مُنِعَ ولم يُسجَّل يعني أنّ العزلَ بلا مادّةٍ تُراجَع.
  recordRefusal: true
  # وسببُ الرفضِ والسحبِ مكتوبٌ بحدٍّ. ونفسُ الرقمِ قيدٌ في الهجرة 0016 وثابتٌ في
  # `entities.mjs`، والبوابةُ 23 تفحص وقوعَه في موضعه من القيد.
  minRefusalReasonLength: 20

# صلاحياتٌ لا تُفوَّض أصلاً: تبقى في المركز ولا تنزل إلى ترابٍ ولو أُعلنت له.
# وصلاحيةٌ محفوظةٌ تقع في صلاحياتِ مستوىً ترفضها الوثيقةُ **عند التحميل** لا عند
# أول فعل: خطأُ إعلانٍ يُكتشف في التشغيل خطأٌ عمل به التشغيلُ حتى كُشف.
reserved:
  powers: [royal-order, adjudicate-case, enact-law, allocate-budget]
  statement: >-
    الأمرُ الملكيُّ والقضاءُ وسنُّ القانونِ وتخصيصُ الميزانيةِ سلطاتٌ لا تُفوَّض
    إلى إقليمٍ ولا ولايةٍ ولا بلدية، ولا تصير مفوَّضةً بإعلانها في وثيقةِ تفويض.

# الإقليمُ المُفوَّضُ وحدَه، وولايتُه وبلديتُه. والمفاتيحُ **تُقابَل ببذرة
# الفدرالية** (`seed/federation.yaml`): إقليمٌ لا وجودَ له في الشجرةِ ترابٌ
# مُختلَق، وولايةٌ ليست من هذا الإقليمِ تفويضٌ عبرَ حدٍّ لا يجوز عبورُه، وبلديةٌ
# ليست في قائمةِ بلديات ولايتها ترابٌ لا يعرفه أحد.
region:
  regionKey: R001
  provinceKey: P001-01
  municipalityKey: P001-01-001
  statement: >-
    الإقليمُ الفدراليُّ 001 هو الإقليمُ الوحيدُ المفوَّضُ في هذه الخطوة، بولايته
    001-01 وبلديتها 001؛ وما عداه من الأقاليمِ بلا تفويضٍ وكلُّ فعلٍ له يُرفض.

# مستوياتُ التفويض الثلاثة. والصلاحياتُ **متداخلةٌ نزولاً**: صلاحيةُ الفرعِ لا
# بدَّ أن تكون من صلاحياتِ أصله — لا يُفوَّض ما لا يُملَك — والوثيقةُ ترفض غيرَ
# ذلك عند التحميل.
levels:
  - level: region
    key: R001
    # المركزُ فوقه، فلا أصلَ ترابيَّ له.
    parent: ''
    # الوزيرُ يمارس سلطةَ الإقليم: أقربُ دورٍ قائمٍ إلى ولايةٍ ترابية، وليس
    # الملكَ — فالتاجُ يُفوِّض ويسحب ولا يمارس الفعلَ اليومي.
    exercisedBy: role:minister
    powers: [regional-plan, service-license, building-permit]
    acts:
      - kind: regional-development-plan
        power: regional-plan
    statement: >-
      الإقليمُ يخطّط تنميته ويملك — أصلاً لفرعيه — رخصةَ الخدمةِ وإذنَ البناء،
      ولا يملك أمراً ملكيّاً ولا قضاءً ولا سنَّ قانونٍ ولا تخصيصَ ميزانية.
  - level: province
    key: P001-01
    parent: R001
    exercisedBy: role:operator
    powers: [service-license, building-permit]
    acts:
      - kind: local-service-license
        power: service-license
    statement: >-
      الولايةُ ترخّص الخدمةَ المحليةَ في ترابها وحدَه، وصلاحياتُها بعضُ صلاحياتِ
      إقليمها لا أوسعُ منها، ولا تخطيطَ تنميةٍ إقليميّاً لها.
  - level: municipality
    key: P001-01-001
    parent: P001-01
    # البلديةُ يُشغّلها وكيلٌ مستقلٌّ داخل حصّةٍ معلَنة — أضيقُ دورٍ قائم.
    exercisedBy: role:agent
    powers: [building-permit]
    acts:
      - kind: building-permit-issue
        power: building-permit
    statement: >-
      البلديةُ تُصدِر إذنَ البناءِ في ترابها وحدَه، ولا ترخّص خدمةً ولا تخطّط
      تنمية؛ وصلاحيتُها الواحدةُ بعضُ صلاحياتِ ولايتها.

# ضماناتُ التفويض: كلُّ بندٍ رمزُ رفضٍ يقع فعلاً في وحدةِ إنفاذه، والتقابلُ
# محروسٌ في الاتجاهين مع `FEDERATION_ERRORS` في البوابة 23.
guarantees:
  - code: FEDERATION_TERRITORY_UNKNOWN
    statement: >-
      لا تفويضَ إلا لترابٍ أعلنته هذه الوثيقةُ ووُجد في بذرة الفدرالية؛ وترابٌ
      خارجَهما ترابٌ مُختلَقٌ لا حدَّ له ولا سلطةَ فيه.
    enforcedBy:
      - src/federation/delegation.mjs
  - code: FEDERATION_NOT_ACTIVATED
    statement: >-
      لا فعلَ ترابيٌّ قبل تفعيلِ التفويضِ في صفٍّ محفوظ؛ وتفويضٌ في وثيقةٍ لم
      يُفعَّل ليس سلطةً نافذة.
    enforcedBy:
      - src/federation/delegation.mjs
  - code: FEDERATION_ALREADY_ACTIVATED
    statement: >-
      التفويضُ يُفعَّل مرّةً واحدةً لكلِّ ترابٍ ما لم يُسحب؛ وتفعيلٌ ثانٍ يُنشئ
      سلطتين في ترابٍ واحدٍ لا يُعرَف أيُّهما النافذة.
    enforcedBy:
      - src/federation/delegation.mjs
  - code: FEDERATION_ROLE_NOT_PERMITTED
    statement: >-
      التفعيلُ والسحبُ للتاج، وفعلُ كلِّ مستوىً لدوره المُعلَنِ وحدَه؛ ومن يُفوِّض
      لا يمارس الفعلَ اليوميَّ في الترابِ ومن يمارسه لا يُوسِّع تفويضَ نفسه.
    enforcedBy:
      - src/federation/delegation.mjs
  - code: FEDERATION_CHAIN_BROKEN
    statement: >-
      سلسلةُ التفويضِ لا تنكسر: لا يعمل فرعٌ وتفويضُ أصله غيرُ نافذ؛ وبلديةٌ تعمل
      بعد سحبِ تفويضِ إقليمها سلطةٌ بلا مصدر.
    enforcedBy:
      - src/federation/delegation.mjs
  - code: FEDERATION_DELEGATION_REVOKED
    statement: >-
      سحبُ التفويضِ نافذٌ في اللحظة نفسِها: كلُّ فعلٍ بعده يُرفض ويُسجَّل، ولا
      فعلَ «قيدَ الإنجاز» يُستثنى ولا نافذةَ سماحٍ تُمنح.
    enforcedBy:
      - src/federation/delegation.mjs
  - code: FEDERATION_ALREADY_REVOKED
    statement: >-
      لا يُسحب تفويضٌ مسحوب؛ وسحبٌ ثانٍ يُعيد كتابةَ وقتِ النفاذِ فيمحو لحظةَ
      السحبِ الأولى وهي مادّةُ المراجعة.
    enforcedBy:
      - src/federation/delegation.mjs
  - code: FEDERATION_REVOCATION_REASON_REQUIRED
    statement: >-
      لكلِّ سحبٍ سببٌ مكتوبٌ يبلغ الحدَّ المُعلَن؛ وسحبٌ بلا سببٍ يُقرأ بعد حينٍ
      قراراً بلا موجبٍ فلا يُراجَع ولا يُنقَض.
    enforcedBy:
      - src/federation/delegation.mjs
  - code: FEDERATION_POWER_NOT_DELEGATED
    statement: >-
      لا يُمارَس في الترابِ إلا صلاحيةٌ مفوَّضةٌ لمستواه بالاسم؛ وصلاحيةٌ غيرُ
      مفوَّضةٍ لا تُستعار من مستوىً آخرَ ولا تُشتقّ من قرابةِ الترابين.
    enforcedBy:
      - src/federation/delegation.mjs
  - code: FEDERATION_POWER_RESERVED
    statement: >-
      الصلاحياتُ المحفوظةُ للمركزِ لا تُفوَّض ولو أُعلنت لمستوى؛ والوثيقةُ ترفضها
      عند التحميلِ لا عند أول فعلٍ يُطلب بها.
    enforcedBy:
      - src/federation/delegation.mjs
  - code: FEDERATION_ACT_UNKNOWN
    statement: >-
      لا يُمارَس نوعُ فعلٍ لم تُعلنه الوثيقةُ لهذا المستوى؛ ونوعٌ غيرُ مُعلَنٍ فعلٌ
      لا صلاحيةَ مسمّاةً له فلا يُقاس تفويضُه.
    enforcedBy:
      - src/federation/delegation.mjs
  - code: FEDERATION_OUT_OF_TERRITORY
    statement: >-
      كلُّ مستوىً يعمل في ترابه وحدَه: لا يعمل في ترابِ أخيه ولا في ترابِ إقليمٍ
      غيرِ مُفوَّض؛ والمحاولةُ تُمنع وتُسجَّل صفّاً بترابها المطلوب.
    enforcedBy:
      - src/federation/delegation.mjs
  - code: FEDERATION_ROYAL_COMMAND_REQUIRED
    statement: >-
      لا تفعيلَ ولا سحبَ بلا أمرٍ ملكيٍّ موقَّعٍ يمرّ ببوابة التاج؛ ومقارنةُ اسمِ
      دورٍ بالنصِّ سلطةٌ مُدَّعاةٌ لا سلطةٌ مُفوَّضة، ولا بوابةَ تاجٍ يعني لا سيادة.
    enforcedBy:
      - src/federation/delegation.mjs
  - code: FEDERATION_COMMAND_ACTION_UNKNOWN
    statement: >-
      فعلُ الأمرِ الملكيِّ هو الفعلُ المُعلَنُ في هذه الوثيقةِ وحدَه؛ وأمرٌ يُقبل
      على غير فعلِه أمرٌ يُنقل من موضعٍ إلى موضعٍ بتوقيعٍ صحيح.
    enforcedBy:
      - src/federation/delegation.mjs
  - code: FEDERATION_COMMAND_TARGET_MISMATCH
    statement: >-
      هدفُ الأمرِ الملكيِّ هو مفتاحُ الترابِ المقصودِ نفسُه؛ وأمرٌ على ترابٍ يُطبَّق
      على ترابٍ آخرَ سحبٌ أو منحٌ لم يأمر به أحد.
    enforcedBy:
      - src/federation/delegation.mjs
  - code: FEDERATION_REVOCATION_DEADLINE_MISSED
    statement: >-
      السحبُ لا يُطبَّق بعد انقضاءِ مهلته المُعلَنةِ من وقتِ إصدارِ أمره؛ وأثرٌ يقع
      بعد المهلةِ يُدَّعى وقوعُه فيها قياسٌ كاذبٌ لا سيادةٌ قابلةٌ للسحب.
    enforcedBy:
      - src/federation/delegation.mjs
  - code: FEDERATION_REGISTER_DIVERGED
    statement: >-
      سجلُّ التفويضاتِ النافذةِ وصفوفُ التفويضِ لا يتباعدان: صفٌّ نافذٌ بلا أمرٍ
      ملكيٍّ في السجل، أو أمرٌ في السجلِّ بلا صفٍّ يقابله، تباعدٌ يُكشف ولا يُقرأ.
    enforcedBy:
      - src/federation/sovereignty.mjs
