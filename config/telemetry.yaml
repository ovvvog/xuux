# القياس الموحّد — الخطوة `M10.01`
#
# **العيب الذي تُغلقه هذه الوثيقة:** بعد `M9` صار للدولة سبعُ واجهات سيادية،
# وصار كلُّ نداءٍ فيها يُقيَّد في سجل الأحداث **قبل** فعله. فمن سأل «هل وقع
# النداء؟» وجد جوابَه في السجل. **ومن سأل «أين ذهب النداء؟» لم يجد شيئاً.**
# فالنداء الواحد يمرّ من بوابة الواجهة (`M9.02`) إلى مشهد المراقبة (`M9.01`) إلى
# نداءٍ قارئ على مستودعٍ في طبقة الاستمرارية (`M3`) — **ثلاثة قيود في السجل لا
# يربطها معرّفٌ واحد**. فمن قرأ السجلَّ رأى ثلاثة أحداث متجاورة في الزمن
# وخمَّن أنها نداءٌ واحد. **والتخمين ليس رصداً.** وأسوأُ منه أن بطء الطبقة
# الثالثة يظهر بطئاً في الأولى بلا موضعٍ يُنسَب إليه، فيُقاس الأثر ولا يُقاس
# مَن سبَّبه.
#
# **القاعدة الحاكمة في هذه الوثيقة: لا إشارةَ بلا اسمٍ معلَنٍ، ولا نداءَ بلا
# معرّفِ ارتباطٍ واحد.** فكلُّ أثرٍ وكلُّ مقياسٍ وكلُّ سطرِ سجلٍّ مهيكلٍ يخرج من
# هذه الطبقة **يجب أن يكون اسمُه مُعلَناً هنا** وإلا رُدَّ برمزٍ مُسمّىً؛ وكلُّ
# ما يخرج داخل نداءٍ واحدٍ يحمل **معرّفَ أثرٍ واحداً** (`traceId`) من أوّل
# الطبقات إلى آخرها. وهذا معيار القبول بحرفه: «تتبّع نداء واحد من الواجهة إلى
# التخزين في أثر واحد».
#
# **وليست هذه حزمةَ OpenTelemetry:** لا تبعية جديدة تُضاف إلى المستودع (وفيه
# `pg` و`yaml` وحدهما، وأمنُ سلسلة التوريد نصُّ `M11.02` ولم يُنفَّذ). والمنفَّذ
# هنا هو **نموذج بيانات OpenTelemetry ومعيار W3C Trace Context** كما هما: أثرٌ
# بمعرّفٍ من 32 خانةً ست عشريةً، ومدًى بمعرّفٍ من 16، وأبٌ صريح، وطابعان
# بالنانوثانية، وحالةٌ ووسومٌ وأحداثٌ داخل المدى، و`traceparent` بالنسخة `00`
# يُقرأ ويُكتب. فمن أراد صادراً إلى مُجمِّعٍ خارجي وجد البيانات جاهزةً بشكلها،
# ولا يُدَّعى هنا أن الصادر منفَّذ — وهو حدٌّ معلَن في آخر هذه الوثيقة.

version: 1

statement: >-
  القياس الموحّد يربط النداء الواحد بمعرّف أثرٍ واحد من بوابة الواجهة إلى
  المستودع: أسماء المدَيات والمقاييس ومستويات السجل مُعلَنة هنا بأعيانها فما لم
  يُعلَن يُرَدُّ برمزٍ مُسمّىً لا يُخترَع باسمه، والمعرّفات على معيار W3C Trace
  Context بطولٍ ثابتٍ يُفحَص، والزمن من ساعةٍ تُمرَّر لا من ساعةِ النظام، وكلُّ
  سطر سجلٍّ مهيكلٍ داخل مدًى يحمل معرّفَ أثرِه ومداه فيُقرأ منسوباً لا مجاوراً،
  والقياس لا يُبدّل نتيجة النداء المقيس ولا يرمي فيه خطأً من عنده، وفوق سقف
  المدَيات المُعلَن رفضٌ مُسمّىً لا إسقاطٌ صامت.

# ── المعاينة: لا إسقاط ──
#
# ومعاينة الآثار (sampling) معلَنة هنا `alwaysOn` **قصداً لا سهواً**: المعاينة
# الاحتمالية تُوفِّر كلفةً في أنظمة تُقاس فيها الاتجاهات، وهذه دولةٌ يُقاس فيها
# **النداء بعينه**. ومن أسقط تسعةً من كل عشرة آثارٍ ثم سُئل عن نداءٍ واحدٍ بعينه
# أجاب «لم يُعايَن» — وذاك جوابٌ لا يُقبل في موضع المساءلة. والكلفة معلَنة:
# ذاكرةٌ في العملية بحدٍّ أقصى مُعلَن أدناه، ورفضٌ مُسمّىً عند تجاوزه.
sampling:
  mode: alwaysOn
  statement: >-
    كل نداء يُعايَن. ولا معاينة احتمالية في موضع المساءلة: من أسقط أثراً ثم
    سُئل عن النداء الذي أسقطه لم يكن عنده جواب.

# ── الحدود المقيسة ──
#
# وكلُّ حدٍّ هنا يُفحَص في زمن التشغيل ويُرَدُّ تجاوزُه برمزٍ مُسمّىً:
# `TELEMETRY_SPAN_LIMIT_EXCEEDED` لسقف المدَيات، والوسمُ الزائد أو الطويل
# يُقتطَع باسمه في وسمٍ مُعلَنٍ لا يُحذَف صامتاً.
limits:
  maxSpansPerTrace: 128
  maxAttributesPerSpan: 32
  maxAttributeLength: 512
  statement: >-
    السقوف مقيسة لا مقدَّرة: أثرٌ يتجاوز مئةً وثمانيةً وعشرين مدًى في نداءٍ
    واحدٍ ليس رصداً بل حلقةٌ مفتوحةٌ تُبلَّغ رفضاً مُسمّىً؛ والوسم فوق طوله
    يُقتطَع ويُعلَن اقتطاعُه في الوسم `telemetry.attributes.truncated` فلا
    يُقرأ ناقصاً على أنه تامّ.

# ── الارتباط: معرّف واحد لكل نداء ──
#
# وحقول الارتباط هي الحقول التي تُضاف إلى كل سطر سجلٍّ مهيكلٍ يُصدَر داخل مدًى.
# والتقابل مع الكود في الاتجاهين يحرسه الحاجز (R8).
correlation:
  traceIdField: traceId
  spanIdField: spanId
  parentSpanIdField: parentSpanId
  traceparentHeader: traceparent
  traceparentVersion: '00'
  statement: >-
    معرّف الارتباط واحدٌ للنداء كله: يُولَّد في أوّل مدًى ويُوَرَّث إلى كل مدًى
    بعده وإلى كل سطر سجلٍّ يُصدَر داخله. والمعرّف الوارد من خارج العملية يُقرأ
    من `traceparent` بالنسخة `00` وحدها، وما خالف صيغتَه رُدَّ
    بـ`TELEMETRY_CONTEXT_INVALID` ولا يُصلَّح بالظنّ ولا يُبتدأ أثرٌ جديدٌ
    صامتاً على أنقاضه.

# ── مستويات السجل المهيكل ──
#
# ولا مستوى يُخترَع: `TELEMETRY_LEVEL_UNDECLARED` لما ليس هنا.
logLevels:
  - debug
  - info
  - warn
  - error

# ── المدَيات المُعلَنة ──
#
# وكل مدًى هنا يُعلن **الملف الذي يُصدِره** (`emittedIn`)، ويقابل الحاجزُ ذلك في
# الاتجاهين (R1): اسمٌ معلَنٌ لا يُصدِره ملفُه يُوقف الحاجز، وملفٌ يُصدِر اسماً
# غير معلَنٍ يُرَدُّ في زمن التشغيل بـ`TELEMETRY_SPAN_UNDECLARED`. وبهذا يصير
# مسار النداء الثلاثي **مقروءاً من الوثيقة** لا مستنتَجاً من الكود.
spans:
  - name: api.call
    kind: server
    emittedIn: src/api/gateway.mjs
    purpose: >-
      المدى الجذر لكل نداءٍ داخليٍّ يمرّ ببوابة الواجهة. هو الذي يُولِّد معرّف
      الأثر إن لم يَرِث واحداً من خارج العملية، وهو الذي يحمل نتيجة النداء
      نجاحاً أو رفضاً برمزه.
    attributes:
      - api.route
      - api.method
      - api.path
      - api.action
      - api.resource
      - api.actor
      - api.session
      - api.refusal.code

  - name: monitor.read
    kind: internal
    emittedIn: src/observability/monitor-agent.mjs
    purpose: >-
      مدى القراءة من مشهد المراقبة المُدقَّق. أبوه `api.call` حين يأتي النداء من
      البوابة، وهو مدًى جذرٌ حين يُنادى المشهد مباشرةً — وكلتا الحالتين معلَنة.
    attributes:
      - monitor.view
      - monitor.method
      - monitor.actor
      - monitor.refusal.code

  - name: storage.read
    kind: client
    emittedIn: src/observability/monitor-agent.mjs
    purpose: >-
      مدى النداء القارئ على المستودع نفسه — وهو **آخر الطبقات**: به يصير الأثر
      الواحد ممتدّاً من الواجهة إلى التخزين كما ينصّ معيار القبول. ويُصدَر من
      موضع تغليف نداءات المستودع في وكيل المراقبة، فهو يقيس النداء الفعلي لا
      تقديراً له.
    attributes:
      - storage.registry
      - storage.entity
      - storage.method

# ── المقاييس المُعلَنة ──
#
# ولا مقياس يُخترَع، ولا نوعُ مقياسٍ يُبدَّل: عدّادٌ يُنادى مدرجاً تكراريّاً
# يُرَدُّ بـ`TELEMETRY_METRIC_KIND_MISMATCH`، وقيمةٌ غير منتهيةٍ أو سالبةٌ على
# عدّادٍ تُرَدُّ بـ`TELEMETRY_VALUE_INVALID`.
metrics:
  - name: api.call.count
    kind: counter
    unit: '{call}'
    purpose: عدد النداءات التي دخلت البوابة — المحاولة لا النجاح.
  - name: api.call.duration
    kind: histogram
    unit: ms
    purpose: زمن النداء الكامل من دخول البوابة إلى خروجه، نجاحاً أو رفضاً.
  - name: api.call.refusals
    kind: counter
    unit: '{refusal}'
    purpose: عدد النداءات المرفوضة موسومةً برمز الرفض، فيُقاس الرفض بسببه.
  - name: storage.read.count
    kind: counter
    unit: '{read}'
    purpose: عدد النداءات القارئة التي بلغت المستودع فعلاً.
  - name: storage.read.duration
    kind: histogram
    unit: ms
    purpose: >-
      زمن النداء القارئ على المستودع وحده — وبه يُنسَب البطء إلى موضعه لا إلى
      الطبقة التي ظهر فيها.

# ── رموز الرفض ──
#
# والتقابل مع `TELEMETRY_ERRORS` في `src/telemetry/telemetry.mjs` في الاتجاهين
# يحرسه الحاجز (R3).
refusalCodes:
  - TELEMETRY_CONFIG_INVALID
  - TELEMETRY_SPAN_UNDECLARED
  - TELEMETRY_METRIC_UNDECLARED
  - TELEMETRY_METRIC_KIND_MISMATCH
  - TELEMETRY_VALUE_INVALID
  - TELEMETRY_ATTRIBUTE_UNDECLARED
  - TELEMETRY_LEVEL_UNDECLARED
  - TELEMETRY_CLOCK_INVALID
  - TELEMETRY_CONTEXT_INVALID
  - TELEMETRY_SPAN_ALREADY_ENDED
  - TELEMETRY_SPAN_LIMIT_EXCEEDED

# ── الضمانات ──
#
# وكل ضمان له رمزٌ وملفُّ إنفاذٍ يجب أن يحمل رمزَه نصّاً، ويقابل الحاجزُ ذلك
# (R4). والضمان الذي لا يُنفَّذ في ملفٍ ضمانٌ يُقرأ ولا يُقاس.
guarantees:
  - id: G-TEL-DECLARED-NAMES
    enforcedIn: src/telemetry/telemetry.mjs
    codes:
      - TELEMETRY_SPAN_UNDECLARED
      - TELEMETRY_METRIC_UNDECLARED
      - TELEMETRY_METRIC_KIND_MISMATCH
      - TELEMETRY_LEVEL_UNDECLARED
    statement: >-
      لا اسمَ إشارةٍ يُخترَع خارج هذه الوثيقة: كل مدًى وكل مقياس وكل مستوى سجلٍّ
      يُطابَق بالوثيقة قبل إصداره، والمخالف يُرَدُّ برمزه لا يُصدَر على علّته.

  - id: G-TEL-ONE-TRACE
    enforcedIn: src/telemetry/tracer.mjs
    codes:
      - TELEMETRY_CONTEXT_INVALID
    statement: >-
      النداء الواحد أثرٌ واحد: معرّف الأثر يُولَّد في المدى الجذر ويُوَرَّث إلى
      كل مدًى ينشأ داخله عبر سياقٍ ضمنيٍّ لا يُمرَّر بيد المستدعي — فلا يُنسى
      تمريرُه فينشأ أثرٌ ثانٍ لنداءٍ واحد.

  - id: G-TEL-W3C-CONTEXT
    enforcedIn: src/telemetry/tracer.mjs
    codes:
      - TELEMETRY_CONTEXT_INVALID
    statement: >-
      المعرّفات على معيار W3C Trace Context: أثرٌ من 32 خانةً ست عشريةً غيرِ
      أصفارٍ كلِّها، ومدًى من 16 كذلك، و`traceparent` بالنسخة `00` يُقرأ ويُكتب.
      وما خالف رُدَّ ولا يُصلَّح بالظنّ.

  - id: G-TEL-INJECTED-CLOCK
    enforcedIn: src/telemetry/tracer.mjs
    codes:
      - TELEMETRY_CLOCK_INVALID
    statement: >-
      الزمن من ساعةٍ تُمرَّر لا من `Date.now()` في مسار القياس؛ فمدَّةٌ مقيسةٌ
      بساعةٍ لا تُقاد لا تُختبَر، ومقياسٌ لا يُختبَر لا يُقاس عليه.

  - id: G-TEL-CORRELATED-LOGS
    enforcedIn: src/telemetry/telemetry.mjs
    codes:
      - TELEMETRY_LEVEL_UNDECLARED
    statement: >-
      كل سطر سجلٍّ مهيكلٍ يُصدَر داخل مدًى يحمل `traceId` و`spanId` وأباه، فيُقرأ
      منسوباً إلى نداءٍ بعينه لا مجاوراً له في الزمن.

  - id: G-TEL-SPAN-CAP
    enforcedIn: src/telemetry/tracer.mjs
    codes:
      - TELEMETRY_SPAN_LIMIT_EXCEEDED
    statement: >-
      فوق سقف المدَيات المُعلَن رفضٌ مُسمّىً لا إسقاطٌ صامت: من أسقط مدَياتٍ
      بلا بلاغٍ أرى أثراً ناقصاً على أنه تامّ.

  - id: G-TEL-READ-ONLY-SIGNALS
    enforcedIn: src/telemetry/tracer.mjs
    codes: []
    statement: >-
      القياس لا يُبدّل المقيس: `withSpan` يُعيد قيمة الدالّة المقيسة كما هي،
      ويُعيد رمي خطئها هو نفسه بعد تسجيل حالة المدى — فلا خطأُ قياسٍ يُخفي خطأَ
      عملٍ ولا نجاحُ عملٍ يُبطله إخفاقُ قياس.
