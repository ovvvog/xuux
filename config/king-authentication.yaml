# مصادقةُ الملكِ القوية — الخطوة `M9.04`
#
# **العيبُ الذي تُغلقه هذه الوثيقة، وقد قِيس لا افتُرض:** بعد `M9.03` صار للملكِ
# ديوانٌ يُصدر منه أمراً موقَّعاً يُنفَّذ ويُسجَّل. وكان **إثباتُ السلطةِ عاملاً
# واحداً**: مفتاحُ التوقيع. فمن ملك المفتاحَ ملك الدولةَ كلَّها بلا عاملٍ ثانٍ
# ولا جهازٍ موثوقٍ ولا جلسةٍ قصيرة — وطبقةُ `M9.02` تقول ذلك بنصِّها: «والجلساتُ
# في الذاكرةِ فتزول بإعادةِ التشغيلِ **ولا عاملَ ثانٍ هنا** (نصُّ `M9.04`)».
# وهذه الوثيقةُ تُغلق ذلك الدَينَ باسمِه: لا أمرَ سياديٌّ إلا من **جلسةٍ قويةٍ**
# فُتِحت بعاملٍ ثانٍ على **جهازٍ موثوقٍ معلَنٍ هنا**، ومهلتُها قصيرةٌ لا تُمدَّد.
#
# وهي **بياناتٌ لا كودٌ**: الجهازُ لا يُوثَّق إلا بإعلانِه هنا، وسحبُ الثقةِ منه
# **تبديلُ حالةٍ في هذا الملفِّ لا حذفُ سطرٍ** كي يبقى الجهازُ المسحوبُ مرفوضاً
# **باسمِه** لا مجهولاً؛ وأنواعُ الأوامرِ التي تُشترط لها الجلسةُ القويةُ معلَنةٌ
# هنا ويُقابلها حاجزٌ بأنواعِ أوامرِ الديوانِ في الاتجاهين.
#
# **وما لا تفعله:** لا تحمل سرّاً واحداً. `factorRef` **اسمُ** سرٍّ يُقرأ من
# مزوِّدِ الأسرارِ عند التشغيل، لا السرُّ نفسُه؛ ومستودعٌ يحمل عاملَ الملكِ
# الثانيَ يجعل العاملَ الثانيَ زينةً — فمن قرأ المستودعَ ملك العاملين معاً.

version: 1

statement: >-
  لا يُصدَر أمرٌ سياديٌّ إلا من جلسةٍ قويةٍ للملكِ نفسِه: عاملٌ ثانٍ يُستهلَك
  مرّةً واحدةً على جهازٍ موثوقٍ معلَنٍ في هذه الوثيقة، ومهلةٌ قصيرةٌ لا تُمدَّد
  باستعمالٍ ولا تُورَّث. وما نقص من ذلك رفضٌ مُسمّىً لا سماحٌ صامت.

# ── الجلسةُ القصيرة ──
# `ttlSeconds` هنا **300** لا 900 كجلسةِ `config/api.yaml` القارئة، والفرقُ
# مقصود: تلك تقرأ وهذه تُوقف دولةً وتنقض أوامرَها. والرمزُ لا يُخزَّن نصّاً بل
# ببصمةِ `sha256` كجلسةِ الطبقةِ نفسِها: من قرأ الذاكرةَ أو لقطتَها لا يجد رمزاً
# يُنتحل به. ولا تمديدَ ضمنيّاً بالاستعمال: جلسةٌ تُمدَّد بكلِّ نداءٍ جلسةٌ دائمةٌ
# اسمُها قصيرة.
session:
  ttlSeconds: 300
  tokenBytes: 32
  digest: sha256
  statement: >-
    مهلةُ الجلسةِ من لحظةِ فتحِها لا من آخرِ استعمالٍ لها، ورمزُها يُعاد مرّةً
    واحدةً عند الفتحِ ولا يُخزَّن إلا ببصمتِه.

# ── العاملُ الثاني ──
# رمزٌ يُحسَب من سرِّ الجهازِ وخُطوةِ الزمنِ بـ`hmac-sha256`، ويُقارَن **مقارنةً
# ثابتةَ الزمن** فلا يُكشف بقياسِ فرقِ الردّ. و`acceptedSkewSteps: 1` تسمح بخطوةٍ
# قبل وخطوةٍ بعد لأن ساعةَ الجهازِ ليست ساعةَ الخادم؛ وذاك ثمنُ صلاحيةٍ معلَنٌ
# قدرُه دقيقةٌ وحدَها لا أكثر. و`singleUse` تمنع إعادةَ استعمالِ رمزِ الخطوةِ
# نفسِها: من رأى الرمزَ على الشاشةِ أو في سجلٍّ لا يفتح به جلسةً ثانية.
secondFactor:
  algorithm: hmac-sha256
  digits: 8
  stepSeconds: 30
  acceptedSkewSteps: 1
  singleUse: true
  statement: >-
    رمزُ العاملِ الثاني يُستهلَك مرّةً واحدةً لكلِّ (جهازٍ، خطوةٍ زمنية)، ويُقارَن
    مقارنةً ثابتةَ الزمن، ولا يُكتب في أيِّ قيدِ تدقيقٍ ولا في أيِّ رسالةِ رفض.

# ── الأجهزةُ الموثوقة ──
# `factorRef` **اسمُ** سرٍّ لا سرّ. وسحبُ الثقةِ تبديلُ `state` إلى `revoked` لا
# حذفُ السطر: الجهازُ المحذوفُ يُرفض «مجهولاً» فيُقرأ خطأَ إعدادٍ، والجهازُ
# المسحوبُ يُرفض **باسمِه** فيُقرأ قراراً — وفرقُ الرمزين فرقُ تحقيقٍ في حادثة.
devices:
  - id: device:king-console-primary
    purpose: جهازُ الملكِ الأولُ الذي يُفتح منه ديوانُه.
    state: trusted
    factorRef: KING_FACTOR_CONSOLE_PRIMARY

# ── ضمانُ السلطة ──
# أنواعُ أوامرِ الديوانِ الأربعةُ كلُّها هنا: الإيقافُ والاستئنافُ والنقضُ ورفعُه
# — ولا يُستثنى «رفعُ النقض» ولا «الاستئناف» بحجّةِ أنهما تعافٍ، فمن ملك
# استئنافَ دولةٍ موقوفةٍ ملك إبطالَ إيقافِها. والحاجزُ يقابل هذه القائمةَ بأنواعِ
# أوامرِ `config/royal-console.yaml` في الاتجاهين، فأمرٌ جديدٌ في الديوانِ بلا
# نوعٍ هنا يُخفق البوابةَ يومَ إعلانِه لا بعد أشهر.
assurance:
  requiredForCommandKinds:
    - halt
    - halt-resume
    - veto
    - veto-clear
  statement: >-
    كلُّ نوعِ أمرٍ يُصدَر من الديوانِ يشترط جلسةً قويةً قائمةً للملكِ نفسِه؛
    وجلسةُ طبقةِ الواجهةِ القارئةُ لا تُصدر أمراً ولو كانت صحيحةً.

# ── التدقيق ──
audit:
  sessionOpenedEvent: authn.session.opened
  sessionClosedEvent: authn.session.closed
  refusedEvent: authn.refused
  factorConsumedEvent: authn.factor.consumed
  statement: >-
    فتحُ الجلسةِ وإغلاقُها واستهلاكُ العاملِ وكلُّ رفضٍ قيودٌ في السجلِّ الدائم،
    ولا يُكتب في أيٍّ منها رمزُ العاملِ ولا رمزُ الجلسةِ ولا بصمتُه.

# ── رموزُ الرفض ──
# مُقابَلةٌ بـ`AUTHN_ERRORS` في `src/authn/king-auth.mjs` في الاتجاهين.
refusalCodes:
  - AUTHN_CONFIG_INVALID
  - AUTHN_AUDIT_REQUIRED
  - AUTHN_IDENTITY_UNVERIFIED
  - AUTHN_DEVICE_UNKNOWN
  - AUTHN_DEVICE_REVOKED
  - AUTHN_FACTOR_REQUIRED
  - AUTHN_FACTOR_INVALID
  - AUTHN_FACTOR_REPLAYED
  - AUTHN_FACTOR_LEDGER_UNREADABLE
  - AUTHN_SECRET_MISSING
  - AUTHN_SESSION_INVALID
  - AUTHN_SESSION_EXPIRED
  - AUTHN_ASSURANCE_INSUFFICIENT

# ── الضمانات ──
guarantees:
  - id: G-AUTHN-SECOND-FACTOR
    statement: >-
      لا تُفتح جلسةٌ قويةٌ بلا رمزِ عاملٍ ثانٍ صحيحٍ لخطوةٍ زمنيةٍ مقبولة؛
      والمفتاحُ وحدَه لا يفتح جلسة.
    enforcedBy: src/authn/king-auth.mjs
    codes: [AUTHN_FACTOR_REQUIRED, AUTHN_FACTOR_INVALID]

  - id: G-AUTHN-SINGLE-USE
    statement: >-
      رمزُ العاملِ يُستهلَك مرّةً واحدةً لكلِّ جهازٍ وخطوةٍ زمنية، فلا يُعاد
      استعمالُ رمزٍ رُئي.
    enforcedBy: src/authn/king-auth.mjs
    codes: [AUTHN_FACTOR_REPLAYED]

  - id: G-AUTHN-TRUSTED-DEVICE
    statement: >-
      الجهازُ لا يُقبل إلا معلَناً موثوقاً في هذه الوثيقة، والمسحوبُ منه الثقةُ
      يُرفض باسمِه لا مجهولاً.
    enforcedBy: src/authn/king-auth.mjs
    codes: [AUTHN_DEVICE_UNKNOWN, AUTHN_DEVICE_REVOKED]

  - id: G-AUTHN-KING-ONLY
    statement: هويةُ الملكِ وحدَها تفتح جلسةً قوية، ولا يفتحها وكيلٌ ولا وزيرٌ ولا مراقب.
    enforcedBy: src/authn/king-auth.mjs
    codes: [AUTHN_IDENTITY_UNVERIFIED]

  - id: G-AUTHN-SHORT-SESSION
    statement: >-
      الجلسةُ تنتهي بمهلتِها المعلَنةِ من لحظةِ فتحِها ولا تُمدَّد باستعمال،
      ورمزٌ لا تعرفه الجلساتُ يُرفض.
    enforcedBy: src/authn/king-auth.mjs
    codes: [AUTHN_SESSION_INVALID, AUTHN_SESSION_EXPIRED]

  - id: G-AUTHN-FAIL-CLOSED
    statement: >-
      بلا سجلٍّ دائمٍ لا مصادقة، وبلا سرِّ عاملٍ مقروءٍ لا مصادقة؛ والنقصُ رفضٌ
      مُسمّىً لا سماحٌ صامت.
    enforcedBy: src/authn/king-auth.mjs
    codes: [AUTHN_AUDIT_REQUIRED, AUTHN_SECRET_MISSING, AUTHN_CONFIG_INVALID]

  - id: G-AUTHN-SOVEREIGN-GATE
    statement: >-
      أمرُ الديوانِ من نوعٍ مشترطٍ يُرفض بلا جلسةٍ قويةٍ قائمة، ورفضُه يُسجَّل
      برمزِه. والرفعُ من هنا والتغليفُ في الديوانِ بـ`CONSOLE_AUTHENTICATION_REQUIRED`
      يُقابله حاجزُ `scripts/guard-king-auth.mjs` في قاعدتِه السادسة.
    enforcedBy: src/authn/king-auth.mjs
    codes: [AUTHN_ASSURANCE_INSUFFICIENT]
