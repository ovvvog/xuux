# سياسةُ الوقتِ المُبرهَنِ — إغلاقُ الدَّينِ `D-7` (‏`WL-192`).
#
# كلُّ حدٍّ هنا **بياناتٌ تُقرأُ لا رقمٌ في الكودِ**: من يُشدِّدُ أو يُرخي حدَّ
# وقتٍ يفعلُه في ملفٍ واحدٍ يُراجَعُ في فرقٍ، لا في سطرٍ مدفونٍ في وحدةٍ.
#
# حدودٌ معلَنةٌ عندَ موضعِ القراءةِ:
#   • المصادرُ أدناه مأخوذةٌ من قائمةِ خوادمِ Roughtime المنشورةِ
#     (‏`https://github.com/cloudflare/roughtime/blob/master/ecosystem.json`)،
#     ولم يُقَس نداءُ أيٍّ منها من بيئةِ البناءِ: الخروجُ على UDP مُغلَقٌ فيها
#     (مقيسٌ بمحاولةٍ إلى ثلاثةِ خوادمَ، فانقضت المُهلةُ في الثلاثةِ).
#     فالمِفتاحُ والعنوانُ منقولانِ عن مصدرٍ منشورٍ لا مُتحقَّقٌ منهما بنداءٍ.
#   • اللهجةُ المُعلَنةُ لكلِّ مصدرٍ `ietf`، وهي **غيرُ مقيسةٍ بمتَّجهاتٍ خارجيّةٍ**
#     — قِيسَت بشاهدٍ محليٍّ على مِقبسٍ حقيقيٍّ فقط. ولهجةُ `google` هي المقيسةُ
#     بمتَّجهاتٍ خارجيّةٍ في `tests/fixtures/roughtime/`.
#   • تشغيلٌ في بيئةٍ بلا خروجٍ على UDP لا يحصلُ على بُرهانِ وقتٍ، فيُرفَضُ
#     المسارُ السياديُّ فشلاً مُغلَقاً (‏`ATTESTED_TIME_REQUIRED`). وهذا مقصودٌ:
#     مهلةٌ تُقاسُ على ساعةٍ لا بُرهانَ لها ليست مهلةً.
version: 1

# النِّصابُ: أدنى عددِ مصادرَ يتحقَّقُ توقيعُها وتتقاطعُ فتراتُها.
# لا يقلُّ عن اثنين: مصدرٌ واحدٌ موقَّعٌ يكفي لكشفِ من على المسارِ، ولا يكشفُ
# **المصدرَ نفسَه** إن كذبَ — وكذبُ مصدرٍ واحدٍ لا يُكشَفُ إلا بخلافِ ثانٍ.
quorum: 2

# أوسعُ نصفِ قُطرٍ مقبولٍ في رَدٍّ واحدٍ. رَدٌّ بفترةٍ أوسعَ يُرفَضُ: بُرهانٌ
# فترتُه أوسعُ من المهلةِ السياديّةِ لا يُبنى عليه قبولُ أمرٍ ولا رفضُه.
maxRadiusMs: 3000

# عمرُ صلاحيةِ البُرهانِ. بُرهانٌ أقدمُ منه يُقرأُ معدوماً لا مقبولاً:
# بُرهانُ وقتٍ لا ينتهي ليس بُرهاناً على **الآنِ** بل على ماضٍ.
maxAgeMs: 900000

# أقصى خلافٍ مقبولٍ بينَ ساعةِ الجهازِ والوقتِ المُبرهَنِ قبلَ إعلانِ ساعةِ
# الجهازِ غيرَ موثوقةٍ. لا يُستعملُ لرفضِ البُرهانِ — البُرهانُ يعلو على ساعةِ
# الجهازِ لا العكسُ — بل لإظهارِ الانزياحِ في التقريرِ وفي أداةِ الفحصِ.
maxLocalSkewMs: 5000

# مُهلةُ سؤالِ مصدرٍ واحدٍ.
requestTimeoutMs: 3000

sovereign:
  # رفضُ الساعةِ غيرِ المُبرهَنةِ في المسارِ السياديِّ (‏معيارُ إغلاقِ `D-7`).
  requireAttestedTime: true

