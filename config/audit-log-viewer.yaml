# عارض سجل التدقيق — الخطوة `M9.07` (بند P1)
#
# **العيب الذي تُغلقه هذه الوثيقة:** صار للدولة سجلٌّ دائمٌ متسلسل التجزئة منذ
# `M2`، وصارت كل طبقة بعده تكتب فيه أثرها **قبل** فعلها: `monitor.read` من
# `M9.01`، و`api.call` من `M9.02`، وقبول الديوان ورفضه من `M9.03`، وجلسات
# المصادقة القوية من `M9.04`، وقيود الحوادث من `M9.05`، وخطوات الأزمة من
# `M9.06`. فصار السجلُّ شاهدَ الدولة كلها — **ولا موضع واحد يُقرأ منه**. ومن أراد
# أن يعرف من فعل ماذا ومتى فتح ملف `.jsonl` بيده، ومن أراد أن يعرف أصحيحٌ ما
# يقرأ حسب التجزئة ذهناً أو صدَّق. والمساءلة التي شرطها محرِّرُ نصوصٍ ليست
# مساءلةً مرئية.
#
# **القاعدة الحاكمة في هذه الوثيقة: لا مشهدَ بلا حكمِ سلامة.** كل مشهد معلَن هنا
# يُعيد صفوفَه **ومعها حكمُ سلامة السلسلة** المقروءُ من نفس القراءة — لا من فحص
# ثانٍ قد يُنسى ولا من زرٍّ اختياري. فمن بحث في سجلٍّ مُعبَثٍ به رأى نتيجة بحثه
# وتحذيرَ العبث معها في الرد نفسه. وهذا معيار القبول بحرفه: «عبث مُصطنع يظهر
# كتحذير سلامة في الواجهة».
#
# **والعارض لا يكتب بايتاً واحداً في المفحوص:** القراءة كلها من `inspectEventLog`
# — الفحص القرائي المحض بلا قفل وبلا اقتطاع الموضوع في `M2.06` لهذا الغرض بعينه.

version: 1

statement: >-
  عارض سجل التدقيق يقرأ شهادة الدولة ولا يملك قدرة كتابة واحدة عليها: مشاهده
  الثلاثة مُعلَنة هنا بأوجهها ومصدرها، ومصدرها ملفُّ السجل وحده لا مستودعٌ ولا
  مسار، وكل نداء يُسجَّل في السجل **قبل** فتح المفحوص فقراءةٌ بلا أثر تدقيقٍ لا
  تقع، وكل مشهد يُعيد معه حكمَ سلامة السلسلة فصفوفٌ بلا حكمٍ لا تخرج من هذا
  السطح أصلاً، وفوق حد الصفوف المُعلَن رفضٌ مُسمّىً لا اقتطاعٌ صامت، والصفوف
  المُعادة صورٌ مُجمَّدة تجميداً عميقاً.

# ── التدقيق على التدقيق ──
#
# ومن طالع سجل التدقيق يُدقَّق عليه: القيد يُكتب قبل فتح الملف، والحكم يُكتب بعد
# قراءته — حدثاً حين تسلم السلسلة، وحدثاً آخر باسمه حين تُحذِّر، فلا يُقرأ
# التحذير بحثاً في نص رسالة بل يُلتقط بنوع حدثه.
audit:
  viewEvent: audit.view.read
  viewRefusedEvent: audit.view.read.refused
  integrityEvent: audit.integrity.verified
  integrityWarnedEvent: audit.integrity.warned
  statement: >-
    القيد يُكتب قبل الأثر لا بعده: من سجَّل بعد القراءة فقد ما وقع ثم أخفق
    التسجيل — أي مطالعةٌ لشهادة الدولة لا يعلم بها أحد. والثمن مُعلَن: قد يُكتب
    قيدٌ لقراءةٍ أخفقت بعدها، فنسجّل زائداً لا ناقصاً. وحكم السلامة يُكتب حدثاً
    مستقلاً باسمه كي يُلتقط التحذير بنوعه لا بنصّ رسالته.

# ── البحث ──
#
# والحقول المسموح البحثُ عليها هي حقولُ `EventRecord` المُعلَنة في
# `src/root-of-trust/event-log.mts` وحدها، ويقابلها الحاجز في الاتجاهين (R2):
# فحقلٌ هنا لا وجود له في الحدث بحثٌ لا يُطابق شيئاً أبداً، وهو أسوأ من رفض.
# وأما جسم `data` فحرُّ الشكل، والبحث فيه بحثٌ بلا عقد يُقاس عليه فلم يُعلَن.
search:
  fields:
    - id
    - seq
    - type
    - actor
    - at
    - previousHash
    - hash
  # حدُّ الصفوف في نداء واحد. والحد ليس تجميلاً: قراءةٌ بلا حدٍّ على سجلٍّ
  # بملايين القيود مسحٌ كامل يُخفي كلفته — وهو نفس حدِّ `maxRows` في
  # `config/monitoring.yaml` عدداً وسبباً.
  maxRows: 500
  maxTermLength: 200
  statement: >-
    البحث نصّيٌّ على حقلٍ معلَن ومصطلحٍ غير فارغ، وفوق حد الصفوف المُعلَن رفضٌ
    مُسمّىً لا اقتطاعٌ صامت: من عرض أول خمسمئة من ألفٍ وسمّاها «النتيجة» أخفى
    نصف الشهادة في موضع المساءلة، ومن بحث بمصطلحٍ فارغ مسح السجل كله باسم بحث.

# ── السلامة ──
#
# وأسباب الانكسار مُعلَنة هنا بأسمائها نصّاً، ويقابلها الحاجزُ بثابت
# `ChainBreakReasons` في `src/root-of-trust/event-log.mts` في الاتجاهين (R2):
# فسببٌ يعرفه جذر الثقة ولا تعلنه هذه الوثيقة تحذيرٌ يظهر بلا اسمٍ يُتصرَّف عليه،
# وسببٌ تعلنه ولا يرفعه الجذر وعدٌ لا يقع.
integrity:
  breakReasons:
    - SEQUENCE_MISMATCH
    - PREVIOUS_HASH_MISMATCH
    - HASH_MISMATCH
  severity: critical
  statement: >-
    التحذير أوسع من انكسار السلسلة: ذيلٌ ناقص أو رأسٌ لا يوافق عددَ الأحداث
    وتجزئتَها عبثٌ أو تعطُّلٌ في الحالين، وكلاهما يستحق أن يُرى في موضع
    المساءلة. والسلامة سلامةُ سلسلةٍ لا سلامةُ صدق: تُثبت أن الصفوف لم تُبدَّل
    بعد كتابتها، ولا تُثبت أن ما كُتب كان صادقاً حين كُتب.

# ── رموز الرفض ──
#
# متقابلة في الاتجاهين مع `AUDIT_VIEWER_ERRORS` في
# `src/audit-viewer/audit-log-viewer.mjs`: رمزٌ يرفعه الكود ولا تعلنه الوثيقة
# رفضٌ يفاجئ قارئه، ورمزٌ تعلنه الوثيقة ولا يرفعه كودٌ وثيقةٌ تكذب.
refusalCodes:
  - AUDIT_VIEWER_CONFIG_INVALID
  - AUDIT_VIEWER_AUDIT_REQUIRED
  - AUDIT_VIEWER_VIEW_UNDECLARED
  - AUDIT_VIEWER_SOURCE_MISSING
  - AUDIT_VIEWER_LOG_UNREADABLE
  - AUDIT_VIEWER_FIELD_UNDECLARED
  - AUDIT_VIEWER_TERM_INVALID
  - AUDIT_VIEWER_RANGE_INVALID
  - AUDIT_VIEWER_ROWS_EXCEEDED
  - AUDIT_VIEWER_CLOCK_INVALID
  - AUDIT_VIEWER_INTEGRITY_BROKEN

# ── المشاهد ──
#
# ثلاثة أوجه سمّاها نص الخطوة بحرفه: «بحث، تسلسل زمني، تحقّق سلامة السلسلة داخل
# الواجهة» — وجهٌ بمشهدٍ واحد لا أكثر ولا أقل، يحرسه R1.
views:
  - id: view:search
    face: search
    source: log:events
    purpose: بحثٌ نصّيٌّ في قيود السجل على حقلٍ معلَنٍ من حقول الحدث.

  - id: view:timeline
    face: timeline
    source: log:events
    purpose: تسلسلُ القيود الزمنيُّ في مدًى اختياريِّ الحدَّين، مرتَّباً بالتسلسل صعوداً.

  - id: view:integrity
    face: integrity
    source: log:events
    purpose: حكمُ سلامة السلسلة مفصَّلاً بموضع الانكسار وسببه وحال الرأس والذيل.

# ── الضمانات ──
guarantees:
  - id: G-AUDIT-VIEW-DECLARED
    statement: >-
      مشهدٌ غير معلَن في هذه الوثيقة لا يُقرأ ولا يخترعه المُنادي، والأوجه
      الثلاثة كلها معلَنة مرّةً واحدة لا أكثر ولا أقل.
    enforcedBy: src/audit-viewer/audit-log-viewer.mjs
    codes: [AUDIT_VIEWER_VIEW_UNDECLARED, AUDIT_VIEWER_CONFIG_INVALID]

  - id: G-AUDIT-VERDICT-ALWAYS
    statement: >-
      كل مشهد يُعيد معه حكمَ سلامة السلسلة مقروءاً من نفس القراءة التي أعطته
      صفوفَه؛ فما من طريقٍ في هذا السطح يُخرج صفوفاً بلا حكمٍ يرافقها، ومن أراد
      الحكم وحده رُدَّ عليه برمزٍ مُعلَن إن كان مُحذِّراً.
    enforcedBy: src/audit-viewer/audit-log-viewer.mjs
    codes: [AUDIT_VIEWER_INTEGRITY_BROKEN]

  - id: G-AUDIT-SOURCE-WIRED
    statement: >-
      مصدرٌ غير موصولٍ أو ملفُّ سجلٍّ غيرُ موجودٍ رفضٌ مُسمّىً لا مشهدٌ فارغٌ
      يُقرأ «لا شيءَ وقع»؛ فمن رأى صفراً بلا مفحوصٍ رأى كذباً مُطمئناً.
    enforcedBy: src/audit-viewer/audit-log-viewer.mjs
    codes: [AUDIT_VIEWER_SOURCE_MISSING, AUDIT_VIEWER_LOG_UNREADABLE]

  - id: G-AUDIT-BEFORE-READ
    statement: >-
      بلا سجلٍّ دائمٍ موصولٍ لا مشهد، وقيدُ القراءة يُكتب قبل فتح المفحوص فلا
      مطالعةَ لشهادة الدولة بلا أثرٍ يشهد على من طالعها ومتى.
    enforcedBy: src/audit-viewer/audit-log-viewer.mjs
    codes: [AUDIT_VIEWER_AUDIT_REQUIRED]

  - id: G-AUDIT-DECLARED-CRITERIA
    statement: >-
      البحث لا يقع إلا على حقلٍ معلَنٍ بمصطلحٍ مقبولٍ طولاً، والتسلسل لا يقع إلا
      في مدًى مقروءٍ غيرِ مقلوب، وفوق حدِّ الصفوف المُعلَن رفضٌ مُسمّىً لا اقتطاع.
    enforcedBy: src/audit-viewer/audit-log-viewer.mjs
    codes:
      [
        AUDIT_VIEWER_FIELD_UNDECLARED,
        AUDIT_VIEWER_TERM_INVALID,
        AUDIT_VIEWER_RANGE_INVALID,
        AUDIT_VIEWER_ROWS_EXCEEDED,
      ]

  - id: G-AUDIT-INJECTED-CLOCK
    statement: >-
      كل قياس زمنٍ في العارض من ساعةٍ مُمرَّرة تُعطي عدداً منتهياً غير سالب،
      وساعةٌ تُعطي غير ذلك تُرَدُّ برمزٍ مُعلَن ولا يُختم بها قيدٌ ولا حكم.
    enforcedBy: src/audit-viewer/audit-log-viewer.mjs
    codes: [AUDIT_VIEWER_CLOCK_INVALID]

  - id: G-AUDIT-READ-ONLY
    statement: >-
      العارض لا يكتب بايتاً واحداً في المفحوص ولا يقفله ولا يقتطعه: القراءة كلها
      من `inspectEventLog`، ولا مستودعَ في يده ولا نداءَ كتابةٍ واحد. وغيابُ
      نداء الكتابة نصّاً من `src/audit-viewer/` يحرسه
      `scripts/guard-audit-viewer.mjs` (R5) لا زمنُ التشغيل. والصفوف المُعادة
      صورٌ مُجمَّدة تجميداً عميقاً لا مراجعُ حالةٍ حيّة.
    enforcedBy: src/audit-viewer/audit-log-viewer.mjs
    codes: [AUDIT_VIEWER_CONFIG_INVALID]
