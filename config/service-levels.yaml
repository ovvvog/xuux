# مستويات الخدمة — الخطوة `M10.02`
#
# **العيب الذي تُغلقه هذه الوثيقة:** بعد `M10.01` صار للنداء الواحد أثرٌ واحد،
# وصارت خمسةُ مقاييسَ تُجمع في العملية بأسماءٍ معلَنة. فمن سأل «كم نداءً وكم
# استغرق وكم رُفض؟» وجد جوابَه رقماً. **ومن سأل «وهل هذا الرقم مقبول؟» لم يجد
# شيئاً.** فالمقياس بلا هدفٍ معلَنٍ رقمٌ يُقرأ بمزاج قارئه: مئةُ رفضٍ في ألفِ
# نداءٍ يقرؤها المتفائل «تسعون بالمئة نجاح» ويقرؤها المتشائم «عُشرُ الدولة
# مُعطَّل»، **وكلاهما يقرأ الرقمَ نفسَه**. وأسوأُ منه أن غياب الهدف يجعل
# التدهور التدريجيَّ غيرَ مرئيّ: من انحدر من 99.9% إلى 99.0% في شهرٍ لم يُخفق
# في يومٍ بعينه، فلا يقع حدثٌ يُنبِّه — ويُكتشف الانحدار حين يصير عطلاً.
#
# **القاعدة الحاكمة في هذه الوثيقة: لا مقياسَ بلا هدفٍ يُقاس عليه، ولا هدفَ بلا
# ميزانيةِ أخطاءٍ تُستهلَك بأرقام، ولا رقمَ يُقاس مرّتين من مصدرين.** فكلُّ
# هدفٍ هنا يقرأ **مقاييسَ `config/telemetry.yaml` نفسَها** لا قياساً ثانياً
# يُستحدَث له، وكلُّ مقياسٍ معلَنٍ هناك **يجب أن يكون له هدفٌ هنا** وإلا رُدَّ
# التركيب بـ`SLO_METRIC_ORPHANED` — فمقياسٌ يُجمَع ولا يُقاس عليه عمودٌ في
# لوحةٍ يُملأ ولا يُقرأ. وهذا معيار القبول بحرفه: «لوحة تُظهر الأهداف والانحراف
# بأرقام».
#
# **والأهداف بياناتٌ لا كود:** لا رقمَ هدفٍ ولا عتبةَ زمنٍ مكتوبةٌ في
# `src/service-levels/`؛ يحرس ذلك الحاجزُ نصّاً (R5)، فمن أراد تشديد هدفٍ أو
# إرخاءه عدَّل سطراً هنا ولم يمسّ محرِّكاً — **ومن عدَّله هنا ظهر تعديلُه في
# فرقِ الالتزام** ولم يُخفَ في فرعٍ من الشيفرة.

version: 1

statement: >-
  مستويات الخدمة معلَنة هنا بأعيانها: لكل قدرةٍ أساسيةٍ أهدافٌ مؤشَّرةٌ بمقاييسَ
  مُعلَنةٍ في وثيقة القياس الموحّد لا بمقاييسَ تُستحدَث لها، ولكل هدفٍ ميزانيةُ
  أخطاءٍ تُشتقّ من الهدف نفسِه لا تُكتب بيدٍ ثانيةٍ فتنحرف عنه، والانحراف يُعرض
  رقماً موجباً أو سالباً لا وصفاً، وما لم يقع منه حدثٌ واحدٌ يُعرض «غير مقيس»
  صراحةً ولا يُقرأ نجاحاً تامّاً، ومقياسٌ معلَنٌ بلا هدفٍ يُرَدُّ به التركيبُ
  برمزٍ مُسمّىً لا يُقبل عموداً فارغاً في لوحة.

# ── النافذة: مقيسة لا مُدَّعاة ──
#
# ولا نافذةَ زمنيةً منزلقةً هنا (لا «آخر ثلاثين يوماً») **وهذا حدٌّ معلَن لا
# نقصٌ مطويّ**: مقاييس `M10.01` أعدادُ عمليةٍ واحدةٍ في ذاكرتها تزول بإعادة
# التشغيل ولا تُجمَّع عبر العمليات، فنافذةٌ تُدَّعى ثلاثين يوماً على عدّادٍ
# عمرُه عمرُ العملية **كذبٌ برقم**. فالنافذة المُعلَنة هي **عمر العملية
# المقيس** بالملّي ثانية من ساعةٍ تُمرَّر، ويُعرض هذا العمر في اللوحة نفسِها
# ليقرأ القارئُ على أيِّ مدًى حُسبت النسبة.
window:
  scope: process
  statement: >-
    النافذة عمرُ العملية لا مدّةٌ تقويمية: العدّادات في ذاكرة العملية تزول
    بإعادة تشغيلها، فمن أعلن نافذةً شهريةً على عدّادٍ عمرُه ساعةٌ أعلن رقماً لا
    مسند له. ودَينُ النافذة الدائمة معلَّق على صادرٍ خارجيٍّ لم يُنفَّذ بعد.

# ── القدرات الأساسية وأهدافها ──
#
# و«القدرة الأساسية» هنا ليست كلَّ ما في الدولة، بل **ما له مقياسٌ مُصدَرٌ من
# موضعِه فعلاً** بعد `M10.01`: مسار النداء على بوابة الواجهة، ومسار القراءة على
# المستودع. وما لم يُقَس لا يُعلَن له هدفٌ — فهدفٌ بلا مؤشِّرٍ وعدٌ لا يُحاسَب
# عليه أحد، وهذا حدٌّ معلَن في `docs/SERVICE_LEVELS.md` لا يُطوى.
capabilities:
  - id: capability:api-call
    statement: >-
      نداءُ بوابة الواجهة الداخلية — المدخل الوحيد المُدقَّق إلى مشاهد الدولة.
      وهي القدرة التي يقيسها المستفيد مباشرةً: إن رُدَّ نداؤه أو أبطأ فقد
      أخفقت الدولة في نظره مهما صحّت طبقاتُها تحته.
    objectives:
      - id: slo:api.availability
        kind: ratio
        totalMetric: api.call.count
        badMetric: api.call.refusals
        target: 0.995
        statement: >-
          نسبةُ النداءات التي لم تُرَدَّ من مجموع ما دخل البوابة. والرفض هنا
          يُحسَب إخفاقاً في القدرة **وإن كان رفضاً مشروعاً** (تفويضٌ ناقصٌ أو
          حدُّ معدَّلٍ): فالميزانية تقيس ما رآه المستدعي لا ما نواه النظام،
          ومن استثنى رفضَه المشروع من حسابه صنع لوحةً خضراءَ دائماً.
      - id: slo:api.latency
        kind: latency
        totalMetric: api.call.count
        durationMetric: api.call.duration
        thresholdMs: 250
        target: 0.99
        statement: >-
          نسبةُ النداءات التي أتمّت دون العتبة المُعلَنة من مجموع ما دخل
          البوابة. والمؤشِّر نسبةُ نداءاتٍ لا نسبةٌ مئويةٌ لمدّة: من أعلن
          «الوسيط 40 ملّي ثانية» أخفى ذيلاً بطيئاً يقع على مستفيدين بأعيانهم.

  - id: capability:state-read
    statement: >-
      القراءةُ من مستودعات الدولة — آخرُ الطبقات في الأثر الواحد. وفصلُها عن
      القدرة التي فوقها هو موضعُ العيب الذي أغلقه `M10.01` بعينه: بطءُ التخزين
      يظهر بطئاً في الواجهة، فما لم يكن له هدفٌ مستقلٌّ نُسب إخفاقُه إلى غير
      موضعه.
    objectives:
      - id: slo:storage.latency
        kind: latency
        totalMetric: storage.read.count
        durationMetric: storage.read.duration
        thresholdMs: 120
        target: 0.99
        statement: >-
          نسبةُ النداءات القارئة على المستودع التي أتمّت دون العتبة المُعلَنة.
          وعتبتُها أضيقُ من عتبة الواجهة قصداً: القراءةُ جزءٌ من النداء لا
          كلُّه، وهدفٌ مساوٍ لهدف الطبقة فوقه يجعل استنفاد التخزين وحدَه
          مستوفياً للهدفين معاً.

# ── ميزانية الأخطاء ──
#
# والميزانية **تُشتقّ من الهدف ولا تُكتب بيدٍ ثانية**: مسموحٌ به = (1 − الهدف) ×
# مجموع الأحداث. فلو كُتبت رقماً مستقلاً لصار في الوثيقة **مصدرا حقيقةٍ لرقمٍ
# واحد** ينحرف أحدهما عن الآخر بأوّل تعديل — وهو العيب الذي رُصد ثلاث مرّات في
# عدّاد الخارطة (`WL-005` و`WL-030` و`WL-052`).
errorBudget:
  statement: >-
    ميزانية الأخطاء مشتقّةٌ من الهدف لا مكتوبةٌ إلى جانبه: المسموح به حاصلُ
    ضرب متمّم الهدف في مجموع الأحداث المقيسة، والمستهلَك عددُ الأحداث المخفقة
    فعلاً، والمتبقّي فرقُهما مع نسبة استهلاكٍ تُعرض رقماً. وما استُنفد يُعرض
    مستنفَداً ويُرَدُّ عند طلب التأكيد بـ`SLO_BUDGET_EXHAUSTED`.
  policy:
    onExhausted: refuse-assertion
    statement: >-
      أثرُ الاستنفاد هنا **مِقبضٌ يُرَدُّ به الطلب** (`assertWithinBudget`) لا
      تجميدُ نشرٍ ولا إيقافُ تغييرٍ: لا مسارَ نشرٍ في المستودع بعد
      (`M10.06`) ولا قناةَ تنبيهٍ (`M10.03`)، **فلا يُدَّعى إنفاذٌ لا موضعَ له**.
      والمُعلَن هو ما يقع: حكمٌ مقروءٌ بأرقامه، ورفضٌ مُسمّىً لمن سأل عن حكمٍ
      استُنفدت ميزانيتُه.

# ── رموز الرفض ──
#
# والتقابل مع `SLO_ERRORS` في `src/service-levels/service-levels.mjs` في
# الاتجاهين يحرسه الحاجز (R3).
refusalCodes:
  - SLO_CONFIG_INVALID
  - SLO_POLICY_REQUIRED
  - SLO_METRICS_REQUIRED
  - SLO_METRIC_UNDECLARED
  - SLO_METRIC_KIND_MISMATCH
  - SLO_METRIC_ORPHANED
  - SLO_OBJECTIVE_UNDECLARED
  - SLO_MEASUREMENT_UNAVAILABLE
  - SLO_BUDGET_EXHAUSTED
  - SLO_CLOCK_INVALID

# ── الضمانات ──
#
# وكل ضمان له رمزٌ وملفُّ إنفاذٍ يجب أن يحمل رمزَه نصّاً، ويقابل الحاجزُ ذلك
# (R4). والضمان الذي لا يُنفَّذ في ملفٍ ضمانٌ يُقرأ ولا يُقاس.
guarantees:
  - id: G-SLO-DECLARED-SIGNALS
    enforcedIn: src/service-levels/service-levels.mjs
    codes:
      - SLO_METRIC_UNDECLARED
      - SLO_METRIC_KIND_MISMATCH
    statement: >-
      لا مؤشِّرَ يقرأ مقياساً غيرَ مُعلَنٍ في وثيقة القياس الموحّد، ولا نوعَ
      مقياسٍ يُبدَّل: عدّادٌ يُقرأ مدرجاً أو العكس يُرَدُّ عند التركيب لا عند
      أوّل قراءةٍ للوحة.

  - id: G-SLO-NO-ORPHAN-METRIC
    enforcedIn: src/service-levels/service-levels.mjs
    codes:
      - SLO_METRIC_ORPHANED
    statement: >-
      كلُّ مقياسٍ معلَنٍ في وثيقة القياس له هدفٌ يقرؤه هنا: مقياسٌ يُجمَع ولا
      يُقاس عليه عمودٌ في لوحةٍ يُملأ ولا يُقرأ، ومن أضاف مقياساً بلا هدفٍ رُدَّ
      تركيبُه لا لوحتُه.

  - id: G-SLO-NO-EMPTY-SUCCESS
    enforcedIn: src/service-levels/service-levels.mjs
    codes:
      - SLO_MEASUREMENT_UNAVAILABLE
    statement: >-
      صفرُ أحداثٍ ليس التزاماً تامّاً: هدفٌ لم يقع تحته حدثٌ واحدٌ يُعرض «غير
      مقيس» بقيمةٍ `null` صريحةٍ لا بنسبةِ مئةٍ في المئة، ومن سأل عن حكمه
      جزماً رُدَّ برمزٍ مُسمّىً.

  - id: G-SLO-OBJECTIVES-ARE-DATA
    enforcedIn: src/service-levels/service-levels.mjs
    codes: []
    statement: >-
      أرقامُ الأهداف والعتبات من الوثيقة لا من الشيفرة: لا رقمَ هدفٍ ولا عتبةَ
      زمنٍ مكتوبةٌ في محرّك اللوحة، فتشديدُ هدفٍ سطرٌ في وثيقةٍ يظهر أثرُه في
      الفرق لا تعديلٌ في محرّكٍ يمرّ بلا انتباه.

  - id: G-SLO-SINGLE-SOURCE
    enforcedIn: src/service-levels/service-levels.mjs
    codes:
      - SLO_POLICY_REQUIRED
      - SLO_METRICS_REQUIRED
    statement: >-
      اللوحة تقرأ سجلَّ مقاييس `M10.01` نفسَه ولا تقيس شيئاً من عندها ولا
      تحتفظ بعدّادٍ ثانٍ: مصدرُ الحقيقة واحدٌ، ومن لم يُمرَّر إليه سجلٌّ رُدَّ
      برمزٍ مُسمّىً ولم يُعطَ لوحةً صفريةً تُقرأ قياساً.

  - id: G-SLO-BUDGET-FROM-OBJECTIVE
    enforcedIn: src/service-levels/budget.mjs
    codes:
      - SLO_BUDGET_EXHAUSTED
    statement: >-
      الميزانية مشتقّةٌ من الهدف حساباً لا مكتوبةٌ إلى جانبه: رقمان لشيءٍ واحدٍ
      ينحرف أحدهما عن الآخر، والاستنفاد يُعلَن حكماً ويُرَدُّ به الطلب.

  - id: G-SLO-INJECTED-CLOCK
    enforcedIn: src/service-levels/service-levels.mjs
    codes:
      - SLO_CLOCK_INVALID
    statement: >-
      زمنُ اللوحة من ساعةٍ تُمرَّر لا من ساعة النظام، كحال طبقة القياس تحتها؛
      فعمرُ نافذةٍ لا يُقاد لا يُختبَر، ولوحةٌ لا تُختبَر لا يُحتجّ بأرقامها.

  - id: G-SLO-READ-ONLY
    enforcedIn: src/service-levels/service-levels.mjs
    codes: []
    statement: >-
      قراءةُ اللوحة لا تُبدّل المقيس: لا تصفيرَ لعدّادٍ ولا إضافةَ قيمةٍ ولا
      إفراغَ سجلٍّ عند العرض، فلوحةٌ تستهلك ما تعرضه تجعل القارئَ الثانيَ يرى
      غيرَ ما رأى الأوّل.
