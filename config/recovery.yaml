# عقدُ تجاربِ التعافي الدوريّة — الخطوة `M10.08`
#
# هذه الوثيقةُ **مصدرُ الحقيقةِ الوحيدُ** لزمنِ التعافي المستهدَفِ ولدوريّةِ
# التجربةِ ولأطوارِها وأحكامِها ورموزِ رفضِها وضماناتِها.
#
# **وليس فيها رقمُ نافذةِ الفقدِ (`RPO`) البتّةَ**: مصدرُه الوحيدُ
# `config/regions.yaml` (‏`consistency.maxReplicationLagMs`) ويُشتقُّ منه عند
# تحميلِ العقدِ — الضمان `G-RECOVERY-SINGLE-SOURCE-RPO`. فمن كتب النافذةَ
# مرَّتين شدَّد إحداهما ونسي الأخرى، ثم احتجّ بالرقمِ الذي يُريحه.
#
# ويُحرَس محتواها بالبوابةِ `npm run guard:recovery` (البوابة الحادية والأربعون)
# وبالمخطَّطِ `config/schemas/recovery.schema.json` بـ`additionalProperties: false`.

version: '1.0.0'

# ══════════════════════════════════════════════════════════════════════════
# ١ — العهدُ: زمنُ التعافي المستهدَف
# ══════════════════════════════════════════════════════════════════════════
# رقمٌ **واحدٌ** يُحاسَب عليه زمنُ التجربةِ كاملاً من أوّلِ طورٍ إلى آخرِه.
# ومن تجاوزه فالحكمُ `recovery:missed` برمزِ خروجٍ موجبٍ، لا تحذيرٌ يُقرأ ويُنسى.
objective:
  maxRecoveryMs: 30000
  statement: >-
    تعودُ الدولةُ من نسخةٍ احتياطيّةٍ إلى بيئةٍ نظيفةٍ خاليةٍ تماماً، بحالةٍ
    مُطابَقةٍ بصمةً ملفّاً ملفّاً ومقروءةٍ بعد الاستعادةِ، في مدّةٍ لا تتجاوز
    ثلاثين ثانيةً — وما جاوزها إخفاقٌ مُعلَنٌ لا اجتهادٌ يُبرَّر.

# ══════════════════════════════════════════════════════════════════════════
# ٢ — الدوريّة
# ══════════════════════════════════════════════════════════════════════════
# «رُبعُ سنويّةٍ» رقمٌ لا عبارةٌ. والتأخّرُ عنها يُقاس **من سجلِّ آخرِ تجربةٍ**
# لا من ذاكرةِ إنسانٍ — الضمان `G-RECOVERY-DUE-FROM-LEDGER`.
cadence:
  everyDays: 90
  graceDays: 7
  label: 'ربع سنوية'

# ══════════════════════════════════════════════════════════════════════════
# ٣ — الأطوارُ الأربعةُ مرتَّبةً
# ══════════════════════════════════════════════════════════════════════════
# ترتيبُها **مُلزِمٌ**: من استعاد قبل أن يُفرِّغ استعاد فوقَ حالةٍ قائمةٍ، فما
# قاس استعادةً بل قاس بقاءَ ما كان — الضمان `G-RECOVERY-PHASES-ORDERED`.
phases:
  - id: phase:capture
    order: 1
    purpose: >-
      نسخُ حالةِ الأقاليمِ ودفاترِها إلى جذرِ نسخٍ احتياطيٍّ، وبصمُ كلِّ ملفٍّ
      منها على حدةٍ حتى يُطابَق المُستعادُ لاحقاً بالبصمةِ لا بالظنّ.
  - id: phase:wipe
    order: 2
    purpose: >-
      تفريغُ جذرِ الاستعادةِ تفريغاً تامّاً حتى يصير خالياً فعلاً، فالبيئةُ
      النظيفةُ شرطُ صدقِ القياسِ لا تفصيلٌ إجرائيّ.
  - id: phase:restore
    order: 3
    purpose: >-
      إعادةُ ملفّاتِ النسخةِ الاحتياطيّةِ إلى الجذرِ الخالي، وهي وحدَها
      اللحظةُ التي تُقاس بها الاستعادةُ.
  - id: phase:verify
    order: 4
    purpose: >-
      مطابقةُ بصمةِ كلِّ ملفٍّ مُستعادٍ ببصمتِه المنسوخةِ ثم قراءةُ دفترِ
      الأقاليمِ من المُستعادِ، فنجاحٌ بلا قراءةٍ صمتٌ يُقرأ نجاحاً.

# ══════════════════════════════════════════════════════════════════════════
# ٤ — الأحكامُ ورموزُ خروجِها
# ══════════════════════════════════════════════════════════════════════════
# لكلِّ حكمٍ رمزُ خروجٍ **مُفرَدٌ** يقرؤه المسارُ الآليُّ لا الإنسان.
verdicts:
  - id: recovery:met
    exitCode: 0
    meaning: >-
      استُعيدت الحالةُ كاملةً إلى بيئةٍ نظيفةٍ وطُوبقت بالبصمةِ وقُرئت، وزمنُ
      التعافي ضمنَ العهدِ المعلَن.
  - id: recovery:missed
    exitCode: 74
    meaning: >-
      تمَّت الاستعادةُ غيرَ أنّ زمنَ التعافي جاوز العهدَ المعلَن، أو اختلفت
      بصمةُ ملفٍّ مُستعادٍ عن بصمتِه المنسوخة.
  - id: recovery:unmeasured
    exitCode: 75
    meaning: >-
      لم يقع قياسٌ صالحٌ: طورٌ لم يُنفَّذ، أو نسخةٌ خاويةٌ، أو ساعةٌ لا تُصدر
      عدداً منتهياً — ولا يُقرأ هذا الصمتُ نجاحاً.

# ══════════════════════════════════════════════════════════════════════════
# ٥ — الجذورُ الثلاثة
# ══════════════════════════════════════════════════════════════════════════
source:
  stateRoot: .state/regions
  backupRoot: .state/recovery/backup
  restoreRoot: .state/recovery/restored

# ══════════════════════════════════════════════════════════════════════════
# ٦ — الدفترُ وسجلُّ آخرِ تجربة
# ══════════════════════════════════════════════════════════════════════════
ledger:
  path: .state/recovery/ledger.jsonl
  lastDrillPath: .state/recovery/last-drill.json

# ══════════════════════════════════════════════════════════════════════════
# ٧ — أحداثُ التدقيق
# ══════════════════════════════════════════════════════════════════════════
events:
  - recovery.backup.captured
  - recovery.environment.wiped
  - recovery.state.restored
  - recovery.integrity.verified
  - recovery.drill.completed
  - recovery.drill.refused

# ══════════════════════════════════════════════════════════════════════════
# ٨ — رموزُ الرفض
# ══════════════════════════════════════════════════════════════════════════
# متقابلةٌ في الاتجاهين مع `RECOVERY_ERRORS` في `src/recovery/errors.mjs`:
# لا رمزَ هنا بلا نظيرٍ هناك، ولا رمزَ هناك بلا نظيرٍ هنا.
refusalCodes:
  - code: RECOVERY_CONFIG_INVALID
    when: العقدُ لا يوافق مخطَّطَه أو ينقصه قسمٌ لازم.
  - code: RECOVERY_OBJECTIVE_INVALID
    when: زمنُ التعافي المستهدَف ليس عدداً صحيحاً موجباً منتهياً.
  - code: RECOVERY_CADENCE_INVALID
    when: دوريّةُ التجربةِ أو سماحُها ليسا عددَي أيّامٍ صالحَين.
  - code: RECOVERY_PHASE_ORDER_INVALID
    when: أطوارُ التجربةِ ليست متتاليةً من واحدٍ بلا فجوةٍ ولا تكرار.
  - code: RECOVERY_PHASE_SKIPPED
    when: طورٌ نُفِّذ قبل الذي يسبقه أو طورٌ لم يُنفَّذ أصلاً.
  - code: RECOVERY_VERDICT_UNDECLARED
    when: حُكِم بحكمٍ لا إعلانَ له في العقد.
  - code: RECOVERY_BACKUP_EMPTY
    when: النسخةُ الاحتياطيّةُ بلا ملفٍّ واحدٍ — ونسخةٌ خاويةٌ ليست نسخة.
  - code: RECOVERY_ENVIRONMENT_NOT_CLEAN
    when: جذرُ الاستعادةِ ليس خالياً عند بدءِ الاستعادة.
  - code: RECOVERY_INTEGRITY_MISMATCH
    when: بصمةُ ملفٍّ مُستعادٍ تخالف بصمتَه المنسوخة.
  - code: RECOVERY_RESTORE_INCOMPLETE
    when: عددُ الملفّاتِ المُستعادةِ يخالف عددَ الملفّاتِ المنسوخة.
  - code: RECOVERY_TIME_EXCEEDED
    when: زمنُ التعافي المقيسُ جاوز العهدَ المعلَن.
  - code: RECOVERY_DRILL_OVERDUE
    when: مضى على آخرِ تجربةٍ أكثرُ من الدوريّةِ وسماحِها.
  - code: RECOVERY_LEDGER_INVALID
    when: سجلُّ آخرِ تجربةٍ موجودٌ ولا يُقرأ أو ينقصه تاريخُه.
  - code: RECOVERY_CLOCK_INVALID
    when: الساعةُ المُمرَّرةُ لا تُصدر عدداً صحيحاً منتهياً.

# ══════════════════════════════════════════════════════════════════════════
# ٩ — الضمانات
# ══════════════════════════════════════════════════════════════════════════
# رمزُ كلِّ ضمانٍ **حاضرٌ نصّاً** في ملفِّ إنفاذِه، ويُثبت الحاجزُ حضورَه.
guarantees:
  - id: G-RECOVERY-SINGLE-SOURCE-RPO
    statement: >-
      نافذةُ الفقدِ المقبولةُ تُشتقُّ من عقدِ الأقاليمِ وحدَه ولا يُكتب لها رقمٌ
      في عقدِ التعافي أصلاً.
    enforcedIn: src/recovery/contract.mjs
  - id: G-RECOVERY-PHASES-ORDERED
    statement: >-
      أطوارُ التجربةِ تُنفَّذ بترتيبِها المعلَنِ ولا يُقبَل طورٌ قبل سابقِه ولا
      تجربةٌ ينقصها طور.
    enforcedIn: src/recovery/drill-plan.mjs
  - id: G-RECOVERY-CLEAN-ENVIRONMENT
    statement: >-
      الاستعادةُ لا تقع إلا في جذرٍ خالٍ فعلاً، ووجودُ ملفٍّ واحدٍ فيه يردُّ
      التجربةَ لا يُتغاضى عنه.
    enforcedIn: src/recovery/integrity.mjs
  - id: G-RECOVERY-VERIFIED-BY-DIGEST
    statement: >-
      نجاحُ الاستعادةِ مطابقةُ بصمةٍ ملفّاً ملفّاً لا غيابُ خطأٍ، ونسخةٌ خاويةٌ
      تُرَدُّ ولا تُعَدُّ نجاحاً.
    enforcedIn: src/recovery/integrity.mjs
  - id: G-RECOVERY-NO-EMPTY-SUCCESS
    statement: >-
      تجربةٌ بلا قياسٍ صالحٍ تُحكَم غيرَ مقيسةٍ برمزِ خروجٍ موجبٍ ولا تُقرأ
      بلوغاً للعهد.
    enforcedIn: src/recovery/judgement.mjs
  - id: G-RECOVERY-DUE-FROM-LEDGER
    statement: >-
      موعدُ التجربةِ التاليةِ وحكمُ فواتِها يُحسبان من سجلِّ آخرِ تجربةٍ لا من
      وسيطٍ يُمرَّر ولا من ذاكرةِ منفِّذ.
    enforcedIn: src/recovery/schedule.mjs
  - id: G-RECOVERY-PURE-JUDGEMENT
    statement: >-
      وحداتُ الحكمِ لا تلمس قرصاً ولا تُشغِّل عمليّةً ولا تقرأ ساعةَ جهازٍ،
      فالحكمُ الذي يلمس ما يفحصه يستطيع أن يُصلِحه ثم يُثني عليه.
    enforcedIn: src/recovery/judgement.mjs
  - id: G-RECOVERY-INJECTED-CLOCK
    statement: >-
      كلُّ زمنٍ يُقاس بساعةٍ مُحقَنةٍ تُرَدُّ إن لم تكن عدداً صحيحاً منتهياً،
      واللمسُ كلُّه محصورٌ في جامعِ الوقائع.
    enforcedIn: scripts/lib/recovery-facts.mjs
