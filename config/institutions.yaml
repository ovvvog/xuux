# عهدُ التشغيل المؤسسي — الخطوة M8.05
#
# **العيبُ الذي تعالجه هذه الوثيقة:** كانت المؤسساتُ في هذه الدولة صفوفاً في
# البذرة. `seed/institutions.yaml` يُعلن 143 مؤسسةً كلُّها `status: planned`،
# و`src/registry/loader.mjs` يقرؤها إلى خريطةٍ في الذاكرة تُقاس بعدّادها لا
# بعملها. فلم يكن في المستودع مؤسسةٌ **تستقبل مهمةً** ولا **تُسنِدها إلى وكيل**
# ولا **تستهلك ميزانيةً** ولا **تُنتج تقريراً** — أي لم يكن فيها مؤسسةٌ تعمل، بل
# اسمٌ ومسارٌ ومصدرٌ للاسم.
#
# وهذه الوثيقة تُعلن الشرطَ الذي تصير به المؤسسةُ **مُشغَّلةً فعلاً**: أن يكون
# لها سندٌ في البذرة لا اسمٌ يُخترع هنا، وأنواعُ مهامٍ مُعلَنةٌ لا مهامٌ مفتوحة،
# وميزانيةٌ مُعلَنةُ المقدار تُقيَّد **قبل** التنفيذ، ووكيلٌ مؤهَّلٌ يُسنَد إليه
# العمل، وأثرٌ **يُقاس** في البيانات قبل تسجيل التنفيذ.
#
# **وحدٌّ معلَن أول:** الوثيقةُ تُعلن الشرطَ ولا تُنفِّذه. المنفِّذُ هو
# `src/institutions/institutions.mjs` و`src/institutions/operations.mjs`
# و`src/institutions/executors.mjs`، والحاجزُ الذي يمنع انحرافَ الوثيقةِ عن
# الكود هو `scripts/guard-institutions.mjs` (البوابة 21).
#
# **وحدٌّ معلَن ثانٍ:** المُشغَّلتان هنا **اثنتان** لا 143. والبقيةُ باقيةٌ
# `planned` في البذرة، وهذا هو نصُّ الخطوة M8.05 لا نقصٌ فيها. واختصاصُ كلِّ
# مؤسسةٍ وصلاحياتُها ومساءلتُها كبياناتٍ حاكمةٍ هي الخطوةُ M8.06، فلا تُدَّعى
# هنا: ما يُقاس في هذه الخطوة هو **دورةُ التشغيل** لا حدودُ الاختصاص.
#
# **وحدٌّ معلَن ثالث:** ميزانيةُ المؤسسة محفوظةٌ في صفِّ المؤسسة نفسِه، وقيدُها
# بالتحديث المتفائل على `version`. ودفترُ الحصص الذرّي في `src/policy/quota.mjs`
# (وفيه `'institution'` معلَنٌ أصلاً في `SUBJECT_TYPES`) وميزانيةُ المهام في
# `src/execution/budget.mjs` كلاهما **PostgreSQL وحده**، فلا يُركَّب أيٌّ منهما
# على مستودعٍ ذاكري. وتوحيدُ الدفترين مسجَّلٌ في `docs/REMAINING_WORK.md` لا
# مُدَّعىً إغلاقُه. والفلسفةُ منقولةٌ كما هي عن `budget.mjs`: «نفادُ الميزانية
# يوقف المهمةَ قبل أن تبدأ».

version: 1

# حاملو سلطةِ التشغيل وفعلُ كلٍّ منهم. والفصلُ مقصودٌ ومقيسٌ في المُحمِّل: من
# يطلب العملَ لا يُسنِده، ومن يُنفِّذه لا يُقرّ عنه — ولا يُراجع أحدٌ عملَ نفسه.
holders:
  - role: role:minister
    may: [submit]
    reason: الوزارةُ ترفع المهمّةَ إلى المؤسسة، ولا تُسنِدها إلى وكيلٍ ولا تُنفِّذها ولا تُقرّ تقريرَها.
  - role: role:operator
    may: [assign, execute]
    reason: التشغيلُ يُسنِد المهمّةَ إلى وكيلٍ مؤهَّلٍ ويُنفِّذها، ولا يرفعها ولا يُقرّ عنها تقريراً.
  - role: role:auditor
    may: [report]
    reason: التدقيقُ يستخرج التقريرَ من الصفوف المحفوظة، ولا يرفع مهمّةً ولا يُسنِدها ولا يُنفِّذها.

# شرطُ الإجراء: ما لا يستوفيه مسارٌ لا يُنتج عملاً، ورفضُه يحمل رمزاً مُعلَناً.
procedure:
  # المؤسسةُ المُشغَّلةُ لها سندٌ في `seed/institutions.yaml` بمعرِّفها ذاته:
  # مؤسسةٌ تُخترع في وثيقة التشغيل دولةٌ موازيةٌ لا فرعٌ من هذه.
  requireSeedInstitution: true
  # المهمّةُ من نوعٍ مُعلَنٍ لهذه المؤسسة بعينها: نوعٌ مفتوحٌ يجعل «الاختصاص»
  # كلمةً بلا مقياس، ويسبق الخطوةَ M8.06 بلا حقّ.
  requireDeclaredTaskKind: true
  # الوكيلُ صفٌّ قائمٌ في سجلِّ الهويات، حالتُه نشطةٌ ودورُه من أدوار المؤسسة.
  requireEligibleAgent: true
  # الميزانيةُ تُقيَّد قبل التنفيذ لا بعده: قيدٌ بعد التنفيذ يسمح بتجاوزِ الحدِّ
  # مرّةً واحدةً — وهي المرّةُ التي تهمّ.
  requireBudgetBeforeExecution: true
  # أثرُ التنفيذ يُقاس في مخزنٍ خارج صفِّ المهمّة: بصمةٌ قبل، وبصمةٌ بعد، وفرقٌ.
  # وتنفيذٌ لا يُغيّر شيئاً لا يُسجَّل منفَّذاً.
  requireMeasuredEffect: true
  # موضوعُ المهمّة أقصرُ من هذا لا يُعرَف ما طُلب فيه؛ والحدُّ اجتهادٌ مُعلَنٌ لا
  # برهان. ونفسُ العددِ مكتوبٌ في قيدِ الهجرة 0014 وفي ثابتِ `entities.mjs`،
  # والحاجزُ 21 يفحص وقوعَه في موضعه من القيد.
  minSubjectLength: 20
  # سببُ الرفض مثلُه: رفضٌ بلا سببٍ مكتوبٍ لا يُراجَع عليه شيء.
  minRefusalReasonLength: 20

# الميزانية: وحدةُ القياس وسياسةُ القيد.
budget:
  # اسمُ المورد المُقاس. وهو وصفيٌّ لا مُحاسبيٌّ في هذه الخطوة: لا سعرَ له ولا
  # تسويةَ مع دفترِ الحصص، وذلك حدٌّ مُعلَنٌ أعلاه.
  resource: compute-units
  # القيدُ قبل التنفيذ — تفصيلُ `requireBudgetBeforeExecution` من جهة المال.
  debitBeforeExecution: true
  # ولا ردَّ للمقيَّد إن خرج التنفيذُ بلا أثر: المحاولةُ استهلكت المورد فعلاً،
  # وردُّها يجعل المحاولاتَ الفاشلةَ مجانيةً فتتكرّر بلا حدّ. وهذا اجتهادٌ
  # مُعلَنٌ، وأثرُه مقيسٌ في `tests/institutions/operations.test.mjs`.
  refundOnIneffectiveExecution: false

# آثارُ التنفيذ المُعلَنة. والأثرُ يُطلب **بالاسم** من فهرس المنفِّذين، فاسمٌ
# بلا منفِّذٍ يرفضه المُحمِّل، ومنفِّذٌ بلا اسمٍ في الوثيقة لا يُنادى.
effects:
  - name: publish-service-catalog
    statement: >-
      يكتب مدخلَ خدمةٍ حكوميةٍ في مخزنِ مخرجات المؤسسة، ويُقاس أثرُه بعددِ
      مخرجاتِ المؤسسةِ قبل الكتابة وبعدها لا بعَلَمٍ يُرفع في عمود.
    enforcedBy:
      - src/institutions/executors.mjs
  - name: publish-statistical-bulletin
    statement: >-
      يكتب نشرةً إحصائيةً مشتقّةً من موضوع المهمّة في مخزنِ مخرجات المؤسسة،
      ويُقاس أثرُها بالفرقِ في بصمةِ المخزن لا بادّعاءِ المنفِّذ.
    enforcedBy:
      - src/institutions/executors.mjs

# المؤسستان المُشغَّلتان فعلاً. ومعرِّفُ كلٍّ منهما هو معرِّفُها في البذرة، فلا
# يُخترع هنا كيانٌ لا سندَ له.
pilots:
  - key: digital-administration
    seedId: '027'
    name: وزارة الإدارة الرقمية
    # الأدوارُ المؤهَّلةُ لتنفيذ عملِ هذه المؤسسة. ودورُ الوكيل يُقرأ من سجلِّ
    # الهويات لا من وسيطٍ يُمرَّر عند الإسناد.
    agentRoles: [role:operator]
    budget:
      # ثلاثُ مهامٍ من نوعِها ثم النفاد — وهو ما يجعل حدَّ الميزانية **مقيساً**
      # في اختبارٍ ينفّذ ثلاثاً وتُرفض الرابعة، لا رقماً كبيراً لا يُلمَس.
      allocation: 30
    tasks:
      - kind: service-catalog-entry
        effect: publish-service-catalog
        cost: 10
        statement: >-
          إدراجُ خدمةٍ حكوميةٍ في كتالوج الخدمات الرقمية: مدخلٌ واحدٌ لكل مهمّة،
          وكلفتُه ثلثُ ميزانيةِ المؤسسة المُعلَنة.
  - key: statistics-authority
    seedId: '028'
    name: هيئة الإحصاء
    agentRoles: [role:auditor, role:operator]
    budget:
      # مهمّتان ثم النفاد. والاختلافُ عن الأولى مقصود: حدٌّ واحدٌ لمؤسستين يجعل
      # الاختبارَ يمرّ برقمٍ عامٍّ لا بميزانيةِ كلِّ مؤسسةٍ على حِدَة.
      allocation: 24
    tasks:
      - kind: population-bulletin
        effect: publish-statistical-bulletin
        cost: 12
        statement: >-
          إصدارُ نشرةٍ إحصائيةٍ سكانيةٍ عن موضوعٍ محدَّد: نشرةٌ واحدةٌ لكل
          مهمّة، وكلفتُها نصفُ ميزانيةِ الهيئة المُعلَنة.

# ضماناتُ التشغيل: كلُّ بندٍ رمزُ رفضٍ يقع فعلاً في وحدةِ إنفاذه، والتقابلُ
# محروسٌ في الاتجاهين مع `INSTITUTION_ERRORS` في البوابة 21.
guarantees:
  - code: INSTITUTION_UNKNOWN
    statement: >-
      لا يُشغَّل إلا ما أعلنته هذه الوثيقةُ مُشغَّلاً؛ ومؤسسةٌ تُنادى بمفتاحٍ لا
      عهدَ له لا وجودَ لها في التشغيل.
    enforcedBy:
      - src/institutions/institutions.mjs
      - src/institutions/operations.mjs
  - code: INSTITUTION_SEED_MISSING
    statement: >-
      المؤسسةُ المُشغَّلةُ لها صفٌّ في `seed/institutions.yaml` بمعرِّفها ذاته؛
      ومؤسسةٌ تُخترع في وثيقة التشغيل دولةٌ موازية.
    enforcedBy:
      - src/institutions/institutions.mjs
  - code: INSTITUTION_NOT_COMMISSIONED
    statement: >-
      لا تُستقبَل مهمّةٌ ولا تُنفَّذ ولا يُستخرَج تقريرٌ قبل تأسيسِ المؤسسة
      وتخصيصِ ميزانيتها في صفٍّ محفوظ.
    enforcedBy:
      - src/institutions/operations.mjs
  - code: INSTITUTION_ALREADY_COMMISSIONED
    statement: >-
      المؤسسةُ تُؤسَّس مرّةً واحدة؛ وتأسيسٌ ثانٍ يُعيد الميزانيةَ إلى مقدارها
      الأول فيمحو ما استُهلك.
    enforcedBy:
      - src/institutions/operations.mjs
  - code: INSTITUTION_ROLE_NOT_PERMITTED
    statement: >-
      كلُّ فعلٍ لحامله المُعلَن في هذه الوثيقة؛ ومن يرفع المهمّةَ لا يُسنِدها،
      ومن يُنفِّذها لا يُقرّ عنها تقريراً.
    enforcedBy:
      - src/institutions/operations.mjs
  - code: INSTITUTION_TASK_KIND_NOT_DECLARED
    statement: >-
      المهمّةُ من نوعٍ مُعلَنٍ لهذه المؤسسةِ بعينها؛ ونوعٌ مفتوحٌ يُلغي معنى
      الإسناد المؤسسي.
    enforcedBy:
      # الرفضُ يقع في `taskKindOf` نفسِها لا في مُستدعيها: نوعٌ مجهولٌ يُرفض في
      # كل موضعٍ يُقرأ فيه النوعُ — عند الرفعِ وعند التنفيذ — لا في أحدهما.
      - src/institutions/institutions.mjs
  - code: INSTITUTION_SUBJECT_TOO_SHORT
    statement: >-
      موضوعُ المهمّة يبلغ الحدَّ المُعلَن؛ وموضوعٌ أقصرُ منه لا يُعرَف ما طُلب
      فيه ولا يُقاس أثرُ تنفيذه.
    enforcedBy:
      - src/institutions/operations.mjs
      - src/persistence/entities.mjs
  - code: INSTITUTION_TASK_NOT_FOUND
    statement: مهمّةٌ لا صفَّ لها لا تُسنَد ولا تُنفَّذ؛ ومعرِّفٌ مجهولٌ رفضٌ لا فراغ.
    enforcedBy:
      - src/institutions/operations.mjs
  - code: INSTITUTION_TASK_STATE_INVALID
    statement: >-
      المسارُ مرتَّب: تُستقبَل ثم تُسنَد ثم تُنفَّذ؛ ولا تُنفَّذ مهمّةٌ لم
      تُسنَد ولا تُسنَد مهمّةٌ نُفِّذت أو رُفِضت.
    enforcedBy:
      - src/institutions/operations.mjs
  - code: INSTITUTION_AGENT_NOT_ELIGIBLE
    statement: >-
      الوكيلُ المُسنَد إليه صفٌّ قائمٌ في سجلِّ الهويات، حالتُه نشطةٌ ودورُه من
      أدوار المؤسسة المُعلَنة؛ واسمُ وكيلٍ في عمودٍ ليس وكيلاً.
    enforcedBy:
      - src/institutions/operations.mjs
  - code: INSTITUTION_BUDGET_EXHAUSTED
    statement: >-
      نفادُ الميزانية يوقف المهمّةَ قبل أن تبدأ؛ والمقيَّدُ لا يتجاوز المُخصَّص
      ولو بوحدةٍ واحدة.
    enforcedBy:
      - src/institutions/operations.mjs
  - code: INSTITUTION_EXECUTION_INEFFECTIVE
    statement: >-
      تنفيذٌ لا يُغيِّر بصمةَ مخزنِ المخرجات لا يُسجَّل منفَّذاً بل يُرفض
      ويُسجَّل رفضُه؛ والأثرُ يُقاس لا يُدَّعى.
    enforcedBy:
      - src/institutions/operations.mjs
  - code: INSTITUTION_EFFECT_NOT_REGISTERED
    statement: >-
      أثرٌ مُعلَنٌ في الوثيقةِ بلا منفِّذٍ مُسجَّلٍ باسمه يُرفض عند التنفيذ؛
      واسمُ أثرٍ في وثيقةٍ ليس يداً تُحدثه.
    enforcedBy:
      - src/institutions/operations.mjs
  - code: INSTITUTION_REPORT_EMPTY
    statement: >-
      التقريرُ مُشتقٌّ من صفوفٍ محفوظة؛ ومؤسسةٌ لم تستقبل مهمّةً واحدةً لا
      يُستخرَج منها تقريرٌ يوهم بعملٍ لم يقع.
    enforcedBy:
      - src/institutions/operations.mjs
