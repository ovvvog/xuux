# الحصص كبيانات — M4.07
#
# قبل هذا الملف كانت الحصّة الوحيدة النافذة `maxAgents` في سجل الوكلاء. صارت
# الحصص هنا بياناتٍ يُخصم عليها الاستهلاك في القاعدة (`state.quotas`)، وقيدُ
# `quotas_consumed_within_limit` هو ما يوقف التجاوز — لا تذكّرُ المستدعي أن يفحص.
#
# `resource` يطابق `quotaResource` في `policies.yaml`؛ فعلٌ بلا حصّة معلنة لا
# يُخصم عليه شيء، وهذا حدٌّ معلن لا سماحٌ ضمني بلا حدّ.

version: 1
owner: crown

quotas:
  - resource: agent-creations
    subjectType: agent
    limit: 25
    windowSeconds: 86400
    unit: وكيل/يوم
    reason: تسجيل الوكلاء بلا حدّ يومي يسمح بتفريخ هوياتٍ أسرع من قدرة الرقابة على مراجعتها.
    # المورد نفسه يُقاس بالنداء: تسجيلُ وكيلٍ واحدٍ حدثٌ واحدٌ، فالنداءُ هو الكمّية لا تقريبٌ لها.
    measure:
      kind: calls

  - resource: memory-writes
    subjectType: agent
    limit: 5000
    windowSeconds: 3600
    unit: كتابة/ساعة
    reason: الكتابة المتدفقة تُغرق الذاكرة المؤسسية بضجيج يُخفي ما يستحق الحفظ.
    # المورد نفسه يُقاس بالنداء: كتابةٌ واحدةٌ حدثٌ واحدٌ (كتابة/ساعة)، وحدُّ الحجمِ للكتابةِ الواحدةِ في `config/memory.yaml`.
    measure:
      kind: calls

  - resource: egress-bytes
    subjectType: agent
    limit: 1073741824
    windowSeconds: 86400
    unit: بايت/يوم
    reason: الإخراج المسموح به كمّاً غير محدود يجعل التسريب البطيء غير قابل للتمييز عن العمل.
    # الحدُّ مُعلَنٌ بالبايتِ، فالخصمُ بالبايتِ المقيسِ للحمولةِ فعلاً؛ وخصمُ واحدٍ لكلِّ نداءٍ يجعلُ سقفَ الجيجابايتِ غيرَ نافذٍ (R6-A-02).
    measure:
      kind: measured
      key: bytes

  - resource: inference-tokens
    subjectType: agent
    limit: 100000
    windowSeconds: 3600
    unit: رمز/ساعة
    reason: الاستدلال بلا سقف رمزي يمكّن فاعلاً واحداً من استنزاف قدرة النماذج تدريجياً، فلا يبقى حد المعدل حاجزاً للكلفة.
    # الحدُّ مُعلَنٌ بالرمزِ، فالخصمُ بالرموزِ المقيسةِ: مُدخَلاً عندَ التفويضِ ثمّ تسويةً بالاستهلاكِ الفعليِّ بعدَ التنفيذِ؛ وخصمُ واحدٍ لكلِّ نداءٍ يجعلُ سقفَ المئةِ ألفِ رمزٍ غيرَ نافذٍ (R6-A-02).
    measure:
      kind: measured
      key: tokens

  - resource: budget-allocated
    subjectType: institution
    limit: 10000000
    windowSeconds: 2592000
    unit: وحدة مالية/شهر
    reason: سقف شهري للتخصيص يمنع استنزاف الميزانية بقرارات متفرّقة كلٌّ منها صغير.
    # الحدُّ مُعلَنٌ بالوحدةِ الماليةِ، فالخصمُ بالمبلغِ المقيسِ للتخصيصِ؛ وخصمُ واحدٍ لكلِّ تخصيصٍ يجعلُ السقفَ الشهريَّ عدَّ قراراتٍ لا مبلغاً.
    measure:
      kind: measured
      key: budgetUnits

  - resource: model-deployments
    subjectType: institution
    limit: 10
    windowSeconds: 604800
    unit: تنشيط/أسبوع
    reason: تنشيط النماذج المتسارع يسبق قدرة التقييم، فيصير التقييم إجراءً شكلياً.
    # المورد نفسه يُقاس بالنداء: تنشيطٌ واحدٌ حدثٌ واحدٌ (تنشيط/أسبوع).
    measure:
      kind: calls

  - resource: task-executions
    subjectType: agent
    limit: 200
    windowSeconds: 3600
    unit: مهمة/ساعة
    reason: تنفيذ المهام بلا سقف زمني يجعل وكيلاً واحداً قادراً على استنزاف طاقة التنفيذ كلها، فتصير أولوية الطابور بلا معنى (M5.06).
    # المورد نفسه يُقاس بالنداء: مهمّةٌ واحدةٌ حدثٌ واحدٌ (مهمة/ساعة).
    measure:
      kind: calls
