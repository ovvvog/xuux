# نموذجُ التشغيل المؤسسي — الخطوة M8.06
#
# **العيبُ الذي تعالجه هذه الوثيقة:** أغلقت الخطوةُ `M8.05` دورةَ التشغيل —
# مهمّةٌ تُستقبَل، ووكيلٌ يُسنَد، ومُخصَّصٌ يُقيَّد قبل التنفيذ، وأثرٌ يُقاس،
# وتقريرٌ مُشتقّ — وأعلنت في رأسِ `config/institutions.yaml` وفي رأسِ
# `src/institutions/operations.mjs` حدّاً صريحاً: **أنواعُ المهام أضيقُ من
# الاختصاص، ولا اختصاصَ ولا صلاحياتٍ ولا مساءلةً ولا تقاريرَ دوريةً كبياناتٍ
# حاكمة**. فكانت المؤسسةُ تعمل ولا يقول شيءٌ في المستودع **ما لها أن تعمل فيه**:
# لا مجالَ محدَّداً تُحكم به، ولا صلاحيةً مسمّاةً تُمنح لها وتُحجب عن غيرها، ولا
# جهةَ تُسأل أمامها، ولا سقفَ صرفٍ في مدّةٍ معلومة، ولا موعدَ تقريرٍ يُقاس
# تأخُّرُه. و«الاختصاصُ» في وثيقةٍ نصّيةٍ (`docs/INSTITUTIONAL_OPERATING_MODEL.md`
# كما كان: سبعُ خطواتٍ وفقرةُ فصلٍ) كلامٌ لا يُمنع به فعلٌ واحد.
#
# وهذه الوثيقةُ تُعلن الخمسةَ **بياناتٍ محكومةً بمخطَّطٍ** لا نصّاً: مجالاتُ كلِّ
# مؤسسةٍ وما يُستثنى منها صراحةً، وصلاحياتُها وما يُحرَّم عليها، وربطُ كلِّ نوعِ
# مهمّةٍ بمجالٍ وصلاحيةٍ واحدةٍ بعينها، وسقفُ صرفٍ في مدّةٍ معلومة، وجهةُ
# المساءلةِ وجهةُ التصعيد، ومدّةُ التقرير الدوريِّ ومهلةُ سماحه.
#
# **وحدٌّ معلَن أول:** الوثيقةُ تُعلن ولا تُنفِّذ. المنفِّذُ `src/institutions/mandate.mjs`
# ومسارُ التشغيل في `src/institutions/operations.mjs`، والحاجزُ الذي يمنع انحرافَ
# الوثيقةِ عن الكود هو `scripts/guard-mandates.mjs` (البوابة 22).
#
# **وحدٌّ معلَن ثانٍ:** التفويضُ وسحبُه — أن يُمنح اختصاصٌ لجهةٍ أخرى ثم يُسحب
# بأمرٍ ملكيٍّ — ليس في هذه الخطوة: نصُّه `M8.08`. وما هنا اختصاصٌ **ثابتٌ
# مُعلَنٌ في وثيقةٍ محكومة** يُنفَذ مرّةً في صفٍّ محفوظ، لا اختصاصٌ يُنقل بأمر.
# والإقليمُ والولايةُ والبلديةُ نصُّ `M8.07`، فلا تُدَّعى هنا.
#
# **وحدٌّ معلَن ثالث:** سقفُ المدّة يُحسب من أوقاتِ قيدِ الميزانية في
# `state.institution_tasks` (`budget_debited_at`) لا من دفترِ حصصٍ ذرّيّ، وهو
# **نفسُ الحدّ** المُعلَن في `M8.05` وفي `docs/REMAINING_WORK.md`: محاولتان
# متزامنتان قد تقرآن مجموعَ المدّةِ نفسَه. والذرّيةُ المضمونةُ هي ذرّيةُ
# المُخصَّصِ الكلّيِّ وحدَها (تحديثٌ متفائلٌ على `version` في صفِّ المؤسسة).

version: 1

# أفعالُ هذا النموذج وحاملُ كلٍّ منها. والإنفاذُ فعلٌ سياديٌّ باسم التاج: من
# يملك أن يُنفِذ اختصاصَ مؤسسةٍ يملك أن يُوسِّعه، فلا يكون ذلك لمن يُشغِّلها.
# وإغلاقُ الدورةِ التقريريةِ للتدقيق: لا تُقرّ المؤسسةُ تقريرَ نفسها.
acts:
  enact: role:king
  closeCycle: role:auditor

# شرطُ النموذج: ما لا يستوفيه مسارٌ لا يُنتج عملاً، ورفضُه يحمل رمزاً مُعلَناً.
procedure:
  # لا تُستقبَل مهمّةٌ قبل إنفاذِ نموذجِ تشغيلِ المؤسسة في صفٍّ محفوظ: مؤسسةٌ
  # تعمل بلا اختصاصٍ مُنفَذٍ مؤسسةٌ حدُّها حدُّ من يستدعيها.
  requireEnactedMandate: true
  # كلُّ مهمّةٍ تُعلن **مجالَها** صراحةً، ويُحفظ المجالُ في صفِّها: مجالٌ
  # مُستنبَطٌ من نوعِ المهمّةِ وحدَه لا يُقاس تجاوزُه، لأنّ المتجاوِزَ لا يُعلن.
  requireDeclaredDomain: true
  # ولكلِّ نوعِ مهمّةٍ صلاحيةٌ واحدةٌ مسمّاةٌ تُمنح للمؤسسة أو تُحجب عنها.
  requireGrantedPower: true
  # والتجاوزُ **يُسجَّل صفّاً** لا حادثةً في سجلٍّ تُقرأ مرّةً وتُنسى: مُنِعَ ولم
  # يُسجَّل يعني أنّ المساءلةَ بلا مادّةٍ تُسأل عنها.
  recordBreach: true
  # وسقفُ المدّةِ لازمٌ فعلاً: سقفٌ مُعلَنٌ لا يُفحَص رقمٌ في وثيقة.
  enforcePeriodCeiling: true
  # وتأخُّرُ التقريرِ الدوريِّ عن مهلته يوقف قبولَ مهامٍ جديدةٍ: تقريرٌ دوريٌّ
  # يتأخّر بلا أثرٍ ليس دورياً، وهو موعدٌ في وثيقةٍ لا التزام.
  blockOverdueReporting: true
  # تفصيلُ المخالفة مكتوبٌ بحدٍّ: مخالفةٌ بلا تفصيلٍ مكتوبٍ لا يُسأل عليها أحد.
  # ونفسُ الرقمِ قيدٌ في الهجرة 0015 وثابتٌ في `entities.mjs`، والبوابةُ 22
  # تفحص وقوعَه في موضعه من القيد.
  minBreachDetailLength: 20

# نموذجُ تشغيلِ كلِّ مؤسسةٍ مُشغَّلة. والمفتاحُ هو مفتاحُها في
# `config/institutions.yaml`، والتقابلُ **في الاتجاهين**: مؤسسةٌ مُشغَّلةٌ بلا
# نموذجِ تشغيلٍ مؤسسةٌ بلا حدّ، ونموذجٌ لمؤسسةٍ غيرِ مُشغَّلةٍ إعلانٌ لا محلَّ له.
mandates:
  - key: digital-administration
    jurisdiction:
      # المجالاتُ التي لهذه المؤسسةِ أن تعمل فيها — لا أكثر.
      domains: [digital-services, government-forms]
      # والاستثناءُ مكتوبٌ صراحةً ولو لم يكن في المجالات: منعٌ ضمنيٌّ يُقرأ
      # نقصاً في الإعلان، ومنعٌ صريحٌ يُقرأ قراراً. وهذا المجالُ اختصاصُ هيئة
      # الإحصاء، فتجاوزُ الوزارةِ إليه هو الحالةُ المقيسةُ في اختبار القبول.
      excludes: [population-statistics]
      statement: >-
        وزارةُ الإدارة الرقمية تعمل في الخدمات الرقمية ونماذجِ المعاملات
        الحكومية، ولا تعمل في الإحصاء السكاني ولو طُلب منها ذلك بمهمّةٍ مرفوعة.
    # الصلاحياتُ الممنوحة بالاسم.
    powers: [publish-catalog]
    # والمحرَّمُ يغلب الممنوح: صلاحيةٌ تقع في الاثنين ترفضها الوثيقةُ عند
    # التحميل، وصلاحيةٌ محرَّمةٌ لا تُمنح بامتدادِ مجالٍ ولا بنوعِ مهمّة.
    prohibitions: [publish-bulletin]
    # ربطُ نوعِ المهمّةِ بمجالها وصلاحيتها: النوعُ مُعلَنٌ في
    # `config/institutions.yaml` بكلفته وأثره، وهنا يُعلَن **بحدِّه الحاكم**.
    acts:
      - kind: service-catalog-entry
        domain: digital-services
        power: publish-catalog
    budget:
      # سقفُ الصرفِ في ثلاثين يوماً: 20 وحدةً من مُخصَّصٍ كلّيٍّ مقدارُه 30.
      # والاختلافُ مقصود: مهمّتان في المدّةِ ثم يمنع السقفُ الثالثةَ **قبل** أن
      # ينفد المُخصَّصُ الكلّي، فيُقاس السقفان قياسين مختلفين لا قياساً واحداً.
      periodDays: 30
      ceiling: 20
    accountability:
      # جهةُ المساءلةِ من خارج المؤسسة: دورُ وكلائها `role:operator`، فلا يكون
      # المسؤولُ عنها منهم. ومن يُسأل عن عمله لا يكون هو من يُسائل.
      accountableTo: role:minister
      escalateTo: role:auditor
      statement: >-
        الوزارةُ مسؤولةٌ أمام مجلس الوزراء عن كلِّ مخالفةِ اختصاصٍ أو صلاحيةٍ
        تُسجَّل عليها، وتُصعَّد المخالفةُ إلى التدقيق لأنّه لا يُشغِّلها ولا يُسأل معها.
    reporting:
      # دورةٌ كلَّ ثلاثين يوماً، ومهلةُ سماحٍ سبعةُ أيام بعد انقضاء الدورة. وبعد
      # المهلةِ يوقف التأخُّرُ قبولَ المهامِّ الجديدة.
      periodDays: 30
      graceDays: 7
  - key: statistics-authority
    jurisdiction:
      domains: [population-statistics, economic-statistics]
      excludes: [digital-services]
      statement: >-
        هيئةُ الإحصاء تعمل في الإحصاء السكاني والاقتصادي، ولا تُدرِج خدمةً في
        كتالوج الخدمات الرقمية ولو ملكت وكيلاً بدورٍ يُمكِّنه من ذلك تشغيلياً.
    powers: [publish-bulletin]
    prohibitions: [publish-catalog]
    acts:
      - kind: population-bulletin
        domain: population-statistics
        power: publish-bulletin
    budget:
      # سقفُ المدّةِ 12 من مُخصَّصٍ كلّيٍّ مقدارُه 24: نشرةٌ واحدةٌ في المدّة.
      periodDays: 30
      ceiling: 12
    accountability:
      # دورا وكلاء الهيئة `role:auditor` و`role:operator`، فالتصعيدُ إلى التاج
      # لا إلى التدقيق: لا يُصعَّد إلى من يُشغِّل.
      accountableTo: role:minister
      escalateTo: role:king
      statement: >-
        الهيئةُ مسؤولةٌ أمام مجلس الوزراء عن مخالفاتِ اختصاصها، وتُصعَّد
        مخالفتُها إلى التاج لأنّ التدقيقَ من أدوار وكلائها فلا يُسائل نفسه.
    reporting:
      # مدّةُ التقرير مدّةُ الميزانيةِ نفسُها: دورةٌ تُقرّ ما صُرِف في مدّةٍ
      # أخرى تُقرّ غيرَ ما تُحاسِب عليه، ومهلةُ السماح سبعةُ أيّام.
      periodDays: 30
      graceDays: 7

# ضماناتُ النموذج: كلُّ بندٍ رمزُ رفضٍ يقع فعلاً في وحدةِ إنفاذه، والتقابلُ
# محروسٌ في الاتجاهين مع `MANDATE_ERRORS` في البوابة 22.
guarantees:
  - code: MANDATE_UNKNOWN
    statement: >-
      لا نموذجَ تشغيلٍ إلا لمؤسسةٍ أعلنته هذه الوثيقةُ؛ ومفتاحٌ لا نموذجَ له لا
      حدَّ له، ولا يُشتقّ حدُّه من مؤسسةٍ أخرى.
    enforcedBy:
      - src/institutions/mandate.mjs
  - code: MANDATE_NOT_ENACTED
    statement: >-
      لا تُستقبَل مهمّةٌ ولا تُغلَق دورةٌ قبل إنفاذِ نموذجِ التشغيل في صفٍّ
      محفوظ؛ ونموذجٌ في وثيقةٍ لم يُنفَذ ليس حدّاً نافذاً.
    enforcedBy:
      - src/institutions/mandate.mjs
  - code: MANDATE_ALREADY_ENACTED
    statement: >-
      النموذجُ يُنفَذ مرّةً واحدةً لكلِّ مؤسسة؛ وإنفاذٌ ثانٍ يُعيد كتابةَ
      الاختصاصِ فيمحو حدَّه الأول بلا مسارٍ ولا أثر.
    enforcedBy:
      - src/institutions/mandate.mjs
  - code: MANDATE_ROLE_NOT_PERMITTED
    statement: >-
      الإنفاذُ فعلٌ سياديٌّ باسم التاج، وإغلاقُ الدورةِ للتدقيق؛ ومن يُشغِّل
      المؤسسةَ لا يُوسِّع اختصاصَها ولا يُقرّ تقريرَها الدوري.
    enforcedBy:
      - src/institutions/mandate.mjs
  - code: MANDATE_DOMAIN_NOT_DECLARED
    statement: >-
      كلُّ مهمّةٍ تُعلن مجالَها صراحةً ويُحفظ في صفِّها؛ ومهمّةٌ بلا مجالٍ
      معلَنٍ لا يُقاس تجاوزُها لأنّ المتجاوِزَ لا يُعلن.
    enforcedBy:
      - src/institutions/mandate.mjs
      - src/persistence/entities.mjs
  - code: MANDATE_OUT_OF_JURISDICTION
    statement: >-
      المؤسسةُ لا تعمل في مجالٍ خارجِ اختصاصها المُعلَن ولا في مجالٍ مُستثنىً
      صراحةً؛ والمحاولةُ تُمنع وتُسجَّل صفَّ مخالفةٍ منسوباً إلى جهةِ مساءلتها.
    enforcedBy:
      - src/institutions/mandate.mjs
  - code: MANDATE_ACT_DOMAIN_MISMATCH
    statement: >-
      نوعُ المهمّةِ يُنفَّذ في مجاله المُعلَنِ وحدَه؛ ونوعٌ يُرفع تحت مجالٍ آخرَ
      داخلِ الاختصاص التفافٌ على الحدِّ لا استعمالٌ له.
    enforcedBy:
      - src/institutions/mandate.mjs
  - code: MANDATE_POWER_NOT_GRANTED
    statement: >-
      كلُّ نوعِ مهمّةٍ يقتضي صلاحيةً مسمّاةً ممنوحةً لهذه المؤسسة؛ وصلاحيةٌ غيرُ
      ممنوحةٍ لا تُستعار من مؤسسةٍ أخرى ولا تُشتقّ من مجالٍ مشترك.
    enforcedBy:
      - src/institutions/mandate.mjs
  - code: MANDATE_ACT_PROHIBITED
    statement: >-
      المحرَّمُ يغلب الممنوح؛ وصلاحيةٌ محرَّمةٌ على المؤسسة لا تُمنح لها بامتدادِ
      مجالٍ ولا بنوعِ مهمّةٍ ولا بدورِ وكيلٍ يُمكِّنه تشغيلياً.
    enforcedBy:
      - src/institutions/mandate.mjs
  - code: MANDATE_PERIOD_CEILING_EXCEEDED
    statement: >-
      الصرفُ في المدّةِ المعلَنةِ لا يتجاوز سقفَها ولو بقي من المُخصَّصِ الكلّيّ؛
      ومُخصَّصٌ بلا سقفٍ زمنيٍّ يُستهلَك كلُّه في يومٍ واحد.
    enforcedBy:
      - src/institutions/mandate.mjs
  - code: MANDATE_REPORTING_OVERDUE
    statement: >-
      التقريرُ الدوريُّ التزامٌ لا موعدٌ في وثيقة؛ وتأخُّرُه عن مهلةِ سماحه يوقف
      قبولَ المهامِّ الجديدةِ ويُسجَّل مخالفةً.
    enforcedBy:
      - src/institutions/mandate.mjs
  - code: MANDATE_CYCLE_NOT_DUE
    statement: >-
      الدورةُ تُغلَق بعد انقضاء مدّتها لا قبلها؛ وإغلاقٌ مبكرٌ يُنتج تقريراً عن
      مدّةٍ لم تكتمل فيُقرأ أداءً كاملاً وهو جزءٌ منه.
    enforcedBy:
      - src/institutions/mandate.mjs
  - code: MANDATE_CYCLE_ALREADY_CLOSED
    statement: >-
      لكلِّ مدّةٍ دورةٌ واحدةٌ مُغلَقة؛ ودورتان لمدّةٍ واحدةٍ تقريران يُقرأ
      أحدُهما مكانَ الآخر ويُحتسب العملُ مرّتين.
    enforcedBy:
      - src/institutions/mandate.mjs
