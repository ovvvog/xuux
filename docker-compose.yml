# بيئة البيانات المحلية — الخطوة M3.01
#
# الغرض: أمرٌ واحد (`docker compose up -d`) يُنتج قاعدة PostgreSQL جاهزة
# للهجرات والاختبارات، بلا خطوات يدوية وبلا اعتماد على قاعدة مثبَّتة في جهاز
# المطوّر. قرار اختيار PostgreSQL وبدائله موثَّق في `docs/adr/0001-postgresql.md`.
#
# ⚠ حدٌّ معلن — هذا الملف للتطوير والاختبار وحده، وليس نشراً إنتاجياً:
#   1. المصادقة `trust` داخل الحاوية: لا كلمة مرور. والسبب أن كلمة مرور مكتوبة
#      في المستودع أسوأ من غيابها (المادة 7 من القاعدة الحاكمة تمنع دفع الأسرار)،
#      و«أمرٌ واحد» شرطُ قبولٍ في الخطوة فلا يجوز أن يتوقف على سرٍّ يُوزَّع يدوياً.
#   2. المنفذ مربوط بـ`127.0.0.1` وحده، فلا يُسمع على الشبكة.
#   3. النشر الإنتاجي يلزمه مخزن أسرار وTLS وهوية عمل، وموضعه المسار M10.
#      و`src/persistence/db.mjs` يرفض صراحةً وصلةً بلا TLS في وضع الإنتاج، فلا
#      يُستعمل هذا التسهيل من حيث لا يُقصد.

services:
  postgres:
    image: postgres:18.6-alpine
    container_name: state-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: state
      POSTGRES_USER: state
      # تُقرأ من البيئة إن وُجدت، وإلا فالمصادقة `trust` كما شُرح أعلاه.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_HOST_AUTH_METHOD: ${POSTGRES_HOST_AUTH_METHOD:-trust}
      # ترتيب وتصنيف ثابتان: اختلافهما بين بيئتين يغيّر نتائج الفهارس والمقارنات.
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    command:
      - postgres
      - '-c'
      - 'fsync=on'
      - '-c'
      - 'synchronous_commit=on'
      - '-c'
      - 'log_min_duration_statement=200'
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - state-pgdata:/var/lib/postgresql/data
    healthcheck:
      # `pg_isready` وحدها تكذب أحياناً في أول ثانية، فيُقاس الجهوز باستعلام فعلي.
      test: ['CMD-SHELL', 'psql -U state -d state -c "select 1" >/dev/null 2>&1']
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s

volumes:
  state-pgdata:
    name: state-pgdata
